<script>
/* js/store.js */
/**
 * js/store.js — TOEIC 30 天衝刺平台
 * window.Store：localStorage 狀態讀寫、schema 驗證、匯出/匯入、領域便利方法。
 * 依 docs/DESIGN.md §6。不可變更新（set 一律回傳新物件）。
 * 純 IIFE，不用 ES modules。無 fetch。
 */
(function (window) {
  'use strict';

  var STORAGE_KEY = 'toeic30:state';
  var STATE_VERSION = 2;
  var TOTAL_DAYS = 30;
  var ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  var QUIZ_MODES = ['quiz', 'listening', 'mock'];

  // 錯題 Leitner 排程：box 1..5，index = box - 1，單位為天。
  // 比單字 SRS 更密（30 天衝刺內要讓錯題至少再遇到 2–3 次），box 5 視為精通。
  var WRONG_INTERVAL_DAYS = [1, 2, 4, 7, 14];
  var WRONG_MAX_BOX = 5;

  // 錯因分類（review 三層檢討法用）：''（未標記）或以下五種
  var WRONG_REASONS = ['vocab', 'grammar', 'misread', 'time', 'guess'];

  // ---- 記憶體 fallback（node / localStorage 不可用或受限環境時）----
  var memoryRaw = null;
  var currentState = null;
  var forcedMemoryMode = false;
  var warnedMemoryFallback = false;

  function warnMemoryFallbackOnce() {
    if (warnedMemoryFallback) return;
    warnedMemoryFallback = true;
    try {
      if (typeof console !== 'undefined' && typeof console.warn === 'function') {
        console.warn('無法使用 localStorage，進度只保留在本次頁面');
      }
    } catch (e) {
      // 忽略沒有 console 的環境
    }
  }

  function switchToMemoryMode() {
    forcedMemoryMode = true;
    warnMemoryFallbackOnce();
  }

  // ---- 小工具 ----
  function pad2(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function parseISODateUTC(iso) {
    var parts = String(iso).split('-').map(Number);
    return Date.UTC(parts[0], parts[1] - 1, parts[2]);
  }

  function addDaysISO(iso, n) {
    var t = parseISODateUTC(iso) + n * 24 * 60 * 60 * 1000;
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }

  function diffDaysISO(aISO, bISO) {
    var msPerDay = 24 * 60 * 60 * 1000;
    return Math.round((parseISODateUTC(bISO) - parseISODateUTC(aISO)) / msPerDay);
  }

  function isPlainObject(v) {
    return typeof v === 'object' && v !== null && !Array.isArray(v);
  }

  function deepClone(obj) {
    if (obj === undefined) return obj;
    return JSON.parse(JSON.stringify(obj));
  }

  /**
   * normalizeWrongId(id) — 統一 P6/P7 子題 key 為 `<groupId>-q<n>`。
   * 舊版 quiz.js 寫入的是 `p6-001-2` / `p7-001-1`（缺 q），而 mock.js、listening.js
   * 與 review.js 都用 `-q<n>`，導致這些錯題在錯題本查不到題目。此函式同時供
   * migration 與 recordQuiz 寫入前使用，確保新舊資料都落在同一格式。
   */
  function normalizeWrongId(id) {
    var s = String(id || '');
    var m = /^(p[67]-\d+)-(\d+)$/.exec(s);
    return m ? (m[1] + '-q' + m[2]) : s;
  }

  /** 錯題 Leitner：依 box 算下次到期日 */
  function wrongDueFrom(box, today) {
    var idx = Math.max(1, Math.min(WRONG_MAX_BOX, box)) - 1;
    return addDaysISO(today, WRONG_INTERVAL_DAYS[idx]);
  }

  /** 補齊錯題項目缺少的欄位（box / due / reason / reviews / rights） */
  function normalizeWrongEntry(entry, todayOverride) {
    var today = todayOverride || todayISO();
    var e = isPlainObject(entry) ? entry : {};
    var box = typeof e.box === 'number' && e.box >= 1 && e.box <= WRONG_MAX_BOX ? Math.round(e.box) : 1;
    return {
      count: typeof e.count === 'number' ? e.count : 0,
      lastAt: e.lastAt || null,
      mastered: !!e.mastered,
      box: e.mastered ? WRONG_MAX_BOX : box,
      due: typeof e.due === 'string' && ISO_DATE_RE.test(e.due) ? e.due : today,
      reason: WRONG_REASONS.indexOf(e.reason) === -1 ? '' : e.reason,
      reviews: typeof e.reviews === 'number' ? e.reviews : 0,
      rights: typeof e.rights === 'number' ? e.rights : 0
    };
  }

  // ---- localStorage 存取（含 node 記憶體 fallback；沙箱 iframe / 隱私模式下存取
  //      window.localStorage 本身或呼叫 getItem/setItem 都可能丟 SecurityError /
  //      QuotaExceededError，任一失敗即永久切換到記憶體模式，只 warn 一次，不拋錯）----
  function tryGetLocalStorage() {
    if (forcedMemoryMode) return null;
    try {
      if (typeof window === 'undefined' || !('localStorage' in window)) {
        switchToMemoryMode();
        return null;
      }
      var ls = window.localStorage;
      if (!ls || typeof ls.getItem !== 'function' || typeof ls.setItem !== 'function') {
        switchToMemoryMode();
        return null;
      }
      // 探測：部分沙箱環境屬性存在，但實際呼叫方法時才丟錯
      ls.getItem(STORAGE_KEY);
      return ls;
    } catch (e) {
      switchToMemoryMode();
      return null;
    }
  }

  function readRaw() {
    var ls = tryGetLocalStorage();
    if (ls) {
      try {
        return ls.getItem(STORAGE_KEY);
      } catch (e) {
        switchToMemoryMode();
        return memoryRaw;
      }
    }
    return memoryRaw;
  }

  function writeRaw(str) {
    var ls = tryGetLocalStorage();
    if (ls) {
      try {
        ls.setItem(STORAGE_KEY, str);
        return;
      } catch (e) {
        // 寫入失敗（配額等）→ 永久切換到記憶體，不中斷流程
        switchToMemoryMode();
      }
    }
    memoryRaw = str;
  }

  function isPersistent() {
    return !!tryGetLocalStorage();
  }

  // ---- schema ----
  function defaultState() {
    return {
      version: STATE_VERSION,
      startDate: todayISO(),
      examDate: '2026-09-20',
      dailyMinutes: 90,
      completedTasks: {},
      tipsMastered: {},
      quizHistory: [],
      wrongBook: {},
      readingStats: {},
      vocab: {},
      streak: { current: 0, best: 0, lastActive: null },
      settings: { ttsRate: 1.0, ttsVoice: '', theme: 'light' }
    };
  }

  /**
   * migrate(state) — 把舊版 state 就地升級到 STATE_VERSION，回傳新物件。
   * v1 → v2：
   *   1. wrongBook / quizHistory.wrongIds 的 P6/P7 子題 key 補上 `q`（見 normalizeWrongId）
   *   2. wrongBook 每筆補上 Leitner 欄位（box/due/reason/reviews/rights）
   *   3. 新增 readingStats（依考點累積正確率與秒數）
   * 無法辨識的 version（例如未來版本或損毀）交由 loadState 的 try/catch 退回預設值。
   */
  function migrate(state) {
    if (!isPlainObject(state)) return state;
    var version = typeof state.version === 'number' ? state.version : 0;
    if (version >= STATE_VERSION) return state;

    var today = todayISO();
    var next = Object.assign({}, state);

    if (version < 2) {
      var oldBook = isPlainObject(state.wrongBook) ? state.wrongBook : {};
      var newBook = {};
      Object.keys(oldBook).forEach(function (rawId) {
        var id = normalizeWrongId(rawId);
        var incoming = normalizeWrongEntry(oldBook[rawId], today);
        var existing = newBook[id];
        // 正規化後可能與既有 key 相撞（舊 `p6-001-2` 與新 `p6-001-q2` 並存）→ 合併
        newBook[id] = existing
          ? Object.assign({}, existing, {
            count: existing.count + incoming.count,
            lastAt: (existing.lastAt || '') > (incoming.lastAt || '') ? existing.lastAt : incoming.lastAt,
            mastered: existing.mastered && incoming.mastered,
            box: Math.min(existing.box, incoming.box),
            due: (existing.due || today) < (incoming.due || today) ? existing.due : incoming.due,
            reason: existing.reason || incoming.reason,
            reviews: existing.reviews + incoming.reviews,
            rights: existing.rights + incoming.rights
          })
          : incoming;
      });
      next.wrongBook = newBook;

      next.quizHistory = (Array.isArray(state.quizHistory) ? state.quizHistory : []).map(function (entry) {
        if (!isPlainObject(entry) || !Array.isArray(entry.wrongIds)) return entry;
        return Object.assign({}, entry, { wrongIds: entry.wrongIds.map(normalizeWrongId) });
      });

      if (!isPlainObject(next.readingStats)) next.readingStats = {};
    }

    next.version = STATE_VERSION;
    return next;
  }

  function validateState(state) {
    if (!isPlainObject(state)) {
      throw new Error('Store: state 必須是物件');
    }
    if (typeof state.version !== 'number') {
      throw new Error('Store: 缺少或錯誤的 version');
    }
    if (typeof state.startDate !== 'string' || !ISO_DATE_RE.test(state.startDate)) {
      throw new Error('Store: startDate 格式錯誤（需 YYYY-MM-DD）');
    }
    if (typeof state.examDate !== 'string' || !ISO_DATE_RE.test(state.examDate)) {
      throw new Error('Store: examDate 格式錯誤（需 YYYY-MM-DD）');
    }
    if (typeof state.dailyMinutes !== 'number') {
      throw new Error('Store: dailyMinutes 必須是數字');
    }
    if (!isPlainObject(state.completedTasks)) {
      throw new Error('Store: completedTasks 必須是物件');
    }
    if (!isPlainObject(state.tipsMastered)) {
      throw new Error('Store: tipsMastered 必須是物件');
    }
    if (!Array.isArray(state.quizHistory)) {
      throw new Error('Store: quizHistory 必須是陣列');
    }
    if (!isPlainObject(state.wrongBook)) {
      throw new Error('Store: wrongBook 必須是物件');
    }
    if (!isPlainObject(state.readingStats)) {
      throw new Error('Store: readingStats 必須是物件');
    }
    if (!isPlainObject(state.vocab)) {
      throw new Error('Store: vocab 必須是物件');
    }
    if (!isPlainObject(state.streak) ||
        typeof state.streak.current !== 'number' ||
        typeof state.streak.best !== 'number') {
      throw new Error('Store: streak 格式錯誤');
    }
    if (!isPlainObject(state.settings) || typeof state.settings.ttsRate !== 'number') {
      throw new Error('Store: settings 格式錯誤');
    }
  }

  function validateQuizPayload(payload) {
    if (!isPlainObject(payload)) {
      throw new Error('Store.recordQuiz: payload 必須是物件');
    }
    if (QUIZ_MODES.indexOf(payload.mode) === -1) {
      throw new Error('Store.recordQuiz: mode 必須是 quiz/listening/mock 之一');
    }
    if (typeof payload.total !== 'number' || payload.total < 0) {
      throw new Error('Store.recordQuiz: total 必須是非負數字');
    }
    if (typeof payload.correct !== 'number' || payload.correct < 0) {
      throw new Error('Store.recordQuiz: correct 必須是非負數字');
    }
    if (typeof payload.seconds !== 'number' || payload.seconds < 0) {
      throw new Error('Store.recordQuiz: seconds 必須是非負數字');
    }
    if (payload.wrongIds !== undefined && !Array.isArray(payload.wrongIds)) {
      throw new Error('Store.recordQuiz: wrongIds 必須是陣列');
    }
    if (payload.skillStats !== undefined && !Array.isArray(payload.skillStats)) {
      throw new Error('Store.recordQuiz: skillStats 必須是陣列');
    }
  }

  // ---- load / persist ----
  function loadState() {
    if (currentState) return currentState;
    var raw = readRaw();
    if (!raw) {
      currentState = defaultState();
      persist(currentState);
      return currentState;
    }
    try {
      var parsed = migrate(JSON.parse(raw));
      validateState(parsed);
      if (parsed.version !== STATE_VERSION) {
        throw new Error('Store: 不支援的 version ' + parsed.version);
      }
      currentState = parsed;
      persist(currentState); // 升級後立即寫回，避免每次載入都重跑 migration
    } catch (e) {
      // 資料損毀 → 退回預設值，不中斷應用程式
      currentState = defaultState();
      persist(currentState);
    }
    return currentState;
  }

  function persist(state) {
    try {
      writeRaw(JSON.stringify(state));
    } catch (e) {
      // 寫入失敗，狀態仍保留在記憶體中，不拋出
    }
  }

  function dispatchChange() {
    if (typeof window === 'undefined' || typeof window.dispatchEvent !== 'function') return;
    var detail = deepClone(currentState);
    var evt;
    try {
      var CE = window.CustomEvent || (typeof CustomEvent !== 'undefined' ? CustomEvent : null);
      evt = CE ? new CE('toeic30:change', { detail: detail }) : { type: 'toeic30:change', detail: detail };
    } catch (e) {
      evt = { type: 'toeic30:change', detail: detail };
    }
    try {
      window.dispatchEvent(evt);
    } catch (e) {
      // 忽略非 DOM 環境的錯誤
    }
  }

  // ---- 核心 API ----
  function get() {
    return deepClone(loadState());
  }

  function set(patchFn) {
    if (typeof patchFn !== 'function') {
      throw new Error('Store.set: patchFn 必須是函式');
    }
    var old = deepClone(loadState());
    var next = patchFn(old);
    validateState(next);
    currentState = deepClone(next);
    persist(currentState);
    dispatchChange();
    return deepClone(currentState);
  }

  function setIn(obj, keys, value) {
    if (keys.length === 0) return value;
    var key = keys[0];
    var rest = keys.slice(1);
    var currentVal = obj ? obj[key] : undefined;
    var newVal = rest.length === 0
      ? value
      : setIn(isPlainObject(currentVal) || Array.isArray(currentVal) ? currentVal : {}, rest, value);
    if (Array.isArray(obj)) {
      var arrCopy = obj.slice();
      arrCopy[key] = newVal;
      return arrCopy;
    }
    var copy = Object.assign({}, obj);
    copy[key] = newVal;
    return copy;
  }

  function update(path, value) {
    var keys = Array.isArray(path) ? path.slice() : String(path).split('.');
    if (keys.length === 0) {
      throw new Error('Store.update: path 不可為空');
    }
    return set(function (old) {
      return setIn(old, keys, value);
    });
  }

  function exportState() {
    return JSON.stringify(loadState(), null, 2);
  }

  function importState(json) {
    var parsed;
    try {
      parsed = JSON.parse(json);
    } catch (e) {
      throw new Error('Store.import: 無法解析 JSON — ' + e.message);
    }
    var received = isPlainObject(parsed) && typeof parsed.version === 'number' ? parsed.version : '（未知）';
    // 舊版備份（v1）先升級再驗證，讓使用者換版本後仍能還原進度
    parsed = migrate(parsed);
    validateState(parsed);
    if (parsed.version !== STATE_VERSION) {
      throw new Error('Store.import: 不支援的 version（預期 ' + STATE_VERSION + '，收到 ' + received + '）');
    }
    currentState = deepClone(parsed);
    persist(currentState);
    dispatchChange();
    return deepClone(currentState);
  }

  function reset() {
    currentState = defaultState();
    persist(currentState);
    dispatchChange();
    return deepClone(currentState);
  }

  // ---- 領域便利方法 ----
  function completeTask(id) {
    if (!id) {
      throw new Error('Store.completeTask: id 為必填');
    }
    return set(function (old) {
      var completedTasks = Object.assign({}, old.completedTasks);
      completedTasks[id] = new Date().toISOString();
      return Object.assign({}, old, { completedTasks: completedTasks });
    });
  }

  function isTaskDone(id) {
    var state = get();
    return !!(state.completedTasks && state.completedTasks[id]);
  }

  function computeNextStreak(streak, today) {
    var current = streak && typeof streak.current === 'number' ? streak.current : 0;
    var best = streak && typeof streak.best === 'number' ? streak.best : 0;
    var lastActive = (streak && streak.lastActive) || null;

    if (lastActive === today) {
      return { current: current, best: best, lastActive: lastActive };
    }
    var yesterday = addDaysISO(today, -1);
    if (lastActive === yesterday) {
      current = current + 1;
    } else {
      current = 1;
    }
    best = Math.max(best, current);
    return { current: current, best: best, lastActive: today };
  }

  function touchStreak(todayOverride) {
    var today = todayOverride || todayISO();
    return set(function (old) {
      return Object.assign({}, old, { streak: computeNextStreak(old.streak, today) });
    });
  }

  /**
   * recordQuiz(payload) — 記錄一次作答。
   * payload: { mode, part, total, correct, seconds, wrongIds?, skillStats? }
   *   skillStats: [{ key: 'P5:prep'|'P6:sentence'|'P7:inference', correct: boolean, seconds: number }]
   *   → 累積到 state.readingStats，供閱讀診斷室（Reading.diagnose）算各考點正確率與配速。
   * 錯題一律回到 box 1（今天到期），並取消先前的「已精通」標記。
   */
  function recordQuiz(payload, todayOverride) {
    validateQuizPayload(payload);
    var wrongIds = (Array.isArray(payload.wrongIds) ? payload.wrongIds : []).map(normalizeWrongId);
    var skillStats = Array.isArray(payload.skillStats) ? payload.skillStats : [];
    var nowIso = new Date().toISOString();
    var today = todayOverride || todayISO();

    return set(function (old) {
      var entry = {
        at: nowIso,
        mode: payload.mode,
        part: payload.part || '',
        total: payload.total,
        correct: payload.correct,
        seconds: payload.seconds,
        wrongIds: wrongIds
      };
      var quizHistory = old.quizHistory.concat([entry]);

      var wrongBook = Object.assign({}, old.wrongBook);
      wrongIds.forEach(function (id) {
        var existing = normalizeWrongEntry(wrongBook[id], today);
        wrongBook[id] = Object.assign({}, existing, {
          count: existing.count + 1,
          lastAt: nowIso,
          mastered: false,
          box: 1,
          due: today
        });
      });

      var readingStats = Object.assign({}, old.readingStats);
      skillStats.forEach(function (s) {
        if (!s || typeof s.key !== 'string' || !s.key) return;
        var prev = readingStats[s.key] || { total: 0, correct: 0, seconds: 0 };
        readingStats[s.key] = {
          total: prev.total + 1,
          correct: prev.correct + (s.correct ? 1 : 0),
          seconds: prev.seconds + (typeof s.seconds === 'number' && s.seconds > 0 ? Math.round(s.seconds) : 0)
        };
      });

      var streak = computeNextStreak(old.streak, today);

      return Object.assign({}, old, {
        quizHistory: quizHistory,
        wrongBook: wrongBook,
        readingStats: readingStats,
        streak: streak
      });
    });
  }

  function markWrongMastered(id) {
    if (!id) {
      throw new Error('Store.markWrongMastered: id 為必填');
    }
    var today = todayISO();
    return set(function (old) {
      var existing = normalizeWrongEntry(old.wrongBook[normalizeWrongId(id)], today);
      var wrongBook = Object.assign({}, old.wrongBook);
      wrongBook[normalizeWrongId(id)] = Object.assign({}, existing, {
        mastered: true,
        box: WRONG_MAX_BOX,
        due: wrongDueFrom(WRONG_MAX_BOX, today)
      });
      return Object.assign({}, old, { wrongBook: wrongBook });
    });
  }

  /**
   * reviewWrong(id, correct) — 錯題本重做一題後更新 Leitner 排程。
   * 答對 → box +1（到 5 即自動標記精通）；答錯 → 退回 box 1，明天再見。
   */
  function reviewWrong(id, correct, todayOverride) {
    if (!id) {
      throw new Error('Store.reviewWrong: id 為必填');
    }
    var today = todayOverride || todayISO();
    var key = normalizeWrongId(id);
    return set(function (old) {
      var existing = normalizeWrongEntry(old.wrongBook[key], today);
      var nextBox = correct ? Math.min(WRONG_MAX_BOX, existing.box + 1) : 1;
      var wrongBook = Object.assign({}, old.wrongBook);
      wrongBook[key] = Object.assign({}, existing, {
        box: nextBox,
        due: wrongDueFrom(nextBox, today),
        mastered: nextBox >= WRONG_MAX_BOX,
        reviews: existing.reviews + 1,
        rights: existing.rights + (correct ? 1 : 0)
      });
      return Object.assign({}, old, { wrongBook: wrongBook });
    });
  }

  /**
   * setWrongReason(id, reason) — 標記錯因（三層檢討法第一層：先分類為什麼錯）。
   * reason 需為 WRONG_REASONS 之一，傳空字串可清除標記。
   */
  function setWrongReason(id, reason) {
    if (!id) {
      throw new Error('Store.setWrongReason: id 為必填');
    }
    var r = reason || '';
    if (r && WRONG_REASONS.indexOf(r) === -1) {
      throw new Error('Store.setWrongReason: 未知的錯因 ' + r);
    }
    var today = todayISO();
    var key = normalizeWrongId(id);
    return set(function (old) {
      var existing = normalizeWrongEntry(old.wrongBook[key], today);
      var wrongBook = Object.assign({}, old.wrongBook);
      wrongBook[key] = Object.assign({}, existing, { reason: r });
      return Object.assign({}, old, { wrongBook: wrongBook });
    });
  }

  /**
   * flagWrong(id, reason) — 手動把一題丟進錯題本（不經過 recordQuiz）。
   * 用於「這題我猜對的」：正確率會騙人，蒙對的題目一樣要排進複習佇列。
   */
  function flagWrong(id, reason) {
    if (!id) {
      throw new Error('Store.flagWrong: id 為必填');
    }
    var r = reason || '';
    if (r && WRONG_REASONS.indexOf(r) === -1) {
      throw new Error('Store.flagWrong: 未知的錯因 ' + r);
    }
    var today = todayISO();
    var nowIso = new Date().toISOString();
    var key = normalizeWrongId(id);
    return set(function (old) {
      var existing = normalizeWrongEntry(old.wrongBook[key], today);
      var wrongBook = Object.assign({}, old.wrongBook);
      wrongBook[key] = Object.assign({}, existing, {
        count: Math.max(1, existing.count),
        lastAt: nowIso,
        mastered: false,
        box: 1,
        due: today,
        reason: r || existing.reason
      });
      return Object.assign({}, old, { wrongBook: wrongBook });
    });
  }

  /** dueWrongIds(today) — 今天（含逾期）該複習、且尚未精通的錯題 id，早到期的排前面 */
  function dueWrongIds(todayOverride) {
    var today = todayOverride || todayISO();
    var wb = loadState().wrongBook || {};
    return Object.keys(wb)
      .filter(function (id) {
        var e = normalizeWrongEntry(wb[id], today);
        return !e.mastered && (e.due || today) <= today;
      })
      .sort(function (a, b) {
        var da = normalizeWrongEntry(wb[a], today).due;
        var db = normalizeWrongEntry(wb[b], today).due;
        if (da !== db) return da < db ? -1 : 1;
        return normalizeWrongEntry(wb[b], today).count - normalizeWrongEntry(wb[a], today).count;
      });
  }

  function getDayIndex(dateISO) {
    var state = loadState();
    var d = dateISO || todayISO();
    var idx = diffDaysISO(state.startDate, d) + 1;
    if (idx < 1) return 0;
    if (idx > TOTAL_DAYS) return TOTAL_DAYS;
    return idx;
  }

  function daysToExam(dateISO) {
    var state = loadState();
    var d = dateISO || todayISO();
    return diffDaysISO(d, state.examDate);
  }

  window.Store = {
    get: get,
    set: set,
    update: update,
    export: exportState,
    import: importState,
    reset: reset,
    completeTask: completeTask,
    isTaskDone: isTaskDone,
    recordQuiz: recordQuiz,
    markWrongMastered: markWrongMastered,
    reviewWrong: reviewWrong,
    setWrongReason: setWrongReason,
    flagWrong: flagWrong,
    dueWrongIds: dueWrongIds,
    normalizeWrongId: normalizeWrongId,
    normalizeWrongEntry: normalizeWrongEntry,
    touchStreak: touchStreak,
    getDayIndex: getDayIndex,
    daysToExam: daysToExam,
    isPersistent: isPersistent,
    WRONG_REASONS: WRONG_REASONS.slice(),
    STATE_VERSION: STATE_VERSION
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/srs.js */
/**
 * js/srs.js — TOEIC 30 天衝刺平台
 * window.SRS：Leitner 5 箱間隔複習演算法。純函式，無副作用、不依賴 Store/localStorage。
 * 卡片形狀對齊 docs/DESIGN.md §6 的 vocab 狀態：{ box, due, seen, wrong }。
 */
(function (window) {
  'use strict';

  var MIN_BOX = 1;
  var MAX_BOX = 5;
  var INTERVAL_DAYS = [0, 1, 3, 7, 14]; // index = box - 1

  function pad2(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function parseISODateUTC(iso) {
    var parts = String(iso).split('-').map(Number);
    return Date.UTC(parts[0], parts[1] - 1, parts[2]);
  }

  function addDaysISO(iso, n) {
    var t = parseISODateUTC(iso) + n * 24 * 60 * 60 * 1000;
    var d = new Date(t);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  }

  function clampBox(box) {
    if (typeof box !== 'number' || isNaN(box)) return MIN_BOX;
    return Math.max(MIN_BOX, Math.min(MAX_BOX, Math.round(box)));
  }

  function initCard(todayOverride) {
    var today = todayOverride || todayISO();
    return { box: MIN_BOX, due: today, seen: 0, wrong: 0 };
  }

  function review(card, correct, todayISO_) {
    var today = todayISO_ || todayISO();
    var prevBox = card && typeof card.box === 'number' ? clampBox(card.box) : MIN_BOX;
    var seen = card && typeof card.seen === 'number' ? card.seen : 0;
    var wrong = card && typeof card.wrong === 'number' ? card.wrong : 0;

    var nextBox;
    if (correct) {
      nextBox = Math.min(MAX_BOX, prevBox + 1);
    } else {
      nextBox = MIN_BOX;
      wrong = wrong + 1;
    }

    var interval = INTERVAL_DAYS[nextBox - 1];
    return {
      box: nextBox,
      due: addDaysISO(today, interval),
      seen: seen + 1,
      wrong: wrong
    };
  }

  function isDue(card, todayISO_) {
    var today = todayISO_ || todayISO();
    if (!card || !card.due) return true;
    return card.due <= today;
  }

  function pickSession(opts) {
    opts = opts || {};
    var cardsMap = opts.cards || {};
    var allIds = Array.isArray(opts.allIds) ? opts.allIds : [];
    var today = opts.todayISO || todayISO();
    var newLimit = typeof opts.newLimit === 'number' ? opts.newLimit : Infinity;
    var reviewLimit = typeof opts.reviewLimit === 'number' ? opts.reviewLimit : Infinity;

    var reviewCandidates = [];
    var newCandidates = [];

    allIds.forEach(function (id) {
      var card = cardsMap[id];
      if (card) {
        if (isDue(card, today)) {
          reviewCandidates.push({ id: id, due: card.due || today });
        }
      } else {
        newCandidates.push(id);
      }
    });

    reviewCandidates.sort(function (a, b) {
      if (a.due < b.due) return -1;
      if (a.due > b.due) return 1;
      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
    });

    newCandidates.sort(function (a, b) {
      return a < b ? -1 : (a > b ? 1 : 0);
    });

    return {
      newIds: newCandidates.slice(0, newLimit),
      reviewIds: reviewCandidates.slice(0, reviewLimit).map(function (c) { return c.id; })
    };
  }

  function stats(cards) {
    cards = cards || {};
    var result = { box1: 0, box2: 0, box3: 0, box4: 0, box5: 0, total: 0 };
    Object.keys(cards).forEach(function (id) {
      var box = clampBox(cards[id] && cards[id].box);
      result['box' + box] += 1;
      result.total += 1;
    });
    return result;
  }

  window.SRS = {
    initCard: initCard,
    review: review,
    isDue: isDue,
    pickSession: pickSession,
    stats: stats
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/reading.js */
/**
 * js/reading.js — 閱讀（Part 5/6/7）診斷引擎
 *
 * window.Reading：純函式模組，只吃傳進來的 state（Store.get() 的結果）與 TOEIC_DATA，
 * 不自己讀寫 localStorage、不碰 DOM，因此可以直接在 node 測試。
 *
 * 提供：
 *   - skillKey(part, question)  把題目對應到考點 key（'P5:prep'、'P7:inference'…）
 *   - SKILL_LABELS / PACE_TARGET / labelFor(key)
 *   - skillBreakdown(state)     各考點正確率 + 平均秒數，附熟練度分級
 *   - paceReport(state)         各 Part 的實際配速 vs 目標配速
 *   - estimateRC(state)         粗估 Reading 分數（5–495）
 *   - reasonBreakdown(state)    錯因分佈
 *   - diagnose(state)           上面全部 + 依優先序排出的行動建議
 *
 * 依賴：無（window.TOEIC_DATA.reading 缺檔時各函式仍能運作，只是少了教材文字）。
 */
(function (window) {
  'use strict';

  // 每題目標秒數。單一真實來源：quiz.js / mock.js / #/reading 都引用這裡，
  // 依 Reading Section 75 分鐘 100 題的官方配置換算（P5 30題10分、P6 16題8分、P7 54題55分）。
  var PACE_TARGET = { P5: 20, P6: 30, P7: 60 };

  var SKILL_LABELS = {
    'P5:pos': '詞性判斷',
    'P5:tense': '時態',
    'P5:prep': '介系詞',
    'P5:conj': '連接詞',
    'P5:pronoun': '代名詞',
    'P5:agreement': '主謂一致',
    'P5:participle': '分詞／語態',
    'P5:relative': '關係詞',
    'P5:comparison': '比較級',
    'P5:vocab': '字彙搭配',
    'P5:other': '綜合文法',
    'P6:word': '篇章填空',
    'P6:sentence': '句子插入',
    'P7:main_idea': '主旨目的',
    'P7:detail': '細節查找',
    'P7:inference': '推論題',
    'P7:NOT': 'NOT／排除題',
    'P7:vocab_in_context': '文中字義',
    'P7:cross_ref': '跨篇對照'
  };

  var PART_LABELS = { P5: 'Part 5 單句填空', P6: 'Part 6 段落填空', P7: 'Part 7 閱讀理解' };

  // 熟練度分級門檻（正確率 %）
  var LEVELS = [
    { min: 85, code: 'strong', label: '穩定', tone: 'success' },
    { min: 65, code: 'ok', label: '及格', tone: 'primary' },
    { min: 45, code: 'shaky', label: '不穩', tone: 'warning' },
    { min: 0, code: 'weak', label: '弱點', tone: 'danger' }
  ];

  // 樣本太少時不下判斷，只顯示「資料不足」
  var MIN_SAMPLE = 5;

  // 粗估 RC 分數用的錨點：[答對題數（滿分 100）, 換算分數]。
  // 依公開換算表的常見區間取樣後線性內插，僅供自我追蹤，不等於官方分數。
  var RC_CURVE = [
    [0, 5], [10, 25], [20, 60], [30, 105], [40, 150], [50, 200],
    [60, 255], [70, 310], [80, 370], [90, 425], [95, 455], [100, 495]
  ];

  // -------------------------------------------------------------------
  // 小工具
  // -------------------------------------------------------------------

  function pct(part, total) {
    if (!total) return 0;
    return Math.round((part / total) * 100);
  }

  function readingData() {
    return (window.TOEIC_DATA && window.TOEIC_DATA.reading) || null;
  }

  function labelFor(key) {
    return SKILL_LABELS[key] || key;
  }

  function partOfKey(key) {
    var idx = String(key || '').indexOf(':');
    return idx === -1 ? '' : key.slice(0, idx);
  }

  function tagOfKey(key) {
    var idx = String(key || '').indexOf(':');
    return idx === -1 ? '' : key.slice(idx + 1);
  }

  function levelOf(accuracy) {
    for (var i = 0; i < LEVELS.length; i++) {
      if (accuracy >= LEVELS[i].min) return LEVELS[i];
    }
    return LEVELS[LEVELS.length - 1];
  }

  /**
   * skillKey(part, question) — 由題目物件算出考點 key。
   * P5 用 tag、P6 用 type、P7 用 skill；缺欄位一律歸到 other。
   */
  function skillKey(part, question) {
    var q = question || {};
    if (part === 'P5') return 'P5:' + (q.tag || 'other');
    if (part === 'P6') return 'P6:' + (q.type || 'word');
    if (part === 'P7') return 'P7:' + (q.skill || 'detail');
    return String(part || '') + ':other';
  }

  /** 題庫中每個考點各有幾題，用來提示「這個考點還有多少題可練」 */
  function poolSizeByKey() {
    var data = window.TOEIC_DATA || {};
    var counts = {};
    function bump(key) { counts[key] = (counts[key] || 0) + 1; }

    (data.p5 || []).forEach(function (q) { bump(skillKey('P5', q)); });
    (data.p6 || []).forEach(function (g) {
      (g.questions || []).forEach(function (q) { bump(skillKey('P6', q)); });
    });
    (data.p7 || []).forEach(function (g) {
      (g.questions || []).forEach(function (q) { bump(skillKey('P7', q)); });
    });
    return counts;
  }

  // -------------------------------------------------------------------
  // 考點分析
  // -------------------------------------------------------------------

  /**
   * skillBreakdown(state, opts) — 把 state.readingStats 攤成陣列。
   * opts.part 可過濾單一 Part。回傳依正確率由低到高排序（弱點在前）。
   */
  function skillBreakdown(state, opts) {
    opts = opts || {};
    var stats = (state && state.readingStats) || {};
    var pool = poolSizeByKey();

    var rows = Object.keys(stats).map(function (key) {
      var s = stats[key] || { total: 0, correct: 0, seconds: 0 };
      var part = partOfKey(key);
      var accuracy = pct(s.correct, s.total);
      var avgSeconds = s.total ? Math.round(s.seconds / s.total) : 0;
      var target = PACE_TARGET[part] || 0;
      return {
        key: key,
        part: part,
        tag: tagOfKey(key),
        label: labelFor(key),
        total: s.total,
        correct: s.correct,
        accuracy: accuracy,
        avgSeconds: avgSeconds,
        targetSeconds: target,
        overPace: !!(target && avgSeconds > target * 1.3),
        enough: s.total >= MIN_SAMPLE,
        level: s.total >= MIN_SAMPLE ? levelOf(accuracy) : { code: 'unknown', label: '資料不足', tone: 'muted' },
        poolSize: pool[key] || 0
      };
    });

    if (opts.part) {
      rows = rows.filter(function (r) { return r.part === opts.part; });
    }
    rows.sort(function (a, b) {
      // 有足夠樣本的排前面，其次正確率低的排前面，再其次題數多的排前面
      if (a.enough !== b.enough) return a.enough ? -1 : 1;
      if (a.accuracy !== b.accuracy) return a.accuracy - b.accuracy;
      return b.total - a.total;
    });
    return rows;
  }

  /** 尚未練過的考點（題庫裡有、但 readingStats 沒紀錄），提醒別漏練 */
  function untouchedSkills(state) {
    var stats = (state && state.readingStats) || {};
    var pool = poolSizeByKey();
    return Object.keys(pool)
      .filter(function (key) { return !stats[key] || !stats[key].total; })
      .map(function (key) {
        return { key: key, label: labelFor(key), part: partOfKey(key), tag: tagOfKey(key), poolSize: pool[key] };
      })
      .sort(function (a, b) { return b.poolSize - a.poolSize; });
  }

  // -------------------------------------------------------------------
  // 配速分析
  // -------------------------------------------------------------------

  /**
   * paceReport(state) — 依 quizHistory 中的閱讀紀錄（mode='quiz'）算各 Part 實際配速。
   * 回傳每個 Part 的 { avgSeconds, targetSeconds, ratio, verdict }。
   */
  function paceReport(state) {
    var history = (state && state.quizHistory) || [];
    var acc = {};
    history.forEach(function (entry) {
      if (!entry || entry.mode !== 'quiz') return;
      var part = entry.part;
      if (!PACE_TARGET[part]) return;
      if (!acc[part]) acc[part] = { seconds: 0, questions: 0, correct: 0, sessions: 0 };
      acc[part].seconds += entry.seconds || 0;
      acc[part].questions += entry.total || 0;
      acc[part].correct += entry.correct || 0;
      acc[part].sessions += 1;
    });

    return ['P5', 'P6', 'P7'].map(function (part) {
      var a = acc[part];
      var target = PACE_TARGET[part];
      if (!a || !a.questions) {
        return {
          part: part, label: PART_LABELS[part], targetSeconds: target,
          avgSeconds: 0, questions: 0, sessions: 0, accuracy: 0,
          ratio: 0, verdict: 'none', verdictText: '尚無計時紀錄'
        };
      }
      var avg = Math.round(a.seconds / a.questions);
      var ratio = target ? avg / target : 0;
      var verdict = 'ok';
      var verdictText = '配速在目標範圍內';
      if (ratio > 1.5) { verdict = 'slow'; verdictText = '明顯超時，正式考會做不完'; }
      else if (ratio > 1.15) { verdict = 'warn'; verdictText = '略慢，還有壓縮空間'; }
      else if (ratio < 0.6 && pct(a.correct, a.questions) < 70) {
        verdict = 'rush'; verdictText = '偏快但正確率低，像是在亂猜';
      }
      return {
        part: part, label: PART_LABELS[part], targetSeconds: target,
        avgSeconds: avg, questions: a.questions, sessions: a.sessions,
        accuracy: pct(a.correct, a.questions),
        ratio: Math.round(ratio * 100) / 100,
        verdict: verdict, verdictText: verdictText
      };
    });
  }

  /**
   * projectedFinish(state) — 用目前配速推估：整份 Reading 75 分鐘做得完嗎？
   * 沒資料的 Part 用目標配速代入。
   */
  function projectedFinish(state) {
    var report = paceReport(state);
    var counts = { P5: 30, P6: 16, P7: 54 };
    var totalSeconds = 0;
    var measured = 0;
    report.forEach(function (r) {
      var sec = r.avgSeconds || r.targetSeconds;
      if (r.avgSeconds) measured += 1;
      totalSeconds += sec * counts[r.part];
    });
    return {
      minutes: Math.round(totalSeconds / 60),
      limitMinutes: 75,
      overMinutes: Math.round((totalSeconds - 75 * 60) / 60),
      measuredParts: measured,
      willFinish: totalSeconds <= 75 * 60
    };
  }

  // -------------------------------------------------------------------
  // 分數粗估
  // -------------------------------------------------------------------

  /** curveToScore(rawOutOf100) — 依 RC_CURVE 線性內插 */
  function curveToScore(raw) {
    var x = Math.max(0, Math.min(100, raw));
    for (var i = 0; i < RC_CURVE.length - 1; i++) {
      var a = RC_CURVE[i];
      var b = RC_CURVE[i + 1];
      if (x >= a[0] && x <= b[0]) {
        var span = b[0] - a[0];
        var t = span ? (x - a[0]) / span : 0;
        return Math.round(a[1] + t * (b[1] - a[1]));
      }
    }
    return 5;
  }

  /**
   * estimateRC(state) — 用整體閱讀正確率粗估 Reading 分數。
   * 只採計 mode='quiz'（閱讀做題）與 mode='mock'（模考）的紀錄。
   * sample < 30 題時標記 confidence:'low'，UI 應提示樣本不足。
   */
  function estimateRC(state) {
    var history = (state && state.quizHistory) || [];
    var total = 0;
    var correct = 0;
    history.forEach(function (entry) {
      if (!entry) return;
      if (entry.mode !== 'quiz' && entry.mode !== 'mock') return;
      total += entry.total || 0;
      correct += entry.correct || 0;
    });

    if (!total) {
      return { score: null, accuracy: 0, sample: 0, confidence: 'none', nextScore: null, questionsToNext: null };
    }

    var accuracy = pct(correct, total);
    var score = curveToScore(accuracy);

    // 「再多對幾題就能跳一級」：以 50 分為一個級距
    var nextScore = Math.min(495, (Math.floor(score / 50) + 1) * 50);
    var questionsToNext = null;
    for (var raw = accuracy; raw <= 100; raw++) {
      if (curveToScore(raw) >= nextScore) { questionsToNext = raw - accuracy; break; }
    }

    return {
      score: score,
      accuracy: accuracy,
      sample: total,
      confidence: total >= 100 ? 'high' : (total >= 30 ? 'medium' : 'low'),
      nextScore: nextScore,
      questionsToNext: questionsToNext
    };
  }

  // -------------------------------------------------------------------
  // 錯因分佈
  // -------------------------------------------------------------------

  function reasonBreakdown(state) {
    var wb = (state && state.wrongBook) || {};
    var data = readingData();
    var defs = (data && data.reasons) || [];
    var counts = {};
    var untagged = 0;
    var totalReading = 0;

    Object.keys(wb).forEach(function (id) {
      if (!/^p[567]-/.test(id)) return; // 只看閱讀錯題
      totalReading += 1;
      var reason = wb[id] && wb[id].reason;
      if (!reason) { untagged += 1; return; }
      counts[reason] = (counts[reason] || 0) + 1;
    });

    var rows = defs.map(function (d) {
      return {
        code: d.code, label: d.label, icon: d.icon, advice: d.advice,
        count: counts[d.code] || 0,
        share: pct(counts[d.code] || 0, totalReading)
      };
    }).sort(function (a, b) { return b.count - a.count; });

    return { rows: rows, untagged: untagged, total: totalReading };
  }

  // -------------------------------------------------------------------
  // 綜合診斷 + 行動建議
  // -------------------------------------------------------------------

  function drillHash(key, count) {
    var part = partOfKey(key);
    var tag = tagOfKey(key);
    return '#/quiz?part=' + encodeURIComponent(part) +
      '&skill=' + encodeURIComponent(tag) +
      '&count=' + (count || 10);
  }

  function frameworkForTag(tag) {
    var data = readingData();
    if (!data || !data.frameworks) return null;
    for (var i = 0; i < data.frameworks.length; i++) {
      if (data.frameworks[i].tag === tag) return data.frameworks[i];
    }
    return null;
  }

  /**
   * advice(state) — 依優先序產生 3–5 條可執行建議。
   * 排序邏輯（分數低的人回收最快的順序）：
   *   1. 有錯題到期沒複習 → 先清錯題（重做一題的期望增益大於做新題）
   *   2. Part 5 弱考點 → 秒殺型考點，讀框架 + 專項練習
   *   3. 配速嚴重超時 → 練縮時，否則實力再好也做不完
   *   4. Part 7 弱題型 → 讀攻略 + 專項練習
   *   5. 沒碰過的考點 → 補齊覆蓋率
   */
  function advice(state, opts) {
    opts = opts || {};
    var today = opts.today || null;
    var out = [];

    // 1. 到期錯題
    var wb = (state && state.wrongBook) || {};
    var dueCount = 0;
    Object.keys(wb).forEach(function (id) {
      var e = wb[id] || {};
      if (e.mastered) return;
      if (!today || !e.due || e.due <= today) dueCount += 1;
    });
    if (dueCount >= 3) {
      out.push({
        priority: 1, kind: 'review', icon: '🔁',
        title: '先清掉 ' + dueCount + ' 題到期錯題',
        detail: '重做一題已經錯過的題目，比做一題新題更容易加分。做完再去練新題。',
        actionLabel: '去錯題本',
        hash: '#/review?due=1'
      });
    }

    var rows = skillBreakdown(state);
    var enoughRows = rows.filter(function (r) { return r.enough; });

    // 2. Part 5 弱考點（最多兩個）
    enoughRows.filter(function (r) { return r.part === 'P5' && r.accuracy < 65; })
      .slice(0, 2)
      .forEach(function (r) {
        var fw = frameworkForTag(r.tag);
        out.push({
          priority: 2, kind: 'skill', icon: '📐',
          title: 'Part 5「' + r.label + '」正確率只有 ' + r.accuracy + '%',
          detail: (fw ? '先讀判斷框架「' + fw.title + '」，' : '') +
            '再做 10 題同考點專項練習（題庫還有 ' + r.poolSize + ' 題）。',
          actionLabel: '練 10 題 ' + r.label,
          hash: drillHash(r.key, 10),
          frameworkId: fw ? fw.id : null,
          skillKey: r.key
        });
      });

    // 3. 配速
    paceReport(state).forEach(function (p) {
      if (p.verdict === 'slow') {
        out.push({
          priority: 3, kind: 'pace', icon: '⏱️',
          title: p.label + '平均每題 ' + p.avgSeconds + ' 秒，目標是 ' + p.targetSeconds + ' 秒',
          detail: '照這個速度正式考會做不完。開計時做 10 題，強迫自己超過目標秒數就先猜再跳。',
          actionLabel: '計時練 ' + p.part,
          hash: '#/quiz?part=' + p.part + '&count=10'
        });
      } else if (p.verdict === 'rush') {
        out.push({
          priority: 3, kind: 'pace', icon: '⚠️',
          title: p.label + '答得快但正確率只有 ' + p.accuracy + '%',
          detail: '速度不是問題，是讀得不夠仔細。放慢到接近目標秒數，先把正確率拉到 70%。',
          actionLabel: '重練 ' + p.part,
          hash: '#/quiz?part=' + p.part + '&count=10'
        });
      }
    });

    // 4. Part 7 弱題型
    enoughRows.filter(function (r) { return r.part === 'P7' && r.accuracy < 60; })
      .slice(0, 2)
      .forEach(function (r) {
        out.push({
          priority: 4, kind: 'skill', icon: '📖',
          title: 'Part 7「' + r.label + '」正確率只有 ' + r.accuracy + '%',
          detail: '在閱讀診斷室讀這個題型的攻略步驟，再做同題型專項練習。',
          actionLabel: '練 ' + r.label,
          hash: drillHash(r.key, 6),
          skillKey: r.key
        });
      });

    // 5. 覆蓋率
    var untouched = untouchedSkills(state);
    if (untouched.length && out.length < 5) {
      var names = untouched.slice(0, 3).map(function (u) { return u.label; }).join('、');
      out.push({
        priority: 5, kind: 'coverage', icon: '🗺️',
        title: '還有 ' + untouched.length + ' 個考點完全沒練過',
        detail: '包含 ' + names + ' 等。先各做幾題，診斷才有資料可以判斷強弱。',
        actionLabel: '練 ' + untouched[0].label,
        hash: drillHash(untouched[0].key, 10),
        skillKey: untouched[0].key
      });
    }

    if (!out.length) {
      out.push({
        priority: 9, kind: 'idle', icon: '✅',
        title: '目前沒有明顯弱點',
        detail: '各考點正確率與配速都在範圍內。維持每天一組計時練習，並保持錯題本清空。',
        actionLabel: '做一組計時練習',
        hash: '#/quiz?part=P7&count=6'
      });
    }

    out.sort(function (a, b) { return a.priority - b.priority; });
    return out.slice(0, 5);
  }

  /** diagnose(state, opts) — 一次拿到閱讀診斷室要的所有資料 */
  function diagnose(state, opts) {
    opts = opts || {};
    return {
      rc: estimateRC(state),
      skills: skillBreakdown(state),
      untouched: untouchedSkills(state),
      pace: paceReport(state),
      projection: projectedFinish(state),
      reasons: reasonBreakdown(state),
      advice: advice(state, opts)
    };
  }

  window.Reading = {
    PACE_TARGET: PACE_TARGET,
    SKILL_LABELS: SKILL_LABELS,
    PART_LABELS: PART_LABELS,
    MIN_SAMPLE: MIN_SAMPLE,
    skillKey: skillKey,
    labelFor: labelFor,
    partOfKey: partOfKey,
    tagOfKey: tagOfKey,
    levelOf: levelOf,
    poolSizeByKey: poolSizeByKey,
    skillBreakdown: skillBreakdown,
    untouchedSkills: untouchedSkills,
    paceReport: paceReport,
    projectedFinish: projectedFinish,
    curveToScore: curveToScore,
    estimateRC: estimateRC,
    reasonBreakdown: reasonBreakdown,
    frameworkForTag: frameworkForTag,
    drillHash: drillHash,
    advice: advice,
    diagnose: diagnose
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* js/tts.js */
/**
 * js/tts.js — TOEIC 30 天衝刺平台
 * window.TTS：封裝 Web Speech API（speechSynthesis）。
 * 無 speechSynthesis 支援時，所有 API 安全 no-op 並回傳已 resolve 的 Promise。
 * 長文以句號等標點分段依序播放，避免 Chrome ~15 秒截斷 bug。
 */
(function (window) {
  'use strict';

  var FEMALE_HINTS = ['female', 'samantha', 'zira', 'google us english', 'victoria', 'karen', 'moira', 'tessa', 'susan'];
  var MALE_HINTS = ['male', 'david', 'daniel', 'alex', 'fred', 'george', 'james'];
  var VOICES_TIMEOUT_MS = 1000;
  var NO_ENGLISH_VOICE_HINT = '未偵測到英文語音，播放可能不標準；建議在作業系統安裝英文語音' +
    '（Windows：設定 → 時間與語言 → 語音 → 新增語音 English (United States)；' +
    'macOS：系統設定 → 輔助使用 → 朗讀內容 → 系統聲音 → 管理聲音），或作答後閱讀逐字稿練習';

  function isSupported() {
    try {
      return typeof window !== 'undefined' &&
        typeof window.speechSynthesis !== 'undefined' &&
        window.speechSynthesis !== null;
    } catch (e) {
      return false;
    }
  }

  function filterEnglish(list) {
    return (list || []).filter(function (v) {
      return v && typeof v.lang === 'string' && v.lang.toLowerCase().indexOf('en') === 0;
    });
  }

  // 寬鬆比對：lang 只要含 'en'（不分大小寫，涵蓋 en_US、en-US 等分隔形式），
  // 用於嚴格前綴比對（filterEnglish）找不到任何英文語音時的退路。
  function looseEnglishMatch(v) {
    return !!(v && typeof v.lang === 'string' && v.lang.toLowerCase().indexOf('en') !== -1);
  }

  // 取得完整語音清單（不過濾語言），供 voices()/pickVoice()/hasEnglishVoice() 共用。
  function allVoicesPromise() {
    if (!isSupported()) return Promise.resolve([]);
    var synth = window.speechSynthesis;
    var existing = synth.getVoices() || [];
    if (existing.length > 0) return Promise.resolve(existing);

    return new Promise(function (resolve) {
      var resolved = false;
      var finish = function () {
        if (resolved) return;
        resolved = true;
        try {
          resolve(synth.getVoices() || []);
        } catch (e) {
          resolve([]);
        }
      };
      try {
        if (typeof synth.addEventListener === 'function') {
          var handler = function () {
            synth.removeEventListener('voiceschanged', handler);
            finish();
          };
          synth.addEventListener('voiceschanged', handler);
        } else {
          synth.onvoiceschanged = finish;
        }
      } catch (e) {
        // 忽略事件註冊失敗，靠 timeout 收尾
      }
      setTimeout(finish, VOICES_TIMEOUT_MS);
    });
  }

  function voices() {
    return allVoicesPromise().then(filterEnglish);
  }

  function hasEnglishVoice() {
    if (!isSupported()) return Promise.resolve(false);
    return allVoicesPromise().then(function (all) {
      if (filterEnglish(all).length > 0) return true;
      return (all || []).filter(looseEnglishMatch).length > 0;
    });
  }

  function pickVoice(gender) {
    return allVoicesPromise().then(function (all) {
      var list = filterEnglish(all);
      if (!list || list.length === 0) list = (all || []).filter(looseEnglishMatch);
      if (!list || list.length === 0) {
        var def = (all || []).filter(function (v) { return v && v.default; })[0];
        return def || null;
      }
      var hints = gender === 'female' ? FEMALE_HINTS : (gender === 'male' ? MALE_HINTS : null);
      var byHint = null;
      if (hints) {
        byHint = list.find(function (v) {
          var name = (v.name || '').toLowerCase();
          return hints.some(function (h) { return name.indexOf(h) !== -1; });
        }) || null;
      }
      if (byHint) return byHint;
      var byEnUS = list.find(function (v) {
        return v.lang && v.lang.toLowerCase() === 'en-us';
      });
      return byEnUS || list[0];
    });
  }

  function splitSentences(text) {
    if (!text) return [];
    var parts = String(text).match(/[^.!?]+[.!?]*(\s+|$)/g);
    if (!parts) {
      var trimmed = String(text).trim();
      return trimmed ? [trimmed] : [];
    }
    return parts.map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
  }

  function speakOne(text, opts) {
    return new Promise(function (resolve) {
      try {
        var synth = window.speechSynthesis;
        var Utter = window.SpeechSynthesisUtterance;
        var utter = new Utter(text);
        // 即使沒有指定 voice，也明確設定 lang，讓瀏覽器依 lang 挑選英文語音，
        // 避免退回系統預設（可能是中文等非英文）語音朗讀英文文字。
        utter.lang = 'en-US';
        utter.rate = (opts && typeof opts.rate === 'number') ? opts.rate : 1.0;
        if (opts && opts.voice) utter.voice = opts.voice;
        utter.onend = function () { resolve(); };
        utter.onerror = function () { resolve(); };
        synth.speak(utter);
      } catch (e) {
        resolve();
      }
    });
  }

  function speakChunks(chunks, opts) {
    return chunks.reduce(function (chain, chunk) {
      return chain.then(function () { return speakOne(chunk, opts); });
    }, Promise.resolve());
  }

  function speak(text, opts) {
    opts = opts || {};
    if (!isSupported() || !text) return Promise.resolve();
    var rate = typeof opts.rate === 'number' ? opts.rate : 1.0;
    var chunks = splitSentences(text);
    if (chunks.length === 0) return Promise.resolve();

    if (opts.voice) {
      return speakChunks(chunks, { rate: rate, voice: opts.voice });
    }
    return pickVoice(opts.gender || null).then(function (voice) {
      return speakChunks(chunks, { rate: rate, voice: voice });
    });
  }

  function speakSequence(items) {
    if (!isSupported() || !Array.isArray(items) || items.length === 0) return Promise.resolve();
    return items.reduce(function (chain, item) {
      return chain.then(function () {
        return speak(item.text, { rate: item.rate, voice: item.voice, gender: item.gender }).then(function () {
          var pause = typeof item.pauseMs === 'number' ? item.pauseMs : 0;
          if (pause > 0) {
            return new Promise(function (resolve) { setTimeout(resolve, pause); });
          }
          return undefined;
        });
      });
    }, Promise.resolve());
  }

  function stop() {
    if (!isSupported()) return;
    try {
      window.speechSynthesis.cancel();
    } catch (e) {
      // no-op
    }
  }

  window.TTS = {
    isSupported: isSupported,
    voices: voices,
    hasEnglishVoice: hasEnglishVoice,
    speak: speak,
    speakSequence: speakSequence,
    stop: stop,
    pickVoice: pickVoice,
    NO_ENGLISH_VOICE_HINT: NO_ENGLISH_VOICE_HINT
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
/* js/views/dashboard.js */
/**
 * js/views/dashboard.js — TOEIC 30 天衝刺平台
 * window.Views.dashboard：儀表板（倒數、今日任務、30 天進度環、連續天數、
 * 近 7 天正確率、弱點提醒、今日單字到期數）。
 * 依 docs/API_ui.md / docs/API_infra.md 介面撰寫，純 IIFE，不用 ES modules。
 */
(function () {
  'use strict';

  var TASK_ICONS = {
    tips: '💡',
    quiz: '✏️',
    listening: '🎧',
    vocab: '📚',
    mock: '🎯',
    review: '🔁',
    read: '📖'
  };

  var TASK_TYPE_LABELS = {
    tips: '技巧',
    quiz: '做題',
    listening: '聽力',
    vocab: '單字',
    mock: '模考',
    review: '複習',
    read: '閱讀'
  };

  var WEEKDAYS_ZH = ['日', '一', '二', '三', '四', '五', '六'];

  var changeHandler = null;

  // -----------------------------------------------------------------------
  // 小工具
  // -----------------------------------------------------------------------

  function goTo(hash) {
    if (window.App && typeof window.App.navigate === 'function') {
      window.App.navigate(hash);
    } else {
      window.location.hash = hash;
    }
  }

  /** qp({a:1,b:undefined}) → "a=1"（略過 undefined/null/''） */
  function qp(obj) {
    return Object.keys(obj)
      .filter(function (k) {
        var v = obj[k];
        return v !== undefined && v !== null && v !== '';
      })
      .map(function (k) {
        return encodeURIComponent(k) + '=' + encodeURIComponent(obj[k]);
      })
      .join('&');
  }

  function isoWeekday(iso) {
    var parts = String(iso).split('-').map(Number);
    return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1).getDay();
  }

  function isDone(state, id) {
    return !!(state.completedTasks && state.completedTasks[id]);
  }

  function taskHash(task) {
    var ref = task.ref || {};
    var id = task.id;
    switch (task.type) {
      case 'tips':
        return '#/tips?' + qp({ part: ref.part, count: ref.count, task: id });
      case 'quiz':
        return '#/quiz?' + qp({ part: ref.part, count: ref.count, task: id });
      case 'listening':
        return '#/listening?' + qp({ part: ref.part, count: ref.count, task: id });
      case 'vocab':
        return '#/vocab?' + qp({ task: id });
      case 'mock':
        return '#/mock?' + qp({ preset: ref.preset, task: id });
      case 'review':
        return '#/review?' + qp({ task: id });
      default:
        return null;
    }
  }

  function weaknessTargetHash(part) {
    var listeningParts = ['P1', 'P2', 'P3', 'P4'];
    if (listeningParts.indexOf(part) !== -1) {
      return '#/listening?' + qp({ part: part, count: 10 });
    }
    return '#/quiz?' + qp({ part: part, count: 10 });
  }

  function emptyBlock(icon, title, desc, isError) {
    return Util.h(
      'div',
      { class: 'empty-state' + (isError ? ' empty-state-error' : '') },
      Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, icon),
      Util.h('h2', {}, title),
      Util.h('p', {}, desc)
    );
  }

  // -----------------------------------------------------------------------
  // 「讀」型任務：彈出說明 modal，可直接標記完成
  // -----------------------------------------------------------------------

  function openReadTask(task, state) {
    var ref = task.ref || {};
    var done = isDone(state, task.id);
    var actions = [{ label: '關閉', class: 'btn btn-ghost' }];
    if (!done) {
      actions.push({
        label: '標記完成',
        class: 'btn btn-primary',
        onClick: function (close) {
          if (window.Store) window.Store.completeTask(task.id);
          close();
          Util.toast('已標記完成', 'success');
        }
      });
    }
    Util.modal({
      title: task.label || '閱讀任務',
      body: Util.h(
        'div',
        {},
        Util.h('p', {}, ref.note || '這個任務沒有額外說明，請依計畫自行閱讀對應教材。'),
        done ? Util.h('p.u-text-muted', {}, '（已標記完成）') : null
      ),
      actions: actions
    });
  }

  // -----------------------------------------------------------------------
  // 區塊建構
  // -----------------------------------------------------------------------

  function buildHeader(dayIndex, daysToExam) {
    var dayLabel = dayIndex > 0 ? 'Day ' + dayIndex + ' / 30' : '尚未開始';
    var examLabel = daysToExam >= 0 ? '距考試 ' + daysToExam + ' 天' : '已過考試日 ' + Math.abs(daysToExam) + ' 天';
    return Util.h(
      'div.view-header',
      {},
      Util.h(
        'div.view-title',
        {},
        Util.h('h1', {}, '儀表板'),
        Util.h('p.view-subtitle', {}, dayLabel + ' · ' + examLabel)
      )
    );
  }

  function buildStartGuide() {
    return Util.h(
      'div.card',
      {},
      Util.h(
        'div.card-header',
        {},
        Util.h(
          'div',
          {},
          Util.h('div.card-title', {}, '你的 30 天計畫尚未開始'),
          Util.h('div.card-subtitle', {}, '開始日期還沒到（或尚未設定），先去「設定」頁確認開始日期。')
        ),
        Util.h('span.badge.badge-warning', {}, '待設定')
      ),
      Util.h(
        'div.card-actions',
        {},
        Util.h('button.btn.btn-primary', { onClick: function () { goTo('#/settings'); } }, '前往設定')
      )
    );
  }

  function buildHeroCard(state, daysToExam, dayIndex, dailyGoalMinutes, todayDay) {
    var firstTask = null;
    if (todayDay && Array.isArray(todayDay.tasks)) {
      firstTask = todayDay.tasks.filter(function (t) { return !isDone(state, t.id); })[0] || null;
    }

    var ctaBtn = null;
    if (todayDay) {
      ctaBtn = Util.h(
        'button.btn.btn-primary',
        {
          onClick: function () {
            var hash = firstTask ? taskHash(firstTask) : null;
            if (firstTask && firstTask.type === 'read') {
              openReadTask(firstTask, state);
            } else if (hash) {
              goTo(hash);
            } else {
              goTo('#/plan');
            }
          }
        },
        firstTask ? '開始今日任務' : '今日任務已完成 🎉'
      );
    }

    return Util.h(
      'div.card',
      {},
      Util.h(
        'div.stat-grid',
        {},
        Util.h(
          'div.stat-card',
          {},
          Util.h('div.stat-value', {}, daysToExam >= 0 ? String(daysToExam) : '0'),
          Util.h('div.stat-label', {}, daysToExam >= 0 ? '距考試天數' : '考試已結束')
        ),
        Util.h(
          'div.stat-card',
          {},
          Util.h('div.stat-value', {}, dayIndex > 0 ? 'Day ' + dayIndex : '—'),
          Util.h('div.stat-label', {}, '/ 30 天計畫')
        ),
        Util.h(
          'div.stat-card',
          {},
          Util.h('div.stat-value', {}, dailyGoalMinutes + ' 分'),
          Util.h('div.stat-label', {}, '今日目標時間')
        )
      ),
      ctaBtn ? Util.h('div.card-actions', {}, ctaBtn) : null
    );
  }

  function buildTaskItem(task, state) {
    var done = isDone(state, task.id);
    var icon = TASK_ICONS[task.type] || '📌';
    var typeLabel = TASK_TYPE_LABELS[task.type] || task.type;

    function handleClick() {
      if (task.type === 'read') {
        openReadTask(task, state);
        return;
      }
      var hash = taskHash(task);
      if (hash) goTo(hash);
    }

    return Util.h(
      'li',
      {},
      Util.h(
        'button.card.card-clickable',
        {
          style: {
            display: 'flex',
            alignItems: 'center',
            gap: '12px',
            width: '100%',
            textAlign: 'left',
            padding: '14px 16px'
          },
          onClick: handleClick
        },
        Util.h('span', { 'aria-hidden': 'true', style: { fontSize: '1.4rem' } }, icon),
        Util.h(
          'div',
          { style: { flex: '1' } },
          Util.h('div', { style: { fontWeight: '600' } }, task.label),
          Util.h('div.u-text-muted', { style: { fontSize: '0.8rem' } }, typeLabel + ' · ' + task.minutes + ' 分鐘')
        ),
        done ? Util.h('span.badge.badge-success', {}, '✓ 已完成') : Util.h('span.badge', {}, '未完成')
      )
    );
  }

  function buildTasksCard(plan, todayDay, dayIndex, state) {
    var headerBadge = null;
    if (todayDay && Array.isArray(todayDay.tasks)) {
      var total = todayDay.tasks.length;
      var doneCount = todayDay.tasks.filter(function (t) { return isDone(state, t.id); }).length;
      headerBadge = Util.h('span.badge.badge-primary', {}, doneCount + ' / ' + total + ' 完成');
    }

    var card = Util.h(
      'div.card',
      {},
      Util.h(
        'div.card-header',
        {},
        Util.h(
          'div',
          {},
          Util.h('div.card-title', {}, '今日任務'),
          Util.h('div.card-subtitle', {}, todayDay ? todayDay.theme : '尚無安排')
        ),
        headerBadge
      )
    );

    if (!plan || !Array.isArray(plan.days) || !plan.days.length) {
      card.appendChild(emptyBlock('📭', '尚未載入計畫資料', '計畫資料檔尚未提供，稍後再試一次。'));
      return card;
    }

    if (!todayDay) {
      var msg = dayIndex === 0
        ? '開始日期尚未到，前往「設定」調整後即可看到每日任務。'
        : '找不到第 ' + dayIndex + ' 天的任務安排。';
      card.appendChild(emptyBlock('📭', '今天沒有安排任務', msg));
      return card;
    }

    var list = Util.h('ul', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } });
    todayDay.tasks.forEach(function (task) {
      list.appendChild(buildTaskItem(task, state));
    });
    card.appendChild(list);
    return card;
  }

  function planTotals(plan, state) {
    var total = 0;
    var done = 0;
    if (plan && Array.isArray(plan.days)) {
      plan.days.forEach(function (d) {
        (d.tasks || []).forEach(function (t) {
          total += 1;
          if (isDone(state, t.id)) done += 1;
        });
      });
    }
    return { total: total, done: done };
  }

  function computeVocabDue(state) {
    var vocabData = window.TOEIC_DATA && Array.isArray(window.TOEIC_DATA.vocab) ? window.TOEIC_DATA.vocab : [];
    if (!vocabData.length || !window.SRS) return 0;
    var allIds = vocabData.map(function (w) { return w.id; });
    var pick = window.SRS.pickSession({ cards: state.vocab || {}, allIds: allIds });
    return pick.reviewIds.length;
  }

  function buildOverviewCard(state, plan) {
    var totals = planTotals(plan, state);
    var ratio = totals.total ? totals.done / totals.total : 0;
    var circumference = 251.2;
    var offset = circumference * (1 - ratio);
    var pctText = Util.pct(totals.done, totals.total) + '%';

    var ringBlock = Util.h(
      'div',
      { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '8px' } },
      Util.h(
        'svg.progress-ring',
        { viewBox: '0 0 100 100' },
        Util.h('circle.progress-ring-track', { cx: 50, cy: 50, r: 40 }),
        Util.h('circle.progress-ring-value', {
          cx: 50,
          cy: 50,
          r: 40,
          style: { strokeDasharray: String(circumference), strokeDashoffset: String(offset) }
        }),
        Util.h('text.progress-ring-label', { x: 50, y: 58 }, pctText)
      ),
      Util.h('div.u-text-muted', {}, totals.done + ' / ' + totals.total + ' 個任務完成')
    );

    var srsDue = computeVocabDue(state);

    var statGrid = Util.h(
      'div',
      { style: { flex: '1 1 260px' } },
      Util.h(
        'div.stat-grid',
        {},
        Util.h(
          'div.stat-card',
          {},
          Util.h('div.stat-value', {}, '🔥 ' + (state.streak.current || 0)),
          Util.h('div.stat-label', {}, '連續天數（最佳 ' + (state.streak.best || 0) + '）')
        ),
        Util.h(
          'div.stat-card',
          {},
          Util.h('div.stat-value', {}, String(srsDue)),
          Util.h('div.stat-label', {}, '今日到期單字')
        )
      )
    );

    return Util.h(
      'div.card',
      {},
      Util.h('div.card-title', {}, '學習概況'),
      Util.h(
        'div.u-mt-md',
        { style: { display: 'flex', flexWrap: 'wrap', gap: '24px', alignItems: 'center' } },
        ringBlock,
        statGrid
      ),
      Util.h(
        'div.card-actions',
        {},
        Util.h('button.btn.btn-ghost.btn-sm', { onClick: function () { goTo('#/vocab'); } }, '前往背單字')
      )
    );
  }

  function buildWeeklyChart(state) {
    var today = Util.todayISO();
    var days = [];
    for (var i = 6; i >= 0; i--) {
      days.push(Util.addDays(today, -i));
    }

    var stats = days.map(function (d) {
      var correct = 0;
      var total = 0;
      (state.quizHistory || []).forEach(function (entry) {
        var entryDate = String(entry.at || '').slice(0, 10);
        if (entryDate === d) {
          correct += entry.correct;
          total += entry.total;
        }
      });
      return { date: d, total: total, pct: total ? Util.pct(correct, total) : null };
    });

    var hasAny = stats.some(function (s) { return s.total > 0; });

    var body;
    if (hasAny) {
      var barWidth = 28;
      var gap = 10;
      var chartH = 90;
      var svgWidth = stats.length * (barWidth + gap);
      var marks = [];
      stats.forEach(function (s, idx) {
        var x = idx * (barWidth + gap);
        var barH = s.pct === null ? 4 : Math.max(4, Math.round((s.pct / 100) * chartH));
        var y = chartH - barH;
        marks.push(
          Util.h('rect', {
            x: x,
            y: y,
            width: barWidth,
            height: barH,
            rx: 4,
            style: { fill: s.pct === null ? 'var(--color-border)' : 'var(--color-primary)' }
          })
        );
        marks.push(
          Util.h(
            'text',
            {
              x: x + barWidth / 2,
              y: chartH + 16,
              'text-anchor': 'middle',
              style: { fontSize: '10px', fill: 'var(--color-text-muted)' }
            },
            WEEKDAYS_ZH[isoWeekday(s.date)]
          )
        );
      });
      body = Util.h(
        'svg',
        {
          viewBox: '0 0 ' + svgWidth + ' ' + (chartH + 24),
          style: { width: '100%', maxWidth: svgWidth + 20 + 'px', height: chartH + 24 + 'px' }
        },
        marks
      );
    } else {
      body = Util.h('div.u-text-muted', {}, '最近 7 天還沒有做題紀錄，快去挑戰練習題吧。');
    }

    return Util.h(
      'div.card',
      {},
      Util.h('div.card-title', {}, '近 7 天正確率'),
      Util.h('div.u-mt-md', {}, body)
    );
  }

  /**
   * 閱讀強化卡：把閱讀診斷室最重要的一條建議搬到儀表板，
   * 讓「今天閱讀該練什麼」在首頁就看得到，不用先進診斷室。
   */
  function buildReadingCard(state) {
    var card = Util.h(
      'div.card',
      {},
      Util.h('div.card-header', {},
        Util.h('div', {},
          Util.h('div.card-title', {}, '📈 閱讀強化'),
          Util.h('div.card-subtitle', {}, '閱讀是目前的主戰場 — 這裡只顯示最該先做的那一件事')
        ),
        Util.h('button.btn.btn-ghost.btn-sm', { onClick: function () { goTo('#/reading'); } }, '完整診斷')
      )
    );

    if (!window.Reading || typeof window.Reading.diagnose !== 'function') {
      card.appendChild(Util.h('div.u-mt-md.u-text-muted', {}, '閱讀診斷模組尚未載入。'));
      return card;
    }

    var d;
    try {
      d = window.Reading.diagnose(state, { today: Util.todayISO() });
    } catch (e) {
      card.appendChild(Util.h('div.u-mt-md.u-text-muted', {}, '無法計算閱讀診斷：' + (e && e.message)));
      return card;
    }

    var rcText = d.rc.score === null ? '—' : String(d.rc.score);
    var paceText = d.projection.measuredParts === 0
      ? '尚無計時'
      : (d.projection.willFinish ? '做得完' : '超時 ' + d.projection.overMinutes + ' 分');

    card.appendChild(Util.h('div.stat-grid', { style: { marginTop: '12px' } },
      Util.h('div.stat-card', {},
        Util.h('div.stat-value', {}, rcText),
        Util.h('div.stat-label', {}, '粗估 RC 分數')),
      Util.h('div.stat-card', {},
        Util.h('div.stat-value', {}, d.rc.accuracy + '%'),
        Util.h('div.stat-label', {}, '閱讀正確率')),
      Util.h('div.stat-card', {},
        Util.h('div.stat-value', {}, paceText),
        Util.h('div.stat-label', {}, '75 分鐘完成度'))
    ));

    var top = d.advice[0];
    if (top) {
      card.appendChild(Util.h('div.card', { style: { marginTop: '14px', background: 'var(--color-surface-alt)' } },
        Util.h('div.u-flex.u-items-center.u-gap-sm', { style: { flexWrap: 'wrap' } },
          Util.h('span', { style: { fontSize: '1.1rem' } }, top.icon),
          Util.h('strong', {}, top.title)
        ),
        Util.h('p', { style: { marginTop: '6px' } }, top.detail),
        Util.h('div.u-flex.u-gap-sm', { style: { marginTop: '10px', flexWrap: 'wrap' } },
          Util.h('button.btn.btn-primary.btn-sm', { onClick: function () { goTo(top.hash); } }, top.actionLabel)
        )
      ));
    }

    return card;
  }

  function buildWeaknessCard(state) {
    var stats = {};
    (state.quizHistory || []).forEach(function (entry) {
      var part = entry.part;
      if (!part) return;
      if (!stats[part]) stats[part] = { correct: 0, total: 0 };
      stats[part].correct += entry.correct;
      stats[part].total += entry.total;
    });

    var arr = Object.keys(stats)
      .map(function (part) {
        var s = stats[part];
        return { part: part, pct: Util.pct(s.correct, s.total), total: s.total };
      })
      .filter(function (s) { return s.total > 0; });

    arr.sort(function (a, b) { return a.pct - b.pct || b.total - a.total; });
    var weakest = arr.slice(0, 3);

    var card = Util.h(
      'div.card',
      {},
      Util.h('div.card-title', {}, '弱點提醒'),
      Util.h('div.card-subtitle', {}, '依做題紀錄找出正確率最低的 Part')
    );

    if (!weakest.length) {
      card.appendChild(Util.h('div.u-mt-md.u-text-muted', {}, '尚未有足夠的做題紀錄，去挑戰練習題累積數據吧。'));
      card.appendChild(
        Util.h(
          'div.card-actions',
          {},
          Util.h('button.btn.btn-primary.btn-sm', { onClick: function () { goTo('#/quiz'); } }, '開始做題')
        )
      );
      return card;
    }

    var list = Util.h('ul', { style: { display: 'flex', flexDirection: 'column', gap: '10px', marginTop: '12px' } });
    weakest.forEach(function (w) {
      list.appendChild(
        Util.h(
          'li',
          { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px' } },
          Util.h(
            'div',
            {},
            Util.h('div', { style: { fontWeight: '600' } }, w.part),
            Util.h('div.u-text-muted', { style: { fontSize: '0.8rem' } }, '正確率 ' + w.pct + '%（' + w.total + ' 題）')
          ),
          Util.h(
            'button.btn.btn-ghost.btn-sm',
            { onClick: function () { goTo(weaknessTargetHash(w.part)); } },
            '前往練習'
          )
        )
      );
    });
    card.appendChild(list);
    return card;
  }

  // -----------------------------------------------------------------------
  // render / destroy
  // -----------------------------------------------------------------------

  function renderContent(container) {
    container.innerHTML = '';

    if (!window.Store || !window.Util) {
      container.appendChild(emptyBlock('⚠️', '無法載入儀表板', '核心模組尚未載入，請重新整理頁面。', true));
      return;
    }

    try {
      var state = window.Store.get();
      var plan = window.TOEIC_DATA && window.TOEIC_DATA.plan;
      var dayIndex = window.Store.getDayIndex();
      var daysToExam = window.Store.daysToExam();
      var todayDay = null;
      if (plan && Array.isArray(plan.days)) {
        todayDay = plan.days.filter(function (d) { return d.day === dayIndex; })[0] || null;
      }
      var dailyGoalMinutes = todayDay ? todayDay.minutes : state.dailyMinutes;

      container.appendChild(buildHeader(dayIndex, daysToExam));

      if (dayIndex === 0) {
        container.appendChild(buildStartGuide());
      }

      container.appendChild(buildHeroCard(state, daysToExam, dayIndex, dailyGoalMinutes, todayDay));
      container.appendChild(buildTasksCard(plan, todayDay, dayIndex, state));
      container.appendChild(buildOverviewCard(state, plan));
      container.appendChild(buildWeeklyChart(state));
      container.appendChild(buildReadingCard(state));
      container.appendChild(buildWeaknessCard(state));
    } catch (e) {
      container.innerHTML = '';
      container.appendChild(emptyBlock('⚠️', '儀表板載入失敗', '資料格式異常：' + (e && e.message ? e.message : '未知錯誤'), true));
    }
  }

  function render(container) {
    if (changeHandler) {
      window.removeEventListener('toeic30:change', changeHandler);
    }
    changeHandler = function () {
      renderContent(container);
    };
    window.addEventListener('toeic30:change', changeHandler);

    if (window.Store && typeof window.Store.touchStreak === 'function') {
      try {
        window.Store.touchStreak();
      } catch (e) {
        // 忽略：不影響頁面渲染
      }
    }

    renderContent(container);
  }

  function destroy() {
    if (changeHandler) {
      window.removeEventListener('toeic30:change', changeHandler);
      changeHandler = null;
    }
  }

  window.Views = window.Views || {};
  window.Views.dashboard = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/plan.js */
/**
 * js/views/plan.js
 * 30 天計畫頁：階段時間軸 + 30 格月曆 + 選定日詳情（theme/minutes/tasks）。
 * 暴露：window.Views.plan = { render(container, params), destroy() }
 * 依賴：window.Util、window.Store、window.TOEIC_DATA.plan（可能缺檔）。
 */
(function () {
  'use strict';

  var TOTAL_DAYS = 30;

  var TYPE_LABEL = {
    tips: '技巧',
    quiz: '做題',
    listening: '聽力',
    vocab: '單字',
    mock: '模考',
    review: '錯題',
    read: '閱讀教材'
  };

  // 本 view 目前渲染狀態（每次 render() 重新初始化）
  var container = null;
  var selectedDay = 1;
  var changeListener = null;

  // -----------------------------------------------------------------
  // 資料存取 / 計算
  // -----------------------------------------------------------------

  function getPlan() {
    return (window.TOEIC_DATA && window.TOEIC_DATA.plan) || null;
  }

  function countAllTasks(plan) {
    var n = 0;
    plan.days.forEach(function (d) {
      n += (d.tasks || []).length;
    });
    return n;
  }

  function countCompletedTasks(plan, state) {
    var n = 0;
    plan.days.forEach(function (d) {
      (d.tasks || []).forEach(function (t) {
        if (state.completedTasks && state.completedTasks[t.id]) n += 1;
      });
    });
    return n;
  }

  function dayProgress(day, state) {
    var tasks = day.tasks || [];
    var done = tasks.filter(function (t) {
      return !!(state.completedTasks && state.completedTasks[t.id]);
    }).length;
    return { done: done, total: tasks.length };
  }

  /**
   * taskRoute(task) — 依 task.type / task.ref 決定「前往」按鈕導向的路由。
   * 帶上 task=<id>，目的頁完成後應呼叫 Store.completeTask(task) 自動勾選。
   * type: "read"（外部教材）或無法辨識的類型 → 回傳 null（無對應頁面，不顯示按鈕）。
   */
  function taskRoute(task) {
    var ref = task.ref || {};
    var qp = 'task=' + encodeURIComponent(task.id);
    switch (task.type) {
      case 'tips':
        return '#/tips?part=' + encodeURIComponent(ref.part || '') +
          (ref.count ? '&count=' + encodeURIComponent(ref.count) : '') + '&' + qp;
      case 'quiz':
        return '#/quiz?part=' + encodeURIComponent(ref.part || '') +
          '&count=' + encodeURIComponent(ref.count != null ? ref.count : '') + '&' + qp;
      case 'listening':
        return '#/listening?part=' + encodeURIComponent(ref.part || '') +
          '&count=' + encodeURIComponent(ref.count != null ? ref.count : '') + '&' + qp;
      case 'vocab':
        return '#/vocab?newWords=' + encodeURIComponent(ref.newWords != null ? ref.newWords : '') +
          '&review=' + (ref.review ? 'true' : 'false') + '&' + qp;
      case 'mock':
        return '#/mock?preset=' + encodeURIComponent(ref.preset || 'mini') + '&' + qp;
      case 'review':
        return '#/review?' + qp;
      default:
        return null;
    }
  }

  function goTo(hash) {
    if (window.App && typeof window.App.navigate === 'function') {
      window.App.navigate(hash);
    } else {
      window.location.hash = hash;
    }
  }

  /** 勾選/取消完成任務。取消時用 Store.set 產生新物件並移除該鍵（不可變）。 */
  function toggleTask(id, checked) {
    if (!window.Store) return;
    if (checked) {
      Store.completeTask(id);
    } else {
      Store.set(function (old) {
        var completedTasks = Object.assign({}, old.completedTasks);
        delete completedTasks[id];
        return Object.assign({}, old, { completedTasks: completedTasks });
      });
    }
  }

  // -----------------------------------------------------------------
  // UI 建構
  // -----------------------------------------------------------------

  function emptyState() {
    return Util.h(
      'div.empty-state',
      {},
      Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, '🗓️'),
      Util.h('h2', {}, '尚未載入 30 天計畫'),
      Util.h('p', {}, '計畫資料目前無法使用，請確認 data/plan.js 已正確載入後再重新整理。')
    );
  }

  function buildHeader(todayIdx, overallPct) {
    var daysToExam = window.Store && typeof Store.daysToExam === 'function' ? Store.daysToExam() : null;
    var subtitleParts = ['Day ' + (todayIdx || 0) + '/' + TOTAL_DAYS];
    if (daysToExam !== null) subtitleParts.push('距考試 ' + daysToExam + ' 天');

    return Util.h(
      'div.view-header',
      {},
      Util.h(
        'div.view-title',
        {},
        Util.h('h1', {}, '30 天計畫'),
        Util.h('p.view-subtitle', {}, subtitleParts.join(' · '))
      ),
      Util.h(
        'div',
        { style: { display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '6px', minWidth: '160px' } },
        Util.h('span.badge.badge-primary', {}, '整體完成 ' + overallPct + '%'),
        Util.h(
          'div.progress-bar',
          { style: { width: '160px' } },
          Util.h('div.progress-bar-fill', { style: { width: overallPct + '%' } })
        )
      )
    );
  }

  function buildPhases(plan, todayIdx) {
    var row = Util.h('div', {
      style: { display: 'flex', gap: '12px', overflowX: 'auto', paddingBottom: '4px' }
    });
    (plan.phases || []).forEach(function (p) {
      var range = Array.isArray(p.days) ? p.days : [0, 0];
      var isActive = todayIdx >= range[0] && todayIdx <= range[1];
      row.appendChild(
        Util.h(
          'div.card',
          { style: { minWidth: '200px', flex: '0 0 auto' } },
          Util.h(
            'div.card-header',
            {},
            Util.h(
              'div',
              {},
              Util.h('div.card-title', {}, p.name),
              Util.h('div.card-subtitle', {}, 'Day ' + range[0] + '–' + range[1])
            ),
            isActive ? Util.h('span.badge.badge-success', {}, '進行中') : null
          ),
          Util.h('div.card-body', {}, p.goal || '')
        )
      );
    });
    return row;
  }

  function buildDayGrid(plan, state, todayIdx) {
    var grid = Util.h('div.day-grid', {});
    plan.days.forEach(function (d) {
      var prog = dayProgress(d, state);
      var ratio = prog.total ? prog.done / prog.total : 0;
      var dateISO = Util.addDays(state.startDate, d.day - 1);
      var mmdd = Util.fmtDate(dateISO, { weekday: false }).slice(5);

      var extraClasses = [];
      if (d.day === todayIdx) {
        extraClasses.push('is-today');
      } else if (d.day < todayIdx) {
        if (prog.total > 0 && prog.done === prog.total) extraClasses.push('is-done');
        else if (prog.done > 0) extraClasses.push('is-partial');
      } else {
        extraClasses.push('is-future');
      }

      var cellStyle = {};
      if (d.day === selectedDay && d.day !== todayIdx) {
        cellStyle.boxShadow = '0 0 0 2px var(--color-primary)';
      }

      var cell = Util.h(
        'button.calendar-cell',
        {
          type: 'button',
          class: extraClasses.join(' '),
          style: cellStyle,
          'aria-label': 'Day ' + d.day + '（' + mmdd + '）完成 ' + prog.done + '/' + prog.total,
          'aria-pressed': d.day === selectedDay ? 'true' : 'false',
          onClick: function () {
            selectedDay = d.day;
            renderAll();
          }
        },
        Util.h('span.cell-day', {}, String(d.day)),
        Util.h('span.cell-label', {}, mmdd),
        Util.h(
          'div.progress-bar',
          { style: { width: '100%', height: '4px', marginTop: '2px' } },
          Util.h('div.progress-bar-fill', { style: { width: Math.round(ratio * 100) + '%' } })
        )
      );
      grid.appendChild(cell);
    });
    return grid;
  }

  function buildTaskRow(task, state) {
    var done = !!(state.completedTasks && state.completedTasks[task.id]);
    var route = taskRoute(task);

    return Util.h(
      'div.checkbox-row',
      {
        style: {
          flexWrap: 'wrap',
          alignItems: 'flex-start',
          padding: '10px 0',
          borderBottom: '1px solid var(--color-border)'
        }
      },
      Util.h('input', {
        type: 'checkbox',
        checked: done,
        'aria-label': (done ? '取消完成：' : '標記完成：') + task.label,
        onChange: function (e) {
          toggleTask(task.id, e.target.checked);
        }
      }),
      Util.h(
        'span',
        { style: { flex: '1 1 200px' } },
        Util.h('span', {}, task.label),
        Util.h('span.badge.badge-primary', { style: { marginLeft: '8px' } }, TYPE_LABEL[task.type] || task.type),
        Util.h('span.u-text-muted', { style: { marginLeft: '8px', fontSize: '0.78rem' } }, task.minutes + ' 分鐘')
      ),
      route
        ? Util.h('button.btn.btn-ghost.btn-sm', { type: 'button', onClick: function () { goTo(route); } }, '前往')
        : Util.h('span.u-text-muted', { style: { fontSize: '0.78rem' } }, (task.ref && task.ref.note) || '需自行安排')
    );
  }

  function buildDetail(plan, state, todayIdx) {
    var day = null;
    for (var i = 0; i < plan.days.length; i++) {
      if (plan.days[i].day === selectedDay) { day = plan.days[i]; break; }
    }
    if (!day) {
      return Util.h('div.empty-state', {}, Util.h('p', {}, '找不到這一天的計畫內容。'));
    }

    var prog = dayProgress(day, state);
    var dateISO = Util.addDays(state.startDate, day.day - 1);
    var badgeClass = prog.total > 0 && prog.done === prog.total ? 'badge-success'
      : (prog.done > 0 ? 'badge-warning' : '');

    var tasks = (day.tasks || []).map(function (t) { return buildTaskRow(t, state); });

    return Util.h(
      'div.card',
      {},
      Util.h(
        'div.card-header',
        {},
        Util.h(
          'div',
          {},
          Util.h('div.card-title', {}, 'Day ' + day.day + '　' + day.theme),
          Util.h('div.card-subtitle', {}, day.phase + ' · ' + Util.fmtDate(dateISO) + ' · 建議 ' + day.minutes + ' 分鐘')
        ),
        Util.h(
          'div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
          day.day !== todayIdx
            ? Util.h('button.btn.btn-ghost.btn-sm', {
                type: 'button',
                onClick: function () { selectedDay = todayIdx >= 1 && todayIdx <= TOTAL_DAYS ? todayIdx : 1; renderAll(); }
              }, '回到今天')
            : null,
          Util.h('span.badge', { class: badgeClass }, prog.done + '/' + prog.total)
        )
      ),
      Util.h(
        'div.card-body',
        {},
        tasks.length ? tasks : Util.h('p.u-text-muted', {}, '這天沒有安排任務。')
      )
    );
  }

  // -----------------------------------------------------------------
  // 渲染主流程
  // -----------------------------------------------------------------

  function renderAll() {
    if (!container) return;
    container.innerHTML = '';

    var plan = getPlan();
    if (!plan || !Array.isArray(plan.days) || plan.days.length === 0) {
      container.appendChild(emptyState());
      return;
    }
