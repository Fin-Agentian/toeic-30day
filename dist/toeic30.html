/* css/style.css */
/* ==========================================================================
   TOEIC 30 天衝刺 — style.css
   目錄：
   1. Reset            2. 設計變數（light/dark）  3. 基礎排版
   4. App Shell 版面    5. 頂欄                    6. 側欄 / 底部 tab bar
   7. 主內容區          8. 按鈕                    9. 卡片

   16. 統計格 / 空狀態  17. 表單元件                18. Toast
   19. Modal           20. 工具類別                21. 響應式斷點
   ========================================================================== */

/* ---------------------------------------------------------------------- */
/* 1. Reset                                                               */
/* ---------------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* ---------------------------------------------------------------------- */
/* 2. 設計變數（Light 為預設，Dark 見下方 media / [data-theme]）           */
/* ---------------------------------------------------------------------- */

:root {
  --color-primary: #3B5BDB; --color-primary-hover: #364FC7; --color-primary-soft: #EDF0FE; --color-on-primary: #FFFFFF;
  --color-success: #2F9E44; --color-success-soft: #EBFBEE; --color-warning: #F08C00; --color-warning-soft: #FFF4E6;
  --color-danger: #E03131; --color-danger-soft: #FFF0F0;
  --color-bg: #F4F6FB; --color-surface: #FFFFFF; --color-surface-alt: #F8F9FC; --color-border: #E3E6EF;
  --color-text: #1B1D2A; --color-text-secondary: #5C6178; --color-text-muted: #9096A8; --color-overlay: rgba(15, 17, 32, 0.5);
  --shadow-sm: 0 1px 2px rgba(20, 22, 40, 0.06); --shadow-md: 0 4px 16px rgba(20, 22, 40, 0.08); --shadow-lg: 0 16px 40px rgba(20, 22, 40, 0.18);
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 18px; --radius-pill: 999px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
  --topbar-h: 64px; --bottombar-h: 64px; --sidebar-w: 248px; --content-max-w: 1080px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-primary: #7C93F7; --color-primary-hover: #90A4FF; --color-primary-soft: rgba(124, 147, 247, 0.16); --color-on-primary: #10142B;
    --color-success: #51CF66; --color-success-soft: rgba(81, 207, 102, 0.14); --color-warning: #FFA94D; --color-warning-soft: rgba(255, 169, 77, 0.14);
    --color-danger: #FF6B6B; --color-danger-soft: rgba(255, 107, 107, 0.14);
    --color-bg: #12141F; --color-surface: #1A1D2B; --color-surface-alt: #212437; --color-border: #2C3046;
    --color-text: #EDEFF7; --color-text-secondary: #A6ABC2; --color-text-muted: #6D7286; --color-overlay: rgba(5, 6, 14, 0.65);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35); --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
  }
}

:root[data-theme="dark"] {
  --color-primary: #7C93F7; --color-primary-hover: #90A4FF; --color-primary-soft: rgba(124, 147, 247, 0.16); --color-on-primary: #10142B;
  --color-success: #51CF66; --color-success-soft: rgba(81, 207, 102, 0.14); --color-warning: #FFA94D; --color-warning-soft: rgba(255, 169, 77, 0.14);
  --color-danger: #FF6B6B; --color-danger-soft: rgba(255, 107, 107, 0.14);
  --color-bg: #12141F; --color-surface: #1A1D2B; --color-surface-alt: #212437; --color-border: #2C3046;
  --color-text: #EDEFF7; --color-text-secondary: #A6ABC2; --color-text-muted: #6D7286; --color-overlay: rgba(5, 6, 14, 0.65);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35); --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
}

/* ---------------------------------------------------------------------- */
/* 3. 基礎排版                                                            */
/* ---------------------------------------------------------------------- */

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1 { font-size: 1.75rem; font-weight: 700; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.1rem; font-weight: 600; }
p { color: var(--color-text-secondary); }

/* ---------------------------------------------------------------------- */
/* 4. App Shell 版面                                                      */
/* ---------------------------------------------------------------------- */

.app-shell {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.app-body {
  flex: 1;
  display: flex;
  min-height: calc(100vh - var(--topbar-h));
}

/* ---------------------------------------------------------------------- */
/* 5. 頂欄                                                                */
/* ---------------------------------------------------------------------- */

.topbar {
  height: var(--topbar-h);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 16px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar-left, .topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 1.05rem;
  white-space: nowrap;
}
.brand-mark { font-size: 1.3rem; }
.brand-name { overflow: hidden; text-overflow: ellipsis; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  font-size: 1.15rem;
  color: var(--color-text);
  transition: background-color 0.15s ease;
}
.icon-btn:hover { background: var(--color-surface-alt); }

.sidebar-toggle { display: none; }

/* ---------------------------------------------------------------------- */
/* 6. 側欄 / 底部 tab bar                                                 */
/* ---------------------------------------------------------------------- */

.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--color-overlay);
  z-index: 149;
}
.sidebar-backdrop.is-open { display: block; }

.sidebar {
  flex: 0 0 var(--sidebar-w);
  width: var(--sidebar-w);
  align-self: stretch;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  padding: 20px 12px;
  overflow-y: auto;
}

.sidebar-nav li + li { margin-top: 2px; }

.sidebar-nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-md);
  color: var(--color-text-secondary);
  font-weight: 500;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.sidebar-nav a:hover { background: var(--color-surface-alt); color: var(--color-text); }
.sidebar-nav a.is-active {
  background: var(--color-primary-soft);
  color: var(--color-primary);
  font-weight: 700;
}
.nav-icon { font-size: 1.2rem; width: 1.4em; text-align: center; }

.bottom-tabbar {
  display: flex;
  height: var(--bottombar-h);
  flex: 0 0 auto;
  background: var(--color-surface);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom, 0);
  position: sticky;
  bottom: 0;
  z-index: 100;
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  color: var(--color-text-muted);
  font-size: 0.7rem;
}
.tab-item.is-active { color: var(--color-primary); font-weight: 700; }
.tab-icon { font-size: 1.25rem; }
.tab-item-more { font-family: inherit; }

/* ---------------------------------------------------------------------- */
/* 7. 主內容區                                                            */
/* ---------------------------------------------------------------------- */

.main-view {
  flex: 1;
  min-width: 0;
  padding: 24px 20px 40px;
  max-width: var(--content-max-w);
  margin: 0 auto;
  width: 100%;
}
.main-view:focus { outline: none; }

.view-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.view-title { display: flex; flex-direction: column; gap: 4px; }
.view-subtitle { color: var(--color-text-secondary); font-size: 0.9rem; }

/* ---------------------------------------------------------------------- */
/* 8. 按鈕                                                                */
/* ---------------------------------------------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.95rem;
  border: 1px solid transparent;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }

.btn-ghost { background: transparent; color: var(--color-text); border-color: var(--color-border); }
.btn-ghost:hover:not(:disabled) { background: var(--color-surface-alt); }

.btn-danger { background: var(--color-danger); color: #FFFFFF; }
.btn-danger:hover:not(:disabled) { filter: brightness(0.92); }

.btn-sm { min-height: 36px; padding: 0 14px; font-size: 0.85rem; }
.btn-block { width: 100%; }

/* ---------------------------------------------------------------------- */
/* 9. 卡片                                                                */
/* ---------------------------------------------------------------------- */

.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 20px;
}
.card + .card { margin-top: 16px; }

.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
.card-title { font-weight: 700; font-size: 1.05rem; }
.card-subtitle { color: var(--color-text-secondary); font-size: 0.85rem; margin-top: 2px; }
.card-body { color: var(--color-text-secondary); }
.card-footer, .card-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  flex-wrap: wrap;
}

.card-clickable { cursor: pointer; transition: box-shadow 0.15s ease, transform 0.15s ease; }
.card-clickable:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }

/* ---------------------------------------------------------------------- */
/* 10. Badge / Pill                                                       */
/* ---------------------------------------------------------------------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--color-surface-alt);
  color: var(--color-text-secondary);
}
.badge-primary { background: var(--color-primary-soft); color: var(--color-primary); }
.badge-success { background: var(--color-success-soft); color: var(--color-success); }
.badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
.badge-danger { background: var(--color-danger-soft); color: var(--color-danger); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  background: var(--color-surface-alt);
  border: 1px solid var(--color-border);
  font-size: 0.8rem;
  font-weight: 700;
  white-space: nowrap;
}
.pill-countdown { color: var(--color-primary); }

/* ---------------------------------------------------------------------- */
/* 11. Progress（bar / ring）                                             */
/* ---------------------------------------------------------------------- */

.progress-bar {
  height: 10px;
  border-radius: var(--radius-pill);
  background: var(--color-surface-alt);
  border: 1px solid var(--color-border);
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--color-primary);
  transition: width 0.35s ease;
}
.progress-bar-fill.is-success { background: var(--color-success); }
.progress-bar-fill.is-warning { background: var(--color-warning); }
.progress-bar-fill.is-danger { background: var(--color-danger); }

/* 用法見 docs/API_ui.md：
   <svg class="progress-ring" viewBox="0 0 100 100">
     <circle class="progress-ring-track" cx="50" cy="50" r="40"/>
     <circle class="progress-ring-value" cx="50" cy="50" r="40"
             style="stroke-dasharray:251.2; stroke-dashoffset:{值}"/>
   </svg> */
.progress-ring { width: 96px; height: 96px; transform: rotate(-90deg); }
.progress-ring-track { fill: none; stroke: var(--color-border); stroke-width: 8; }
.progress-ring-value {
  fill: none;
  stroke: var(--color-primary);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s ease;
}
.progress-ring-label {
  transform: rotate(90deg);
  text-anchor: middle;
  font-size: 22px;
  font-weight: 700;
  fill: var(--color-text);
}

/* ---------------------------------------------------------------------- */
/* 12. 表格                                                               */
/* ---------------------------------------------------------------------- */

.table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--color-border); }
.table { width: 100%; border-collapse: collapse; min-width: 480px; background: var(--color-surface); }
.table th, .table td {
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid var(--color-border);
  white-space: nowrap;
}
.table th { color: var(--color-text-secondary); font-size: 0.8rem; font-weight: 700; background: var(--color-surface-alt); }
.table tbody tr:last-child td { border-bottom: none; }
.table tbody tr:hover { background: var(--color-surface-alt); }

/* ---------------------------------------------------------------------- */
/* 13. 選項按鈕（作答用）                                                  */
/* ---------------------------------------------------------------------- */

.option-list { display: flex; flex-direction: column; gap: 10px; }

.option-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 48px;
  padding: 12px 16px;
  text-align: left;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  transition: border-color 0.15s ease, background-color 0.15s ease;
}
.option-btn:hover:not(:disabled) { border-color: var(--color-primary); }
.option-btn:disabled { cursor: default; }

.option-label {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--color-surface-alt);
  font-size: 0.8rem;
  font-weight: 700;
}
.option-text { flex: 1; }
.option-mark { flex: 0 0 auto; font-size: 1.1rem; }

.option-btn.is-selected { border-color: var(--color-primary); background: var(--color-primary-soft); }
.option-btn.is-correct { border-color: var(--color-success); background: var(--color-success-soft); }
.option-btn.is-incorrect { border-color: var(--color-danger); background: var(--color-danger-soft); }

/* ---------------------------------------------------------------------- */
/* 14. 月曆格（30 天計畫）                                                */
/* ---------------------------------------------------------------------- */

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}

.day-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 8px;
}

.calendar-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 64px;
  padding: 8px 4px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  font-size: 0.8rem;
  cursor: pointer;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}
.calendar-cell:hover { border-color: var(--color-primary); }
.calendar-cell .cell-day { font-weight: 700; }
.calendar-cell .cell-label { color: var(--color-text-muted); font-size: 0.7rem; }

.calendar-cell.is-today { border-color: var(--color-primary); border-width: 2px; box-shadow: 0 0 0 2px var(--color-primary-soft); }
.calendar-cell.is-done { background: var(--color-success-soft); border-color: var(--color-success); }
.calendar-cell.is-partial { background: var(--color-warning-soft); border-color: var(--color-warning); }
.calendar-cell.is-future { opacity: 0.65; }
.calendar-cell.is-empty { visibility: hidden; cursor: default; }

/* ---------------------------------------------------------------------- */
/* 15. 閃卡（單字 SRS）                                                    */
/* ---------------------------------------------------------------------- */

.flashcard {
  perspective: 1200px;
  width: 100%;
  max-width: 420px;
  height: 260px;
  margin: 0 auto;
}
.flashcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
}
.flashcard.is-flipped .flashcard-inner { transform: rotateY(180deg); }

.flashcard-front, .flashcard-back {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
  padding: 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  box-shadow: var(--shadow-md);
  backface-visibility: hidden;
}
.flashcard-back { transform: rotateY(180deg); }

.flashcard-word { font-size: 1.9rem; font-weight: 800; }
.flashcard-pos { color: var(--color-text-muted); font-size: 0.85rem; }
.flashcard-zh { font-size: 1.3rem; font-weight: 700; color: var(--color-primary); }
.flashcard-example { color: var(--color-text-secondary); font-size: 0.9rem; }

/* ---------------------------------------------------------------------- */
/* 16. 統計格 / 空狀態                                                    */
/* ---------------------------------------------------------------------- */

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 14px;
}
.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: 16px;
}
.stat-value { font-size: 1.6rem; font-weight: 800; }
.stat-label { color: var(--color-text-secondary); font-size: 0.8rem; margin-top: 2px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 10px;
  padding: 56px 20px;
  color: var(--color-text-secondary);
}
.empty-state-icon { font-size: 2.4rem; }
.empty-state h2 { color: var(--color-text); }
.empty-state-error .empty-state-icon { color: var(--color-danger); }

/* ---------------------------------------------------------------------- */
/* 17. 表單元件                                                           */
/* ---------------------------------------------------------------------- */

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field-label { font-weight: 600; font-size: 0.9rem; }
.field-hint { color: var(--color-text-muted); font-size: 0.78rem; }

.input, .select, textarea.textarea {
  min-height: 44px;
  padding: 0 14px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  width: 100%;
}

  { id: "P1-02",
    part: "P1",
    title_zh: "陷阱聚焦動詞與方位介系詞：名詞聽對不等於答案對",
    title_en: "Traps hide in verbs and prepositions, not the nouns you recognize",
    detail_zh: "Part 1最常見的陷阱選項是把圖片中「存在的名詞」講對，但動作（動詞）或位置（方位介系詞）講錯，例如圖片人物明明是站著，選項卻說「正在坐下」；或把「橋下的車」說成「橋上的車」。也要留意發音相近但意思完全不同的陷阱字，例如 sit/knit、walk/work、coffee/copy。聽的時候要優先鎖定動詞和介系詞，而不是聽到熟悉的名詞就直接選它；可搭配 O（確定對）/△（不確定）/X（確定錯）三段標記法邊聽邊淘汰。",
    steps: ["聽每個選項時標記O/△/X", "優先確認動詞是否符合畫面動作", "確認方位介系詞是否符合畫面位置關係", "留意發音相近但語意不同的陷阱字"],
    pitfalls: ["聽到熟悉的名詞就直接選，沒確認動詞或介系詞是否正確", "被相似發音的字混淆，例如把 sit 聽成 knit"],
    example: "The car is parked under the bridge. (NOT 'on the bridge')",
    priority: "high",
    sources: ["https://mogeul.com/career/%ED%86%A0%EC%9D%B5-lc-%EB%A7%8C%EC%A0%90-%EC%A0%84%EB%9E%B5-%ED%8C%8C%ED%8A%B8%EB%B3%84-%EA%B3%B5%EB%9E%B5%EB%B6%80%ED%84%B0-%EC%89%90%EB%8F%84%EC%9E%89-%EC%99%84%EB%B2%BD-%EC%A0%95%EB%A6%AC/", "https://estudyme.com/en/toeic-listening-part-1-overview-and-tips/", "https://www.youtube.com/watch?v=fHHL0yc_5Kk"] },
  { id: "P1-03",
    part: "P1",
    title_zh: "分辨「簡單被動」與「進行式被動」語態",
    title_en: "Distinguish simple passive from progressive passive voice",
    detail_zh: "be + p.p.（如 is arranged、are displayed）多用來描述物品「已完成的靜態擺放狀態」；be + being + p.p.（如 is being repaired）則是描述「人正在對物品做的動作」。若照片中沒有完整拍到正在動作的人（例如只拍到手），很容易誤判成後者。聽到 being 要立刻提高警覺，去確認畫面中是否真的有人正在進行該動作。",
    steps: ["聽到 be + p.p. 先確認是否描述靜態擺放狀態", "聽到 being + p.p. 要確認畫面中是否真有人在動作中", "沒看到動作執行者時，being 開頭的選項通常是陷阱"],

    sources: ["https://www.yottau.com.tw/article/1325"] },

    detail_zh: "先花零點幾秒判斷照片是「有人」還是「無人（純景物/物品）」。如果是無人照片，只要選項出現 People、He、She、We，或使用需要「動作執行者」的進行式被動語態（is being + p.p.），就可以直接排除，不需要聽完整句，能有效節省判斷時間。",
    steps: ["播放前先判斷照片是否有人物", "無人照片時，聽到人稱代名詞立即刪除該選項", "聽到 being + p.p. 且畫面無人也立即刪除"],

    steps: ["判斷照片中多人動作是否相同", "動作相同時，重點聽動詞是否正確", "動作不同時，先分辨主詞再判斷動作", "額外留意人物手部動作細節"],

  { id: "P1-06",

  { id: "P2-01",
    part: "P2",
    title_zh: "句首疑問詞決定答案方向，聽不到就用語氣判斷",

  { id: "P2-02",

  { id: "P2-03",

    detail_zh: "新制多益中，僅憑「詞性位置」等純技巧就能作答的題目已不到5題，多數詞性題選項間意思差異頗大（如respective「各自的」vs respectable「值得尊敬的」），必須理解單字意思才能選對。建議把準備範圍收斂到詞性、主謂一致、代名詞、時態、語態、不定詞/動名詞、分詞、分詞構句、連接詞vs介系詞、關係子句、形容詞副詞、比較級最高級、假設語氣、倒裝句、名詞數量詞這15個文法考點，逐一弄懂判斷口訣，並搭配大量刷題（建議完整寫完一本收錄約1000題的文法練習題本，每題都要理解到「可以向別人講解」的程度），就能應付九成以上的文法題型。",
    steps: ["收斂到15個核心文法考點逐一弄懂判斷口訣", "遇到詞性選項意思差異大的題目要理解單字語意，不能只看詞性", "搭配大量刷題累積「一看就懂考點」的直覺反應"],
    pitfalls: ["以為詞性位置技巧能應付所有詞性題，忽略新制對單字語意理解的要求"],

  { id: "P6-01",

    detail_zh: "看到連接詞或轉折副詞（however、meanwhile、in addition、as a result、therefore）的選項時，先判斷前後句是因果、對比、遞進還是舉例關係，再從對應類型的詞庫裡挑選。同時留意分號和逗號的使用習慣：連接副詞（however、therefore）前通常用分號或句號另起一句，連接詞（but、so）前通常用逗號。",
    steps: ["判斷空格前後句的邏輯關係（因果/對比/遞進/舉例）", "從對應邏輯類型的連接詞庫中挑選", "留意分號/逗號等標點使用習慣輔助判斷"],

    detail_zh: "Part 6共16題，建議控制在8-10分鐘內完成，平均每題不超過20-30秒，每組（4題）控制在2分鐘內解決。作答時先快速找出該句甚至前後句的主詞+動詞主幹，掌握文章邏輯脈絡。若遇到需要通篇理解才能判斷的句子插入題，可以先跳過，等讀完全文、確認邏輯脈絡後再回來決定，避免因為一題卡關拖慢後面Part 7的作答節奏。練習後應統計自己常錯在「翻譯太慢」「抓不到段落邏輯」還是「看錯文本類型」，針對最常出現的錯誤類型加強。",

  { id: "P7-02",

    title_zh: "略讀(Skimming)抓大意、掃讀(Scanning)找細節，兩者交替使用",

    detail_zh: "略讀時只看標題、副標題、每段第一句和最後一句，粗抓文章主旨與類型，不必逐字閱讀；確定題目要問的資訊類型後，改用掃讀讓視線快速掃過全文，只鎖定與關鍵字相符的字詞或數字，找到後立即停下作答，不要回頭重複驗證。花30秒建立「這是什麼文件、誰寫給誰、目的是什麼」的骨架後再進入細節掃描，能大幅降低因看不懂就整篇重讀而超時的風險。",
    steps: ["花約30秒略讀標題、首段、每段首末句抓大意", "確認題目要找的資訊類型", "改用掃讀快速鎖定關鍵字或數字所在位置", "找到符合的內容立即停下作答"],

  { id: "P7-03",

  { id: "P7-05",
    part: "P7",
    title_zh: "NOT/TRUE題與跨文章比對題最花時間，留到該篇章最後處理",
    title_en: "Save time-consuming NOT/TRUE and cross-reference questions for last",
    detail_zh: "三篇閱讀中的「NOT符合」題型、以及需要交叉比對兩份文件（如信件+價目表）才能作答的題目，通常是整份考卷最花時間的題型。建議在同一篇章的其餘題目都做完之後，最後才處理這類題目。NOT題的做法是逐一在文章中找出三個「有提到」的選項先排除，剩下沒找到依據的那個就是答案，比從頭找「未提及」的東西更快。",

    detail_zh: "面對雙篇或三篇文章題組，先花1-2分鐘快速看過每篇文章的標題與前幾行，搞清楚「這幾篇文章彼此是什麼關係」（例如一封詢問信+一份回覆信+一張價目表），再開始作答，才能判斷某題答案該去哪一篇找。多篇閱讀常故意把關鍵資訊拆在不同文章中，建議邊讀邊在草稿紙或腦中記下人物、時間、數字的對應關係，遇到題目時才能快速交叉比對；優先處理只需查單一篇文章就能回答的題目，最後才處理需要跨文章整合的題目。",

  { id: "P7-09",

  { id: "Plan-03",

    explanation_zh: "先行詞 the reason 常搭配關係副詞 why，表「...的原因」，後接完整子句。where 用於地點、which/who 須接不完整子句，均不合此處固定搭配。關鍵字：why（關係副詞，常接 reason 之後）。",
    tag: "relative", difficulty: 2 },
  { id: "p5-089", stem: "The new product line not only increased sales ______ also strengthened the brand's reputation among younger consumers.",
    options: ["and", "or", "but", "so"], answer: 2,
    explanation_zh: "not only...but also 為固定對等連接詞組合，句中已出現 not only 及 also，須搭配 but 連接，形成 not only...but also。and/or/so 均無法與 not only 搭配構成此慣用句型。關鍵字：not only...but also（不僅...而且）。",
    tag: "conj", difficulty: 3 },
  { id: "p5-090", stem: "The new factory can produce ______ many units as the old one within the same time frame.",
    options: ["two times as much", "twice more", "two as", "twice as"], answer: 3,
    explanation_zh: "twice as + 形容詞/副詞原級 + as 為倍數比較固定句型，此處修飾可數名詞 units 須用 many，故 twice as many...as 正確。two times as much 使用 much（不可數）與 units（可數）不搭；twice more 為誤用；two as 文法不完整。關鍵字：twice as...as（是...的兩倍）。",
    tag: "comparison", difficulty: 2 },
  { id: "p5-091", stem: "All new employees must complete an orientation session ______ their first day of work.",
    options: ["prior to", "prior", "previous", "before to"], answer: 0,
    explanation_zh: "prior to 為介系詞片語，表「在...之前」，後接名詞 their first day of work。prior 單獨使用須搭配 to；previous 為形容詞不能直接接名詞當介系詞用；before to 為誤用（before 本身即為介系詞，不需加 to），均不合。關鍵字：prior to（在...之前）。",
    tag: "prep", difficulty: 1 },
  { id: "p5-092", stem: "The supervisor has not yet decided ______ the team will work overtime this weekend or take a scheduled break.",
    options: ["if", "whether", "that", "weather"], answer: 1,
    explanation_zh: "whether...or 為固定用法，表「是...還是...」，可作 decide 的受詞子句連接詞。if 雖也可表「是否」，但與 or 連用時 whether 較為標準；that 引導名詞子句無「是否」之意；weather 為同音異義字（天氣），拼字錯誤。關鍵字：whether...or（是...還是...）。",
    tag: "conj", difficulty: 2 },
  { id: "p5-093", stem: "The company relocated its headquarters to Taichung, ______ has significantly reduced operating costs.",
    options: ["that", "who", "which", "where"], answer: 2,
    explanation_zh: "逗號後的非限定用法子句，先行詞為前面整句話（遷移總部一事），須用 which 代替整個概念。非限定用法不可用 that；who 指人；where 為關係副詞須接完整子句而非缺主詞的結構，均不合。關鍵字：which（非限定用法，逗號後，代替前句）。",
    tag: "relative", difficulty: 2 },
  { id: "p5-094", stem: "A brief question-and-answer session will be held ______ the keynote speech.",
    options: ["follow", "followed", "to follow", "following"], answer: 3,
    explanation_zh: "following 在此作介系詞，表「在...之後」，後接名詞 the keynote speech。follow 為原形動詞不可直接置於此位置；followed 為過去分詞須搭配 be 動詞或作被動修飾；to follow 為不定詞用法不符句構，均不合。關鍵字：following（在...之後，介系詞用法）。",
    tag: "prep", difficulty: 1 },
  { id: "p5-095", stem: "Customer feedback suggests that the restaurant's new menu performs far ______ its previous one in terms of overall satisfaction.",
    options: ["better than", "more good than", "the best", "as good as"], answer: 0,
    explanation_zh: "better 為 good 的不規則比較級，搭配 than 構成比較句型，far 加強語氣修飾比較級。more good than 為誤用（good 的比較級是 better 而非 more good）；the best 為最高級，用於三者以上且不接 than；as good as 為同級比較，與句中 far（強調差距）語意不符。關鍵字：better than（比...更好，good 的比較級）。",
    tag: "comparison", difficulty: 3 },
  { id: "p5-096", stem: "______ the factory upgraded its equipment last year, production efficiency has not improved significantly.",
    options: ["Despite", "Even though", "Because of", "Due to"], answer: 1,
    explanation_zh: "even though 為連接詞，後接完整子句 the factory upgraded its equipment last year，表「儘管」。despite/because of/due to 皆為介系詞（片語），須接名詞而非子句，故不合。關鍵字：even though（儘管，+子句，語氣較 although 強）。",
    tag: "conj", difficulty: 2 },
  { id: "p5-097", stem: "The company issued a public statement ______ recent customer complaints about delivery delays.",
    options: ["responding", "in respond to", "in response to", "response"], answer: 2,
    explanation_zh: "in response to 為固定介系詞片語，表「回應」，後接名詞 recent customer complaints。responding 單獨使用須搭配 to 且此處非分詞構句語境；in respond to 為誤用（respond 為動詞非名詞，應用 response）；response 單獨使用不成介系詞片語，均不合。關鍵字：in response to（回應）。",
    tag: "prep", difficulty: 1 },
  { id: "p5-098", stem: "The promotion will be offered to ______ demonstrates the strongest leadership skills during the trial period.",
    options: ["whomever", "whose", "whichever", "whoever"], answer: 3,
    explanation_zh: "whoever 為複合關代，本身兼具先行詞與主詞功能，後接動詞 demonstrates，做 to 的受詞同時又是子句主詞，須用主格 whoever。whomever 為受格，用於子句中做受詞時使用；whose 須接名詞；whichever 用於事物選擇，均不合此處指人做主詞的語境。關鍵字：whoever（無論是誰，複合關代主格）。",
    tag: "relative", difficulty: 2 },
  { id: "p5-099", stem: "The finance department will continue to approve expense claims ______ receipts are submitted within 14 days.",
    options: ["as long as", "as soon as", "so far as", "as far as"], answer: 0,
    explanation_zh: "as long as 表「只要」，用於條件句，符合語意「只要在 14 天內提交收據就會核准」。as soon as 表「一...就」，強調時間先後而非條件；so far as 與 as far as 多用於表達「程度／範圍」（如 as far as I know），並非表條件的固定用法，均不符合此處語境。關鍵字：as long as（只要，表條件）。",
    tag: "conj", difficulty: 3 },
  { id: "p5-100", stem: "The annual trade show attracted ______ 5,000 visitors this year, a record high for the event.",
    options: ["as much as", "as many as", "so many as", "as many that"], answer: 1,
    explanation_zh: "as many as 用於修飾可數名詞的數量，表「多達」，此處 visitors 為可數名詞，故用 as many as。as much as 用於不可數名詞；so many as 與 as many that 均非正確固定用法，故不合。關鍵字：as many as（多達，修飾可數名詞）。",
    tag: "comparison", difficulty: 2 }
]);

  { id: "p5-101", stem: "Please ______ the attached file before submitting your application.",
    options: ["review", "revise", "reverse", "rehearse"], answer: 0,
    explanation_zh: "review「審閱、檢視」符合句意，指送出申請前請先檢視附件檔案；revise 指「修改內容」，句子並未提及要修改文件；reverse「反轉、撤銷」；rehearse「排練」皆與語境不合。關鍵字：review（審閱）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-102", stem: "The accounting department will issue a monthly ______ summarizing all transactions.",
    options: ["statement", "statue", "status", "static"], answer: 0,
    explanation_zh: "statement 在此指「對帳單、報表」，符合彙整所有交易的月報表語意；statue「雕像」與句意無關；status「狀態」為不可數名詞，與 summarizing 搭配不自然；static「靜態的」為形容詞，詞性不合。關鍵字：statement（對帳單、報表）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-103", stem: "The HR manager will ______ the new policy to all department heads next Monday.",
    options: ["announce", "denounce", "pronounce", "renounce"], answer: 0,
    explanation_zh: "announce「宣布」符合公布新政策的語境；denounce「譴責」、pronounce「發音；宣判」、renounce「放棄（權利）」皆與句意不符。關鍵字：announce（宣布）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-104", stem: "Please ______ Mr. Lin that his order will be processed within 24 hours.",
    options: ["assure", "ensure", "insure", "confirm"], answer: 0,
    explanation_zh: "assure + 人 + that 子句意為「向某人保證」，句意為向林先生保證訂單將於 24 小時內處理完成；ensure 雖也表「確保」，但不能直接接人當受詞；insure 指「投保」與訂單處理無關；confirm 接人當受詞不合慣用法（須用 confirm to sb.）。關鍵字：assure sb. that...（向某人保證）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-105", stem: "Our new advertising campaign has proven remarkably ______ in attracting younger customers.",
    options: ["effective", "affective", "effected", "affected"], answer: 0,
    explanation_zh: "effective「有效的」修飾 campaign 對吸引年輕客群的成效，符合句意；affective 為心理學用語「情感的」；effected 是 effect 的動詞過去式而非形容詞，文法不合；affected「受影響的、做作的」語意不符。關鍵字：effective（有效的）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-106", stem: "Passengers are advised to ______ at the gate at least 30 minutes before departure.",
    options: ["arrive", "achieve", "arise", "derive"], answer: 0,
    explanation_zh: "arrive「抵達」符合登機門情境；achieve「達成（目標）」、arise「發生、產生」、derive「衍生」皆與抵達登機門的語意不合。關鍵字：arrive at（抵達）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-107", stem: "The factory implemented stricter quality ______ to reduce the defect rate.",
    options: ["control", "inspection", "supervision", "observation"], answer: 0,
    explanation_zh: "「quality control」（品管）為業界固定用語，指持續監控生產流程以維持產品品質，符合顯著降低瑕疵率的語境；inspection「檢查」偏向單次稽核動作；supervision「監督」著重人員管理；observation「觀察」語意過於籠統，均非產業慣用的「品管」說法。關鍵字：quality control（品質管制）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-108", stem: "The marketing intern will ______ new photos to the company website this afternoon.",
    options: ["upload", "update", "upgrade", "uphold"], answer: 0,
    explanation_zh: "upload「上傳」符合將新照片上傳至公司網站的語境；update「更新（既有內容）」不需為圖片新增動作；upgrade「升級（版本、等級）」用於系統或設備；uphold「維護、支持（法律、原則）」語意不符。關鍵字：upload（上傳）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-109", stem: "The apartment is conveniently ______ near the subway station and shopping mall.",
    options: ["located", "allocated", "dedicated", "relocated"], answer: 0,
    explanation_zh: "located 在此指「座落於」，為固定用法「conveniently located near...」表示地理位置便利；allocated「（資源）被分配」；dedicated「專用的、奉獻的」；relocated「已搬遷的」皆與描述房屋所在位置的語意不符。關鍵字：conveniently located（地理位置便利）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-110", stem: "The restaurant offers a special ______ for customers who make reservations online.",
    options: ["discount", "discourse", "discord", "discharge"], answer: 0,
    explanation_zh: "discount「折扣」符合線上訂位優惠的語境；discourse「論述」、discord「不合、紛爭」、discharge「排放；解僱」皆與句意不符。關鍵字：discount（折扣）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-111", stem: "Patients are advised to ______ their appointment at least 24 hours in advance if they cannot attend.",
    options: ["cancel", "cease", "concede", "console"], answer: 0,
    explanation_zh: "cancel「取消」符合無法出席應提前 24 小時取消預約的語境；cease「停止（持續性動作）」不用於單次預約；concede「讓步、承認」；console「安慰」皆與句意無關。關鍵字：cancel an appointment（取消預約）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-112", stem: "The company's guidelines ______ that employees may work from home up to two days per week.",
    options: ["state", "states", "stated", "stating"], answer: 0,
    explanation_zh: "guidelines 為複數可數名詞，須搭配複數動詞 state（陳述），句意為公司的準則明訂員工每週可在家工作至多兩天；states 為第三人稱單數動詞，與複數主詞不一致；stated 為過去式，與句子描述現行規定的現在式語境不合；stating 為現在分詞，不能單獨作句子的主要動詞。關鍵字：guidelines state that...（準則明訂…）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-113", stem: "The board decided to ______ the merger proposal after months of negotiation.",
    options: ["finalize", "minimize", "realize", "generalize"], answer: 0,
    explanation_zh: "finalize「敲定、完成最終定案」符合經數月協商後拍板合併案的語境；minimize「使減至最少」；realize「意識到；實現」；generalize「使一般化、概括」皆與定案合併案的語意不符。關鍵字：finalize（拍板定案）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-114", stem: "Due to the ______ weather conditions, all flights have been grounded until further notice.",
    options: ["inclement", "incompetent", "inconsistent", "incoherent"], answer: 0,
    explanation_zh: "inclement「（天候）惡劣的」為固定搭配「inclement weather」，符合因惡劣天候航班全面停飛的語境；incompetent「無能力的」用於人；inconsistent「不一致的」；incoherent「語無倫次的」皆不用於形容天氣。關鍵字：inclement weather（惡劣天氣）。",
    tag: "vocab", difficulty: 3 },
  { id: "p5-115", stem: "The new warehouse management system significantly improved ______ throughout the supply chain.",
    options: ["efficiency", "efficient", "sufficiency", "proficiency"], answer: 0,
    explanation_zh: "efficiency「效率」為名詞，符合顯著提升供應鏈效率的語境，且 improved 後須接名詞受詞；efficient 為形容詞，詞性不合；sufficiency「充足性」；proficiency「熟練度、精通程度」皆語意不符。關鍵字：efficiency（效率）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-116", stem: "The plant manager instructed workers to ______ all safety procedures without exception.",
    options: ["comply with", "reply to", "apply for", "supply with"], answer: 0,
    explanation_zh: "comply with「遵守」符合要求員工毫無例外地遵守所有安全程序的語境；reply to「回覆」；apply for「申請」；supply with「供應」皆與遵守規定的語意不符。關鍵字：comply with（遵守）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-117", stem: "The proposal was ______ rejected by the committee due to budget constraints.",
    options: ["promptly", "properly", "probably", "promisingly"], answer: 0,
    explanation_zh: "promptly「立即、迅速地」符合因預算限制提案被迅速否決的語境；properly「適當地」；probably「可能地」語意不符，句子敘述已發生的事實而非推測；promisingly「有希望地」與提案被拒的結果矛盾。關鍵字：promptly（迅速地）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-118", stem: "Customers can contact technical ______ if they experience any issues with the app.",
    options: ["support", "supporter", "supportive", "supporting"], answer: 0,
    explanation_zh: "support 在此為不可數名詞「技術支援（服務）」，符合客戶如遇問題可聯繫技術支援的語境；supporter 指「支持者（人）」；supportive 為形容詞「給予支持的」；supporting 為現在分詞，詞性皆不合 technical 之後須接名詞的句構。關鍵字：technical support（技術支援）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-119", stem: "Employees who consistently exceed their targets are eligible for a performance ______.",
    options: ["bonus", "bonanza", "bonding", "bond"], answer: 0,
    explanation_zh: "bonus「獎金」符合持續超越目標的員工可獲得績效獎金的語境；bonanza「意外之財、豐收」語意誇張，不合正式獎金制度用語；bonding「聯繫、黏合」；bond「債券；聯繫」皆不符。關鍵字：performance bonus（績效獎金）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-120", stem: "Investors were concerned about the company's ______ debt levels after the latest earnings report.",
    options: ["staggering", "stagnant", "staged", "stagnated"], answer: 0,
    explanation_zh: "staggering「驚人的、龐大到令人咋舌的」修飾 debt levels，符合投資人對驚人負債水準感到憂心的語境；stagnant「停滯不前的」用於經濟成長或水質；staged 為 stage 的過去分詞「已安排的、分階段的」；stagnated 為 stagnate 的過去分詞「已停滯」，詞性與語意皆不合形容詞位置。關鍵字：staggering debt（驚人的負債）。",
    tag: "vocab", difficulty: 3 },
  { id: "p5-121", stem: "The chef will ______ a new menu featuring seasonal ingredients next month.",
    options: ["introduce", "induce", "instruct", "insist"], answer: 0,
    explanation_zh: "introduce「推出、引進」符合主廚下月將推出以當季食材為主的新菜單的語境；induce「誘使、導致」；instruct「指示」；insist「堅持」皆語意不符。關鍵字：introduce a new menu（推出新菜單）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-122", stem: "Tenants must obtain written ______ from the landlord before making any structural changes.",
    options: ["consent", "content", "context", "contest"], answer: 0,
    explanation_zh: "consent「同意、許可」符合房客進行結構變更前須取得房東書面同意的語境；content「內容」；context「背景、脈絡」；contest「競賽；爭議」皆與句意不符。關鍵字：written consent（書面同意）。",
    tag: "vocab", difficulty: 2 },
  { id: "p5-123", stem: "The clinic implemented a more ______ scheduling system to reduce patient waiting times.",
    options: ["streamlined", "straightened", "strengthened", "stretched"], answer: 0,
    explanation_zh: "streamlined「精簡化的」引申為「簡化流程的」，符合診所導入更精簡的排程系統以縮短候診時間的語境；straightened「弄直的」；strengthened「強化的」；stretched「延展的、拉長的」皆與簡化排程的語意不符。關鍵字：streamlined system（精簡化系統）。",
    tag: "vocab", difficulty: 3 },
  { id: "p5-124", stem: "The company plans to ______ its product line to include eco-friendly options.",
    options: ["expand", "expend", "exceed", "expose"], answer: 0,
    explanation_zh: "expand「擴展」符合公司計畫擴展產品線、納入環保選項的語境；expend「花費（金錢、精力）」；exceed「超過」；expose「使暴露、揭露」皆語意不符。關鍵字：expand a product line（擴展產品線）。",
    tag: "vocab", difficulty: 1 },
  { id: "p5-125", stem: "Please double-check the shipping ______ before the container leaves the port.",
    options: ["manifest", "manifesto", "manuscript", "manifold"], answer: 0,
    explanation_zh: "manifest 在航運領域指「艙單、貨物清單」，符合貨櫃出港前請再次核對艙單的語境；manifesto「宣言」；manuscript「手稿」；manifold「多樣的；歧管」皆與物流文件無關。關鍵字：shipping manifest（貨運艙單）。",
    tag: "vocab", difficulty: 3 },
  { id: "p5-126", stem: "The engineers worked overnight to ______ the server issue before the launch.",

    questions: [
      { n: 1, options: ["by", "since", "during", "from"], answer: 0,
        explanation_zh: "表示動作須在期限之前完成，用介係詞 by（在...之前）最正確；since 表示『自從』、during 表示『在...期間內』、from 表示起點，皆與『月底前完成搬遷』的語意不符。關鍵字：by the end of（在...結束前）。",
        type: "word" },
      { n: 2, options: ["In addition", "However", "Otherwise", "For example"], answer: 0,
        explanation_zh: "前句提到打包公共區域及標示紙箱，後句補充另一項提醒（備份電腦檔案），語意為附加說明，故選 In addition（此外）；However 表轉折、Otherwise 表『否則』、For example 表舉例，均不符合語意銜接。關鍵字：In addition（此外）。",
        type: "word" },
      { n: 3, options: ["The new office offers larger meeting rooms, a dedicated quiet zone, and improved parking facilities.", "Unfortunately, the moving company has cancelled the scheduled date.", "All employees must return their office keys by Friday.", "The building on Riverside Avenue was constructed in 1998."], answer: 0,
        explanation_zh: "此處銜接『IT 支援協助資料轉移』與『理解搬遷造成不便』兩句，插入說明新辦公室優點的句子最能承上啟下，也符合公告安撫語氣；選項二提到取消搬遷日期，與前文矛盾；選項三談歸還鑰匙，主題無關；選項四提及建築年份，與通知目的無關。關鍵字：larger meeting rooms（更大的會議室）。",
        type: "sentence" },
      { n: 4, options: ["direct", "directs", "directing", "directed"], answer: 0,
        explanation_zh: "please 後接原形動詞表示祈使句，故用 direct（原形）；directs 為第三人稱單數、directing 為現在分詞、directed 為過去式或過去分詞，皆不可直接接在 please 之後。關鍵字：please + 原形動詞（請...）。",
        type: "word" }
    ] },
  { id: "p6-002", title: "Memo: New expense reporting policy",
    passage: "To: All Staff\nFrom: Finance Department\nRe: Updated Expense Reporting Policy\n\nStarting September 1, all employees must submit expense reports [1] the online portal instead of paper forms. This change is designed to reduce processing time and minimize errors. [2] Receipts [3] NT$500 must be attached as scanned images or clear photographs. Employees who travel frequently should keep digital copies of all receipts throughout the month rather than waiting until the deadline. This new process applies to all expense categories, including travel, client entertainment, and office supplies. If you have questions about the new system, please attend the training session [4] Friday, August 28, in Conference Room B.\n\nThank you for your cooperation.",
    questions: [
      { n: 1, options: ["through", "on", "for", "about"], answer: 0,
        explanation_zh: "submit...through the portal 表示『透過此入口網站提交』，介係詞 through 表示媒介或方式最恰當；on 通常接日期或平台名稱、for 表目的、about 表關於，皆不符合此處語意。關鍵字：through the portal（透過入口網站）。",
        type: "word" },
      { n: 2, options: ["The new portal also allows employees to track the status of their reimbursements in real time.", "Unfortunately, the finance department will not process any reports this quarter.", "Employees are no longer required to keep any receipts for their purchases.", "The company parking garage will be repaved next month."], answer: 0,
        explanation_zh: "此句延續『減少處理時間及降低錯誤率』的說明，順勢介紹新系統可即時查詢核銷進度的優點，語意連貫；選項二表示本季不受理任何報告，與政策上線的目的矛盾；選項三表示不需保留收據，與下文『需附上收據』直接矛盾；選項四提及停車場鋪路工程，與費用報告政策無關。關鍵字：track the status（追蹤進度）。",
        type: "sentence" },
      { n: 3, options: ["exceeding", "exceed", "exceeded", "exceeds"], answer: 0,
        explanation_zh: "空格為分詞當形容詞，修飾前面的 Receipts，表『超過...的收據』，應用現在分詞 exceeding（主動、進行中的動作）；exceed 為原形動詞、exceeded 為過去式、exceeds 為第三人稱單數，皆不可直接修飾名詞。關鍵字：receipts exceeding（超過...的收據）。",
        type: "word" },
      { n: 4, options: ["on", "at", "in", "by"], answer: 0,
        explanation_zh: "特定的星期加日期前需用介係詞 on（在...這一天），如 on Friday, August 28；at 通常用於精確時刻、in 用於月份或年份等長時段、by 表『不遲於』，皆不符合。關鍵字：on + 星期與日期（在...那天）。",
        type: "word" }
    ] },
  { id: "p6-003", title: "Notice: Factory floor safety inspection",
    passage: "NOTICE TO ALL PRODUCTION STAFF\n\nThe annual safety inspection of the factory floor will take place on September 3 and 4. During this period, several production lines [1] be temporarily shut down so that inspectors can examine machinery and wiring. Workers assigned to affected lines should report to the training room instead of their usual stations. All safety equipment, including helmets and protective goggles, must be worn at all times while the inspection is underway. Employees who fail to follow these guidelines may be asked to leave the production area. We ask that all personal tools be removed from workstations [2] the inspection begins, as inspectors will need clear access to each machine. Supervisors will distribute a detailed schedule [3] each department by Monday. [4]\n\nSafety Office",
    questions: [
      { n: 1, options: ["will", "are", "have", "being"], answer: 0,
        explanation_zh: "本句描述檢查期間預計會關閉，屬未來被動語態，需用助動詞 will 搭配 be 加過去分詞（will be shut down）；are 為現在式被動、have 需接過去分詞構成完成式但語法不合、being 為現在分詞不能單獨作助動詞，皆不符合。關鍵字：will be shut down（將被關閉）。",
        type: "word" },
      { n: 2, options: ["before", "after", "during", "since"], answer: 0,
        explanation_zh: "依上下文，個人工具應在檢查開始之前移除，故用 before（在...之前）；after 表『之後』、during 表『期間中』、since 表『自從』，均與『事先淨空工作台』的語意不符。關鍵字：before the inspection begins（檢查開始前）。",
        type: "word" },
      { n: 3, options: ["to", "for", "at", "with"], answer: 0,
        explanation_zh: "distribute A to B 表示『將 A 分發給 B』，為固定搭配，故填 to；for 表目的、at 表地點、with 表『與...一起』，均不符合 distribute 的慣用介係詞。關鍵字：distribute...to（分發給...）。",
        type: "word" },
      { n: 4, options: ["We appreciate your cooperation in helping us maintain a safe working environment for everyone.", "The cafeteria will offer a special discount on Friday afternoon.", "This inspection was cancelled due to a scheduling conflict.", "New employees must complete orientation within their first week."], answer: 0,
        explanation_zh: "此句作為公告結尾，感謝員工配合維護安全的工作環境，語氣與內容皆呼應全文主旨；選項二提到餐廳折扣、選項三表示檢查已取消與全文矛盾、選項四談新人教育訓練，皆偏離主題。關鍵字：appreciate your cooperation（感謝配合）。",
        type: "sentence" }
    ] },
  { id: "p6-004", title: "Letter: Job offer",
    passage: "Dear Ms. Chen,\n\n[1] We are pleased to offer you the position of Marketing Coordinator at Sterling Consumer Goods, starting on September 15. Your starting salary will be NT$42,000 per month, along with standard benefits including health insurance and fourteen days of paid annual leave. This offer is contingent [2] the successful completion of a background check, which our human resources team will arrange within the next week. Please review the attached contract carefully and sign [3] the designated area on the last page. We would appreciate receiving your signed contract by August 22 so that we can begin preparing your onboarding materials. If you have any questions about the terms of employment, feel free to contact me [4] phone or email.\n\nWe look forward to welcoming you to our team.\n\nSincerely,\nDavid Lin\nHuman Resources Manager",
    questions: [
      { n: 1, options: ["Thank you for attending the interview with our team last week.", "Unfortunately, we have decided to offer the position to another candidate.", "Please note that this position has been eliminated due to budget cuts.", "Our company was founded more than fifty years ago."], answer: 0,
        explanation_zh: "書信開頭先感謝對方前來面試，銜接下一句『很高興提供職位』最符合求職信慣例與邏輯順序；選項二、選項三皆與錄取通知的目的矛盾，表示未錄取或職缺已取消；選項四提及公司歷史，與此封信主旨無關。關鍵字：Thank you for attending the interview（感謝您前來面試）。",
        type: "sentence" },
      { n: 2, options: ["upon", "to", "in", "with"], answer: 0,
        explanation_zh: "be contingent upon + 名詞為固定用法，表示『以...為條件』；contingent to、in、with 皆非正確搭配。關鍵字：contingent upon（以...為條件）。",
        type: "word" },
      { n: 3, options: ["in", "on", "at", "by"], answer: 0,
        explanation_zh: "designated area（指定區域）為一個範圍空間，前面須搭配介係詞 in（在...範圍內簽名）；on 通常用於平面、at 用於明確定點、by 表『在旁邊』或『不遲於』，均不如 in 精確。關鍵字：sign in the designated area（在指定區域簽名）。",
        type: "word" },
      { n: 4, options: ["by", "with", "through", "in"], answer: 0,
        explanation_zh: "by + 方式表示『藉由某種方式』，contact someone by phone or email 為固定用法；with、through、in 均不符合此處『以電話或email聯繫』的慣用表達。關鍵字：by phone or email（以電話或email）。",
        type: "word" }
    ] },
  { id: "p6-005", title: "Article: Local startup launches budgeting app",
    passage: "A local technology startup, FinTrack Solutions, launched its new budgeting application last week, attracting more than ten thousand downloads within the first three days. The app allows users to track spending, set savings goals, and receive alerts when they [1] approach their monthly budget limits. [2] The founders say this feature distinguishes FinTrack from competitors that only provide monthly summaries. Company representatives noted that the app was developed over eighteen months with feedback from more than two hundred beta testers. Investors have taken notice of the app's [3] growth; a venture capital firm announced this week that it would invest NT$15 million in the company. The founders plan to use the funding to expand their engineering team and [4] the app to include investment tracking features next year.\n\nThe company expects to reach fifty thousand users by the end of the year.",
    questions: [
      { n: 1, options: ["approach", "approaches", "approached", "approaching"], answer: 0,
        explanation_zh: "主詞 they 為複數，一般現在式動詞不加 s，故用 approach；approaches 為第三人稱單數形式、approached 為過去式、approaching 為現在分詞，均不符合本句現在式邏輯。關鍵字：when they approach（當他們接近...時）。",
        type: "word" },
      { n: 2, options: ["Users receive a push notification as soon as their spending reaches eighty percent of the set limit.", "The app was rejected by several major app stores due to security concerns.", "Most competing apps charge a monthly subscription fee of NT$300.", "FinTrack's headquarters will relocate to a larger office next spring."], answer: 0,
        explanation_zh: "此句具體說明提醒功能如何運作，承接前句『當使用者接近預算上限時收到提醒』，並自然帶出下句『此功能與競品的差異』；選項二表示被下架，與文章描述的成功情況矛盾；選項三談競品收費模式，與此功能的運作方式無直接關聯；選項四提及總部搬遷，與段落主題無關。關鍵字：push notification（推播通知）。",
        type: "sentence" },
      { n: 3, options: ["rapid", "rapidly", "rapidity", "rapidness"], answer: 0,
        explanation_zh: "growth 為名詞，前面須用形容詞修飾，故選 rapid（快速的）；rapidly 為副詞，rapidity、rapidness 為名詞，皆不可直接修飾名詞 growth。關鍵字：rapid growth（快速成長）。",
        type: "word" },
      { n: 4, options: ["update", "updates", "updated", "updating"], answer: 0,
        explanation_zh: "此處與前面的 expand 為對等的原形動詞（plan to expand...and update...），需保持動詞形式一致，故選 update；updates、updated、updating 皆破壞對等結構。關鍵字：expand...and update（擴充...並更新）。",
        type: "word" }
    ] },
  { id: "p6-006", title: "Advertisement: Grand opening of Riverside Bistro",
    passage: "Riverside Bistro is opening its doors on September 5, and we invite you to celebrate with us! Located just steps from Riverside Avenue, our restaurant offers a seasonal menu [1] fresh, locally sourced ingredients. From handmade pasta to grilled seafood, there is something for every taste. To celebrate our grand opening, all guests who make a reservation before August 30 will receive a complimentary appetizer [2] their visit. [3] Simply mention this advertisement when you book your table by phone or through our website. Reservations are strongly recommended, as seating is limited during our opening week. We look forward to [4] you at Riverside Bistro soon.\n\nCall 02-2345-6789 or visit www.riversidebistro.example to reserve your table.",
    questions: [
      { n: 1, options: ["with", "by", "from", "of"], answer: 0,
        explanation_zh: "with 表示『具有、包含』，a menu with fresh ingredients 表示『含有新鮮食材的菜單』；by 表方式或行為者、from 表來源、of 表所屬關係，均不符合此處語意。關鍵字：a menu with...（附有...的菜單）。",
        type: "word" },
      { n: 2, options: ["during", "while", "when", "since"], answer: 0,
        explanation_zh: "during 為介係詞，後接名詞片語（their visit），表『在...期間』；while 和 when 為連接詞，後面須接子句，不可直接接名詞片語；since 表『自從』，語意不符。關鍵字：during their visit（在造訪期間）。",
        type: "word" },
      { n: 3, options: ["This limited-time offer is valid only for reservations made during our first two weeks of business.", "Unfortunately, we are no longer accepting new reservations at this time.", "Our restaurant will be closed for renovations starting next month.", "All of our chefs have more than twenty years of experience in the industry."], answer: 0,
        explanation_zh: "此句說明限時優惠僅限開幕前兩週的訂位，補充說明前句『贈送開胃菜』的優惠內容，並與下句『訂位時提及本廣告』呼應；選項二表示目前不接受訂位，與廣告目的矛盾；選項三表示即將裝修暫停營業，與盛大開幕矛盾；選項四談主廚資歷，與優惠活動無關。關鍵字：limited-time offer（限時優惠）。",
        type: "sentence" },
      { n: 4, options: ["seeing", "see", "saw", "seen"], answer: 0,
        explanation_zh: "look forward to 後面的 to 為介係詞，須接動名詞，故用 seeing；see、saw、seen 皆為動詞原形、過去式或過去分詞，不可直接接在介係詞 to 後面。關鍵字：look forward to seeing（期待見到）。",
        type: "word" }
    ] },
  { id: "p6-007", title: "Announcement: 10th anniversary celebration",
    passage: "Sterling Consumer Goods is proud to announce that we will celebrate our tenth anniversary on October 10 with a special event for employees, customers, and partners. The celebration will [1] held at our headquarters and will include product demonstrations, live music, and a catered dinner. All employees are encouraged to attend with a guest, and formal invitations will be sent [2] email by the end of this week. Customers who have supported us since our founding will receive a commemorative gift as a token of our appreciation. [3] We also plan to unveil three new products that will be [4] available in stores starting next month. Please RSVP by September 25 so that we can finalize catering arrangements.\n\nWe look forward to celebrating this milestone with all of you.",
    questions: [
      { n: 1, options: ["be", "been", "being", "is"], answer: 0,
        explanation_zh: "未來被動語態需用 will 加 be 加過去分詞（will be held），故選 be；been 為過去分詞、being 為現在分詞、is 為現在式，皆不能接在 will 之後構成正確的未來被動式。關鍵字：will be held（將被舉行）。",
        type: "word" },
      { n: 2, options: ["by", "with", "on", "at"], answer: 0,
        explanation_zh: "by + 方式表示『藉由某方式』，sent by email 為固定用法；with、on、at 均不符合此處表達寄送方式的語意。關鍵字：sent by email（以電子郵件寄送）。",
        type: "word" },
      { n: 3, options: ["The gift will include a specially designed anniversary mug and a discount coupon for future purchases.", "Unfortunately, the anniversary celebration has been postponed until next year.", "New employees are required to complete three days of orientation training.", "The company's annual report will be published in December."], answer: 0,
        explanation_zh: "此句具體說明前一句提到的紀念禮物內容，語意緊密銜接；選項二表示慶祝活動已延期，與公告內容矛盾；選項三談新人訓練、選項四談年度報告，皆與週年慶祝活動及禮品無關。關鍵字：commemorative gift（紀念禮品）。",
        type: "sentence" },
      { n: 4, options: ["made", "done", "put", "set"], answer: 0,
        explanation_zh: "be made available 為固定用法，表示『被提供、上市』；done、put、set 雖然也是過去分詞，但與 available 搭配不符合英語慣用表達。關鍵字：made available（推出、上市）。",
        type: "word" }
    ] },
  { id: "p6-008", title: "Email: Shipment delay notification",
    passage: "Subject: Delay in Shipment #48213\n\nDear Mr. Alvarez,\n\nWe are writing to inform you that your shipment, order #48213, [1] been delayed due to unexpected customs inspections at the port. The shipment was originally scheduled to arrive at your warehouse on August 20, but we now expect it to arrive [2] August 25 at the latest. We understand that this delay may affect your production schedule, and we sincerely apologize for any inconvenience this may cause. Our logistics team is working closely with customs officials to expedite the release of your goods. In the meantime, we [3] provide you with real-time tracking updates so that you can monitor the shipment's progress. [4]\n\nPlease do not hesitate to contact our customer service line if you have any further questions.\n\nBest regards,\nLogistics Coordination Team",
    questions: [
      { n: 1, options: ["has", "have", "had", "having"], answer: 0,
        explanation_zh: "主詞 shipment 為單數，現在完成被動式需用 has been 加過去分詞，故選 has；have 用於複數主詞或第一、第二人稱、had 為過去完成式、having 為現在分詞，均不符合單數主詞的現在完成式。關鍵字：has been delayed（已被延誤）。",
        type: "word" },
      { n: 2, options: ["by", "on", "at", "in"], answer: 0,
        explanation_zh: "by + 日期表示『不遲於某日』，句尾 at the latest（最晚）也呼應此意；on 用於精確指出某一天但不含『不遲於』的語感、at 用於時刻、in 用於月份或年份，均不如 by 貼切。關鍵字：by August 25 at the latest（最晚於8月25日前）。",
        type: "word" },
      { n: 3, options: ["will", "would", "should", "might"], answer: 0,
        explanation_zh: "此處表示公司明確承諾將提供追蹤更新，須用 will 表示肯定的未來動作；would 通常用於條件句或委婉語氣、should 表建議或推測、might 表不確定，均不符合明確承諾的語意。關鍵字：we will provide（我們將提供）。",
        type: "word" },
      { n: 4, options: ["We are also arranging for expedited shipping on your next order at no additional cost as a gesture of goodwill.", "Unfortunately, we will not be able to fulfill any future orders from your company.", "The customs inspection fee will be added to your next invoice.", "Our warehouse will be relocating to a new address next year."], answer: 0,
        explanation_zh: "此句提出補償措施，符合道歉信件的語氣，並自然銜接下句『如有疑問請聯繫客服』；選項二表示未來不再接受訂單，與客服致歉語氣矛盾；選項三表示要向客戶收取檢驗費用，與道歉立場矛盾；選項四提及倉庫搬遷，與貨物延誤無關。關鍵字：as a gesture of goodwill（作為善意表示）。",
        type: "sentence" }
    ] },
  { id: "p6-009", title: "Memo: Updated health insurance benefits",
    passage: "To: All Employees\nFrom: Human Resources\nRe: Health Insurance Plan Updates\n\n[1] Beginning October 1, the company will switch to a new health insurance provider, MediCare Plus, which offers expanded coverage at a lower monthly premium. Under the new plan, employees will have access to a wider network of clinics and hospitals, [2] several new facilities located near our headquarters. Dental and vision coverage will also be included at no additional cost, a benefit that was previously available only as a paid add-on. Employees who wish to keep their current dependents on the plan must submit an updated enrollment form [3] September 20. Human resources will hold two information sessions next week to answer questions about the transition. Employees are strongly [4] to attend one of these sessions. If you cannot attend either session, please email hr@sterling.example for assistance.\n\nHuman Resources Department",
    questions: [
      { n: 1, options: ["We are writing to inform you of important changes to our employee health insurance plan.", "The company has decided to eliminate health insurance benefits for all employees.", "This memo has no connection to the upcoming benefits enrollment period.", "All employees must resign from the current health plan by tomorrow."], answer: 0,
        explanation_zh: "此句作為備忘錄開頭，說明來信目的為告知健康保險方案的重要異動，語氣正式且承接下句『十月一日起將更換保險公司』；選項二表示取消保險福利，與全文擴大保障矛盾；選項三自稱與本次改版無關，自相矛盾；選項四要求明天前退出保險，與後文時間點不符。關鍵字：important changes to...plan（方案的重要異動）。",
        type: "sentence" },
      { n: 2, options: ["including", "include", "included", "includes"], answer: 0,
        explanation_zh: "此處為分詞片語修飾前面的名詞片語，表『包括...』，須用現在分詞 including；include、included、includes 皆為限定動詞形式，不能在此以片語方式修飾名詞。關鍵字：including（包括）。",
        type: "word" },
      { n: 3, options: ["by", "until", "since", "for"], answer: 0,
        explanation_zh: "by + 日期表示『不遲於某日』，符合繳交表單期限的語意；until 表示『持續到...為止』常搭配延續性動作而非一次性繳交動作、since 表『自從』、for 表『為了』或『持續期間』，均不符合。關鍵字：by September 20（9月20日前）。",
        type: "word" },
      { n: 4, options: ["encouraged", "encourage", "encouraging", "encourages"], answer: 0,
        explanation_zh: "此句為被動語態 are 加過去分詞，表『被鼓勵』，故用過去分詞 encouraged；encourage 為原形動詞、encouraging 為現在分詞、encourages 為第三人稱單數現在式，皆不能直接接在 be 動詞後構成被動語態。關鍵字：are encouraged to（被鼓勵去...）。",
        type: "word" }

  { id: "p6-010", title: "Notice: Parking lot changes",
    passage: "NOTICE TO ALL RESIDENTS\n\nStarting September 1, the parking arrangements at Willow Court Apartments will change. Due to ongoing repaving work, the north parking lot will be closed [1] two weeks, and residents who normally park there must use the temporary spaces in the south lot instead. [2] Residents are asked to remove all vehicles from the north lot by 8:00 p.m. on August 31 so that construction crews can begin work early the next morning. Visitor parking will remain available in its usual location throughout the repaving period. Management apologizes for [3] inconvenience this may cause and appreciates residents' patience while these improvements are completed. For questions about temporary parking assignments, please [4] the management office at extension 105.\n\nWillow Court Management",
    questions: [
      { n: 1, options: ["for", "during", "since", "while"], answer: 0,
        explanation_zh: "for + 一段時間表示『持續多久』，closed for two weeks 表示『關閉兩週』；during 後須接特定期間名詞而非單純的時間長度、since 表起點、while 為連接詞須接子句，皆不符合。關鍵字：closed for two weeks（關閉兩週）。",
        type: "word" },
      { n: 2, options: ["The south lot has been expanded to accommodate the additional vehicles during this period.", "Unfortunately, the south lot will also be closed for repairs next month.", "Residents who violate parking rules will have their leases terminated immediately.", "The apartment complex was built in 2015."], answer: 0,
        explanation_zh: "此句說明南側停車場已擴大以容納額外車輛，補充說明前句改停南側停車場的可行性，並自然銜接下句具體移車指示；選項二表示南側停車場下月也將關閉，造成混淆與矛盾；選項三談違規停車將終止租約，語氣及主題皆不符；選項四提及建築年份，與停車安排無關。關鍵字：expanded to accommodate（擴大以容納）。",
        type: "sentence" },
      { n: 3, options: ["any", "the", "a", "some"], answer: 0,
        explanation_zh: "apologize for any inconvenience this may cause 為公告或書信中常見的固定用語，表示對於可能造成的任何不便致歉；the、a、some 均不符合此慣用表達中習慣使用 any 的用法。關鍵字：any inconvenience this may cause（任何可能造成的不便）。",
        type: "word" },
      { n: 4, options: ["contact", "contacts", "contacting", "contacted"], answer: 0,
        explanation_zh: "please 後接原形動詞表示祈使句，故用 contact；contacts 為第三人稱單數、contacting 為現在分詞、contacted 為過去式或過去分詞，皆不可直接接在 please 之後。關鍵字：please contact（請聯繫）。",
        type: "word" }
    ] },
  { id: "p6-011", title: "Letter: Travel itinerary confirmation",
    passage: "Dear Mr. and Mrs. Watanabe,\n\nThank you for booking your vacation package with Golden Horizon Travel. This letter confirms your itinerary for your upcoming trip to Taipei, [1] departs on October 3 and returns on October 10. Your flight, hotel, and airport transfers have all been [2] and paid in full. You will be staying at the Grand Harbor Hotel, located in the heart of the city, within walking distance of major attractions and shopping districts. A detailed day-by-day itinerary, including your guided city tour and cooking class reservation, is attached to this letter. Please [3] your passport is valid for at least six months beyond your return date, as this is required for international travel. [4]\n\nIf you have any questions before your departure, please contact our office at 02-8765-4321.\n\nWarm regards,\nGolden Horizon Travel",
    questions: [
      { n: 1, options: ["which", "who", "whose", "that"], answer: 0,
        explanation_zh: "先行詞為 trip（事物），且逗號後為非限定用法子句，須用 which；who 用於指人、whose 表所有格、that 通常不用於逗號後的非限定子句，均不符合文法規則。關鍵字：, which departs（，該行程於...出發）。",
        type: "word" },
      { n: 2, options: ["confirmed", "confirming", "confirm", "confirms"], answer: 0,
        explanation_zh: "have been 加過去分詞為現在完成被動式，且需與後方 paid（過去分詞）對等並列，故選 confirmed；confirming 為現在分詞、confirm 為原形、confirms 為第三人稱單數現在式，皆不符合被動語態及對等結構。關鍵字：have been confirmed and paid（已確認並付清）。",
        type: "word" },
      { n: 3, options: ["ensure", "assure", "insure", "ensures"], answer: 0,
        explanation_zh: "ensure 表示『確保（某事屬實）』，語意符合請確保護照效期；assure 表示『向某人保證』需接人為受詞、insure 表示『投保』、ensures 為第三人稱單數形式不可接在 please 之後，皆不符合。關鍵字：ensure your passport is valid（確保護照有效）。",
        type: "word" },
      { n: 4, options: ["We hope you have a wonderful and memorable trip to Taipei.", "Unfortunately, your reservation has been cancelled due to non-payment.", "Please note that all sales at our office are final and non-refundable.", "Our travel agency will be closing permanently at the end of this year."], answer: 0,
        explanation_zh: "此句以溫馨祝福作結，符合旅遊行程確認信件的語氣，並自然銜接下句如有疑問請聯繫本公司；選項二表示訂單已取消，與前文已付清全額矛盾；選項三提到所有銷售不可退費，語氣生硬且與此信主旨無關；選項四表示公司即將永久歇業，與信件提供聯絡方式的用意矛盾。關鍵字：wonderful and memorable trip（美好難忘的旅程）。",
        type: "sentence" }
    ] },
  { id: "p6-012", title: "Article: Survey shows rise in remote work adoption",
    passage: "[1] A new survey conducted by the National Business Association found that nearly sixty percent of companies now offer some form of remote or hybrid work arrangement, up from just twenty percent five years ago. The survey, which included responses from more than eight hundred companies across various industries, also found that employee satisfaction scores were noticeably higher at companies offering flexible schedules. Researchers noted that productivity levels [2] remained steady or improved at most companies that adopted remote work policies, contradicting earlier concerns that employees would be less productive outside a traditional office. However, the survey also identified challenges, including difficulty maintaining company culture and [3] communication among team members who rarely meet in person. Despite these obstacles, most business leaders surveyed said they plan to continue offering flexible work options [4] the foreseeable future.\n\nThe full report will be published next month.",
    questions: [
      { n: 1, options: ["Remote work continues to reshape how companies across the country operate.", "Most companies have completely abandoned remote work policies this year.", "The National Business Association was founded in 1952.", "Employees strongly prefer working in a traditional office setting."], answer: 0,
        explanation_zh: "此句作為文章開頭的主題句，概括說明遠距工作持續改變企業營運方式，並自然帶出下句最新調查顯示的具體數據；選項二表示企業已完全放棄遠距工作，與文章採用率上升的調查結果矛盾；選項三談協會成立年份，與文章主題無關；選項四表示員工偏好傳統辦公室，與後文彈性工作滿意度較高矛盾。關鍵字：reshape how companies operate（重塑企業營運方式）。",
        type: "sentence" },
      { n: 2, options: ["have", "has", "had", "having"], answer: 0,
        explanation_zh: "主詞 levels 為複數，現在完成式須用 have 加過去分詞（have remained），故選 have；has 用於單數主詞、had 為過去完成式、having 為現在分詞，均不符合複數主詞的現在完成式用法。關鍵字：levels have remained（水準已持續維持）。",
        type: "word" },
      { n: 3, options: ["coordinating", "coordinate", "coordinated", "coordination"], answer: 0,
        explanation_zh: "此處與前面的 maintaining 為對等動名詞片語，須保持動詞ing形式一致，故選 coordinating；coordinate 為原形動詞、coordinated 為過去式或過去分詞、coordination 為名詞，皆破壞對等結構。關鍵字：maintaining...and coordinating（維持...與協調...）。",
        type: "word" },
      { n: 4, options: ["for", "in", "during", "within"], answer: 0,
        explanation_zh: "for the foreseeable future 為固定片語，表示『在可預見的未來』；in、during、within 均不符合此慣用搭配。關鍵字：for the foreseeable future（在可預見的未來）。",
        type: "word" }
    ] }
]);

  { id: "p7-002", type: "single",
    passages: [ { kind: "email", title: "Email: Delayed Shipment Inquiry", text: `Subject: Order #48219 - Missing Items

  { id: "p7-003", type: "single",
    passages: [ { kind: "email", title: "Email: Team Meeting Rescheduled", text: `Dear Team,

  { id: "p7-004", type: "single",

  { id: "p7-005", type: "single",
    passages: [ { kind: "article", title: "Article: Local Bakery Chain Expands Region-Wide", text: `Sunrise Bakery, a local favorite known for its sourdough bread and pastries, announced last week that it will open five new branches across the region by the end of next year. The company, which started as a single shop in Maple Grove twelve years ago, now operates eight locations and employs more than 150 people.

<script>
/* js/util.js */
/**
 * js/util.js
 * 通用工具函式庫。無外部依賴，純瀏覽器 API。
 * 暴露：window.Util
 */
(function () {
  'use strict';

  function pad2(n) {
    return n < 10 ? '0' + n : String(n);
  }

  // ---------------------------------------------------------------------
  // DOM helpers
  // ---------------------------------------------------------------------

  function $(selector, root) {
    return (root || document).querySelector(selector);
  }

  function $$(selector, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(selector));
  }

  /**
   * h(tag, attrs, ...children) — 建立 DOM 元素（hyperscript 風格）。
   * - tag 支援簡寫："div.card#main"（tag 預設 div，可疊加多個 .class，最多一個 #id）
   * - attrs：
   *    class / className: 字串或字串陣列
   *    style: 物件（camelCase 屬性）
   *    on*: 事件處理器，例如 onClick、onInput、onKeydown
   *    dataset: 物件，設定 data-* 屬性
   *    boolean 值：true 時設為屬性（如 disabled: true），false/null/undefined 略過
   *    value/checked/selected/disabled/required/readOnly: 以 DOM property 設定
   *    其餘: 以 setAttribute 設定
   * - children：字串 / 數字 / Node / 陣列（可巢狀）/ null（略過）
   */
  function h(tag, attrs) {
    var children = Array.prototype.slice.call(arguments, 2);
    attrs = attrs || {};

    var tagName = tag;
    var id = '';
    var classes = [];
    var shorthand = /^([a-zA-Z][a-zA-Z0-9]*)?((?:[.#][^.#]+)*)$/.exec(tag || 'div');
    if (shorthand && shorthand[2]) {
      tagName = shorthand[1] || 'div';
      var parts = shorthand[2].match(/[.#][^.#]+/g) || [];
      parts.forEach(function (p) {
        if (p.charAt(0) === '#') id = p.slice(1);
        else classes.push(p.slice(1));
      });
    }

    var el = document.createElement(tagName || 'div');
    if (id) el.id = id;
    if (classes.length) el.className = classes.join(' ');

    Object.keys(attrs).forEach(function (key) {
      var value = attrs[key];
      if (value === null || value === undefined) return;

      if (key === 'class' || key === 'className') {
        var cls = Array.isArray(value) ? value.filter(Boolean).join(' ') : value;
        if (!cls) return;
        el.className = el.className ? el.className + ' ' + cls : cls;
        return;
      }
      if (key === 'style' && typeof value === 'object') {
        Object.keys(value).forEach(function (sk) {
          el.style[sk] = value[sk];
        });
        return;
      }
      if (key === 'dataset' && typeof value === 'object') {
        Object.keys(value).forEach(function (dk) {
          el.dataset[dk] = value[dk];
        });
        return;
      }
      if (/^on[A-Z]/.test(key) && typeof value === 'function') {
        el.addEventListener(key.slice(2).toLowerCase(), value);
        return;
      }
      if (key === 'value' || key === 'checked' || key === 'selected' ||
          key === 'disabled' || key === 'required' || key === 'readOnly') {
        el[key] = value;
        return;
      }
      if (typeof value === 'boolean') {
        if (value) el.setAttribute(key, '');
        return;
      }
      el.setAttribute(key, value);
    });

    function append(child) {
      if (child === null || child === undefined || child === false) return;
      if (Array.isArray(child)) {
        child.forEach(append);
        return;
      }
      if (child instanceof Node) {
        el.appendChild(child);
        return;
      }
      el.appendChild(document.createTextNode(String(child)));
    }
    children.forEach(append);

    return el;
  }

  function escapeHtml(str) {
    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    return String(str).replace(/[&<>"']/g, function (ch) {
      return map[ch];
    });
  }

  // ---------------------------------------------------------------------
  // Array helpers
  // ---------------------------------------------------------------------

  /** shuffle(arr) — Fisher-Yates，回傳新陣列，不改動原陣列 */
  function shuffle(arr) {
    var copy = (arr || []).slice();
    for (var i = copy.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = copy[i];
      copy[i] = copy[j];
      copy[j] = tmp;
    }
    return copy;
  }

  /** sample(arr, n) — 從 arr 隨機取 n 個不重複元素，回傳新陣列 */
  function sample(arr, n) {
    var pool = shuffle(arr || []);
    return pool.slice(0, clamp(n, 0, pool.length));
  }

  // ---------------------------------------------------------------------
  // Date helpers（一律以 ISO "YYYY-MM-DD" 字串表示日期，使用本地時區）
  // ---------------------------------------------------------------------

  function formatISO(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function parseISO(iso) {
    var parts = String(iso).split('-').map(Number);
    return new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
  }

  function todayISO() {
    return formatISO(new Date());
  }

  function addDays(iso, n) {
    var d = parseISO(iso);
    d.setDate(d.getDate() + Number(n || 0));
    return formatISO(d);
  }

  /** diffDays(a, b) — 回傳 b - a 的天數（a、b 皆為 ISO 字串） */
  function diffDays(a, b) {
    var pa = String(a).split('-').map(Number);
    var pb = String(b).split('-').map(Number);
    var da = Date.UTC(pa[0], (pa[1] || 1) - 1, pa[2] || 1);
    var db = Date.UTC(pb[0], (pb[1] || 1) - 1, pb[2] || 1);
    return Math.round((db - da) / 86400000);
  }

  var WEEKDAYS_ZH = ['日', '一', '二', '三', '四', '五', '六'];

  /** fmtDate(iso, {weekday}) — 預設輸出 "2026/08/17（一）" */
  function fmtDate(iso, opts) {
    opts = opts || {};
    var d = parseISO(iso);
    var base = d.getFullYear() + '/' + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate());
    if (opts.weekday === false) return base;
    return base + '（' + WEEKDAYS_ZH[d.getDay()] + '）';
  }

  /** fmtTime(seconds) — 秒數轉 mm:ss */
  function fmtTime(seconds) {
    var total = Math.max(0, Math.floor(Number(seconds) || 0));
    var m = Math.floor(total / 60);
    var s = total % 60;
    return pad2(m) + ':' + pad2(s);
  }

  // ---------------------------------------------------------------------
  // Number helpers
  // ---------------------------------------------------------------------

  function clamp(n, min, max) {
    n = Number(n);
    if (Number.isNaN(n)) n = min;
    return Math.min(Math.max(n, min), max);
  }

  /** pct(part, total) — 回傳 0-100 的百分比整數 */
  function pct(part, total) {
    if (!total) return 0;
    return clamp(Math.round((part / total) * 100), 0, 100);
  }

  // ---------------------------------------------------------------------
  // Function helpers
  // ---------------------------------------------------------------------

  function debounce(fn, wait) {
    var timer = null;
    return function () {
      var ctx = this;
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () {
        fn.apply(ctx, args);
      }, wait);
    };
  }

  var uidCounter = 0;
  function uid(prefix) {
    uidCounter += 1;
    return (prefix || 'id') + '-' + Date.now().toString(36) + '-' + uidCounter.toString(36);
  }

  // ---------------------------------------------------------------------
  // Toast
  // ---------------------------------------------------------------------

  /** toast(msg, type) — type: 'info'|'success'|'warning'|'error'（預設 info） */
  function toast(msg, type) {
    var container = document.getElementById('toast-container');
    if (!container) {
      console.warn('[Util.toast] 找不到 #toast-container，訊息：', msg);
      return { close: function () {} };
    }
    type = type || 'info';
    var timer = null;
    var el = h(
      'div',
      { class: 'toast toast-' + type, role: 'status' },
      h('span', { class: 'toast-msg' }, msg),
      h(
        'button',
        {
          class: 'toast-close',
          'aria-label': '關閉通知',
          onClick: function () {
            removeToast();
          }
        },
        '×'
      )
    );
    container.appendChild(el);
    timer = setTimeout(removeToast, 3200);

    function removeToast() {
      clearTimeout(timer);
      if (!el.parentNode) return;
      el.classList.add('toast-leaving');
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 200);
    }

    return { close: removeToast };
  }

  // ---------------------------------------------------------------------
  // Modal
  // ---------------------------------------------------------------------

  /**
   * modal({title, body, actions}) — body 可為字串或 Node；
   * actions: [{ label, class, onClick(close) }]。回傳 close() 函式。
   */
  function modal(opts) {
    opts = opts || {};
    var root = document.getElementById('modal-root');
    if (!root) {
      console.warn('[Util.modal] 找不到 #modal-root');
      return function () {};
    }

    var closed = false;
    var overlay = h('div', {
      class: 'modal-overlay',
      onClick: function (e) {
        if (e.target === overlay) close();
      }
    });

    var actionEls = (opts.actions || []).map(function (a) {
      return h(
        'button',
        {
          class: a.className || a.class || 'btn btn-ghost',
          onClick: function () {
            if (typeof a.onClick === 'function') a.onClick(close);
            else close();
          }
        },
        a.label
      );
    });

    var bodyEl = h('div', { class: 'modal-body' }, opts.body);

    var headerEl = opts.title
      ? h(
          'div',
          { class: 'modal-header' },
          h('h3', { class: 'modal-title' }, opts.title),
          h(
            'button',
            {
              class: 'modal-close',
              'aria-label': '關閉',
              onClick: function () {
                close();
              }
            },
            '×'
          )
        )
      : null;

    var dialog = h(
      'div',
      { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.title || '對話框' },
      headerEl,
      bodyEl,
      actionEls.length ? h('div', { class: 'modal-actions' }, actionEls) : null
    );

    overlay.appendChild(dialog);
    root.appendChild(overlay);
    document.body.classList.add('modal-open');

    function onKeydown(e) {
      if (e.key === 'Escape') close();
    }
    document.addEventListener('keydown', onKeydown);

    function close() {
      if (closed) return;
      closed = true;
      document.removeEventListener('keydown', onKeydown);
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (!root.hasChildNodes()) document.body.classList.remove('modal-open');
    }

    return close;
  }

  // ---------------------------------------------------------------------
  // Router query helper
  // ---------------------------------------------------------------------

  /**
   * qs(hash) — 解析 "#/route?a=1&b=2" 形式字串。
   * 回傳 { route: "route", params: { a: "1", b: "2" } }。
   * 未帶參數時 hash 預設取 window.location.hash。
   */
  function qs(hash) {
    hash = hash === undefined ? window.location.hash || '' : hash || '';
    if (hash.charAt(0) === '#') hash = hash.slice(1);
    if (hash.charAt(0) === '/') hash = hash.slice(1);

    var qIndex = hash.indexOf('?');
    var route = qIndex === -1 ? hash : hash.slice(0, qIndex);
    var queryStr = qIndex === -1 ? '' : hash.slice(qIndex + 1);
    var params = {};

    if (queryStr) {
      queryStr.split('&').forEach(function (pair) {
        if (!pair) return;
        var idx = pair.indexOf('=');
        var k, v;
        if (idx === -1) {
          k = pair;
          v = '';
        } else {
          k = pair.slice(0, idx);
          v = pair.slice(idx + 1);
        }
        try {
          params[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
        } catch (e) {
          params[k] = v;
        }
      });
    }

    return { route: route, params: params };
  }

  // ---------------------------------------------------------------------
  // Export
  // ---------------------------------------------------------------------

  window.Util = {
    $: $,
    $$: $$,
    h: h,
    escapeHtml: escapeHtml,
    shuffle: shuffle,
    sample: sample,
    todayISO: todayISO,
    addDays: addDays,
    diffDays: diffDays,
    fmtDate: fmtDate,
    fmtTime: fmtTime,
    clamp: clamp,
    pct: pct,
    debounce: debounce,
    uid: uid,
    toast: toast,
    modal: modal,
    qs: qs
  };
})();
