  // -----------------------------------------------------------------------

  function computeStats() {
    var map = {};
    S.items.forEach(function (it) {
      var cat = (it.entry && it.entry.category) || (it.partShort + '·other');
      map[cat] = (map[cat] || 0) + it.count;
    });
    var arr = Object.keys(map).map(function (k) { return { label: k, count: map[k] }; });
    arr.sort(function (a, b) { return b.count - a.count; });
    return arr.slice(0, 8);
  }

  function renderStats() {
    var wrap = S.statsWrapEl;
    if (!wrap) return;
    while (wrap.firstChild) wrap.removeChild(wrap.firstChild);

    var stats = computeStats();
    if (!stats.length) {
      wrap.appendChild(Util.h('p.u-text-muted', {}, '目前沒有錯題資料可統計。'));
      return;
    }
    var max = stats.reduce(function (m, s) { return Math.max(m, s.count); }, 1);
    stats.forEach(function (s) {
      wrap.appendChild(Util.h('div.u-mt-md', { style: { marginTop: '10px' } },
        Util.h('div.u-flex.u-justify-between', {},
          Util.h('span', {}, s.label),
          Util.h('span.u-text-muted', {}, s.count + ' 次')
        ),
        Util.h('div.progress-bar', { style: { marginTop: '4px' } },
          Util.h('div.progress-bar-fill', { style: { width: Util.pct(s.count, max) + '%' } })
        )
      ));
    });
  }

  /** 錯因分佈：告訴使用者「主要不是不會，而是 XXX」 */
  function renderReasonStats() {
    var wrap = S.reasonWrapEl;
    if (!wrap) return;
    while (wrap.firstChild) wrap.removeChild(wrap.firstChild);

    var defs = reasonDefs();
    if (!defs.length) {
      wrap.appendChild(Util.h('p.u-text-muted', {}, '教材資料未載入，無法顯示錯因分類。'));
      return;
    }

    var total = S.items.length;
    var counts = {};
    var untagged = 0;
    S.items.forEach(function (it) {
      if (!it.reason) { untagged += 1; return; }
      counts[it.reason] = (counts[it.reason] || 0) + 1;
    });

    if (untagged === total) {
      wrap.appendChild(Util.h('p', {},
        '這 ' + total + ' 題都還沒標記錯因。點每一列的「查看」或「重做」，在解析下方選一個錯因 — ' +
        '「單字不會」和「時間不夠」要用完全不同的方法補，分清楚才知道該練什麼。'));
      return;
    }

    var rows = defs.map(function (d) {
      return { def: d, count: counts[d.code] || 0 };
    }).filter(function (r) { return r.count > 0; })
      .sort(function (a, b) { return b.count - a.count; });

    rows.forEach(function (r, idx) {
      var share = Util.pct(r.count, total);
      wrap.appendChild(Util.h('div', { style: { marginTop: idx === 0 ? '0' : '12px' } },
        Util.h('div.u-flex.u-justify-between', {},
          Util.h('button.btn.btn-ghost.btn-sm', {
            onClick: function () {
              S.filters.reason = S.filters.reason === r.def.code ? '' : r.def.code;
              rebuildFilterBar();
              renderList();
            }
          }, r.def.icon + ' ' + r.def.label),
          Util.h('span.u-text-muted', {}, r.count + ' 題（' + share + '%）')
        ),
        Util.h('div.progress-bar', { style: { marginTop: '4px' } },
          Util.h('div.progress-bar-fill', { style: { width: share + '%' } })
        ),
        idx === 0 ? Util.h('p', { style: { fontSize: '0.85rem', marginTop: '6px' } },
          '👉 ' + r.def.advice) : null
      ));
    });

    if (untagged) {
      wrap.appendChild(Util.h('p.u-text-muted', { style: { marginTop: '12px' } },
        '還有 ' + untagged + ' 題未標記錯因。'));
    }
  }

  /** 錯因選擇列（查看 / 重做 modal 內共用） */
  function buildReasonPicker(id, onChange) {
    var defs = reasonDefs();
    if (!defs.length) return null;
    var wb = (Store.get().wrongBook) || {};
    var current = (wb[id] && wb[id].reason) || '';

    var row = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap', marginTop: '8px' } });
    defs.forEach(function (d) {
      row.appendChild(Util.h('button', {
        class: 'btn btn-sm ' + (current === d.code ? 'btn-primary' : 'btn-ghost'),
        onClick: function () {
          try {
            Store.setWrongReason(id, current === d.code ? '' : d.code);
            Util.toast(current === d.code ? '已取消錯因標記' : ('已標記：' + d.label), 'success');
          } catch (e) {
            Util.toast('標記失敗：' + e.message, 'error');
          }
          refresh();
          if (onChange) onChange();
        }
      }, d.icon + ' ' + d.label));
    });

    var currentDef = reasonDef(current);
    return Util.h('div.card', { style: { background: 'var(--color-surface-alt)' } },
      Util.h('div.card-body', {},
        Util.h('h3', {}, '第一層：這題為什麼錯？'),
        row,
        currentDef ? Util.h('p', { style: { marginTop: '10px' } }, '👉 ' + currentDef.advice) : null
      )
    );
  }

  // -----------------------------------------------------------------------
  // 標記已精通
  // -----------------------------------------------------------------------

  function toggleMastered(id, value) {
    try {
      if (value) {
        Store.markWrongMastered(id);
      } else {
        // 取消精通＝退回第 1 箱、今天就該重做，否則到期日還停在 14 天後
        Store.set(function (old) {
          var wrongBook = Object.assign({}, old.wrongBook);
          wrongBook[id] = Object.assign({}, normalizeEntry(wrongBook[id], S.today), {
            mastered: false, box: 1, due: S.today
          });
          return Object.assign({}, old, { wrongBook: wrongBook });
        });
      }
      Util.toast(value ? '已標記為精通' : '已取消精通標記，排回今日複習', 'success');
    } catch (e) {
      Util.toast('更新失敗：' + e.message, 'error');
    }
    refresh();
  }

  // -----------------------------------------------------------------------
  // 題目內容渲染（查看 / 重做 共用）
  // -----------------------------------------------------------------------

  function renderOptionList(entry, opts) {
    var letters = LETTERS.slice(0, entry.options.length);
    return Util.h('div.option-list', {}, letters.map(function (L, i) {
      var isCorrect = i === entry.answer;
      var isSelected = opts.selected === i;
      var cls = ['option-btn'];
      if (opts.revealed) {
        if (isCorrect) cls.push('is-correct');
        else if (isSelected) cls.push('is-incorrect');
      } else if (isSelected) {
        cls.push('is-selected');
      }
      return Util.h('button', {
        class: cls,
        disabled: opts.revealed || !opts.onSelect,
        onClick: (!opts.revealed && opts.onSelect) ? function () { opts.onSelect(i); } : null
      },
        Util.h('span.option-label', {}, L),
        Util.h('span.option-text', {}, entry.options[i]),
        opts.revealed && isCorrect ? Util.h('span.option-mark', {}, '✓')
          : (opts.revealed && isSelected && !isCorrect ? Util.h('span.option-mark', {}, '✗') : null)
      );
    }));
  }

  function buildTtsControls(entry) {
    var supported = !!(window.TTS && TTS.isSupported());
    if (!supported) {
      return Util.h('p.u-text-muted', {}, '⚠️ 此瀏覽器不支援語音朗讀。');
    }
    var playing = false;
    var btn = Util.h('button.btn.btn-primary.btn-sm', {
      onClick: function () {
        if (playing) return;
        playing = true;
        btn.disabled = true;
        btn.textContent = '🔊 播放中…';
        var settings = (Store.get().settings) || {};
        var rate = Util.clamp(settings.ttsRate || 1.0, 0.8, 1.2);
        var items = (entry.ttsItems || []).map(function (it) {
          return Object.assign({}, it, { rate: rate });
        });
        TTS.speakSequence(items).then(function () {
          playing = false;
          btn.disabled = false;
          btn.textContent = '▶ 播放音檔';
        });
      }
    }, '▶ 播放音檔');
    return Util.h('div.u-flex.u-items-center.u-gap-sm', {}, btn,
      Util.h('span.u-text-muted', {}, '可重複播放'));
  }

  function buildQuestionBody(entry, opts) {
    var wrap = Util.h('div.u-flex-col', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } });

    if (entry.passageText) {
      wrap.appendChild(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('h3', {}, entry.passageTitle || '短文'),
        Util.h('p', { style: { whiteSpace: 'pre-wrap' } }, entry.passageText)
      )));
    }
    if (entry.passages && entry.passages.length) {
      entry.passages.forEach(function (p) {
        wrap.appendChild(Util.h('div.card', {}, Util.h('div.card-body', {},
          Util.h('div.u-flex.u-items-center.u-gap-sm', {},
            Util.h('h3', {}, p.title || ''), Util.h('span.badge.badge-primary', {}, p.kind || '')),
          Util.h('p', { style: { whiteSpace: 'pre-wrap' } }, p.text)
        )));
      });
    }
    if (entry.sceneText) {
      wrap.appendChild(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('h3', {}, '情境描述'),
        Util.h('p', {}, entry.sceneText),
        entry.sceneEn ? Util.h('p.u-text-secondary', {}, entry.sceneEn) : null
      )));
    }
    if (entry.settingZh) {
      wrap.appendChild(Util.h('p.u-text-secondary', {}, '情境：' + entry.settingZh));
    }
    if (entry.listening) {
      wrap.appendChild(buildTtsControls(entry));
    }
    if (entry.stemNode) {
      wrap.appendChild(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('p', { style: { fontWeight: '600' } }, entry.stemNode)
      )));
    }
    wrap.appendChild(renderOptionList(entry, opts));

    if (opts.revealed) {
      wrap.appendChild(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('h3', {}, '解析'),
        Util.h('p', {}, entry.explanation_zh || '（無解析）')
      )));
      if (entry.listening && entry.transcriptLines) {
        wrap.appendChild(Util.h('div.card', {}, Util.h('div.card-body', {},
          Util.h('h3', {}, '逐字稿'),
          entry.transcriptLines.map(function (l) { return Util.h('p', {}, l); })
        )));
      }
    }
    return wrap;
  }

  // -----------------------------------------------------------------------
  // Modal：查看
  // -----------------------------------------------------------------------

  function openViewModal(id) {
    var entry = buildEntry(id);
    if (!entry) {
      Util.toast('找不到此題目的資料（可能資料檔尚未載入或已異動）', 'warning');
      return;
    }
    var wb = (Store.get().wrongBook) || {};
    var mastered = !!(wb[id] && wb[id].mastered);
    var bodyWrap = Util.h('div');

    function paint() {
      while (bodyWrap.firstChild) bodyWrap.removeChild(bodyWrap.firstChild);
      bodyWrap.appendChild(buildQuestionBody(entry, { revealed: true, selected: entry.answer, onSelect: null }));
      var picker = buildReasonPicker(id, paint);
      if (picker) bodyWrap.appendChild(picker);
    }
    paint();

    S.activeModalClose = Util.modal({
      title: entry.partLabel + ' · ' + id,
      body: bodyWrap,
      actions: [
        { label: '關閉', class: 'btn btn-ghost' },
        { label: '重做這題', class: 'btn btn-primary',
          onClick: function (close) { close(); runRedoQueue([id]); } },
        mastered
          ? { label: '取消已精通', class: 'btn btn-ghost', onClick: function (close) { toggleMastered(id, false); close(); } }
          : null
      ].filter(Boolean)
    });
  }

  // -----------------------------------------------------------------------
  // Modal：重做（單題 / 逐題佇列共用）
  // -----------------------------------------------------------------------

  function openRedoModal(id, onResolved) {
    var entry = buildEntry(id);
    if (!entry) {
      Util.toast('找不到此題目的資料，已略過：' + id, 'warning');
      onResolved(null);
      return;
    }
    var answered = false;
    var scheduled = false; // 只在第一次作答時更新 Leitner，重畫不重複計分
    var selectedIdx = null;
    var bodyWrap = Util.h('div');
    var closeModal = null;

    function currentRec() {
      var wb = (Store.get().wrongBook) || {};
      return normalizeEntry(wb[id], S.today);
    }

    function paint() {
      while (bodyWrap.firstChild) bodyWrap.removeChild(bodyWrap.firstChild);
      bodyWrap.appendChild(buildQuestionBody(entry, {
        revealed: answered,
        selected: selectedIdx,
        onSelect: answered ? null : function (i) {
          selectedIdx = i;
          answered = true;
          if (!scheduled) {
            scheduled = true;
            try {
              // 第二層：答對往上一箱、答錯退回第 1 箱，由 Store 算下次到期日
              Store.reviewWrong(id, selectedIdx === entry.answer);
            } catch (e) {
              Util.toast('更新複習排程失敗：' + e.message, 'error');
            }
          }
          paint();
        }
      }));

      if (answered) {
        var isCorrect = selectedIdx === entry.answer;
        var rec = currentRec();
        var scheduleText = rec.mastered
          ? '🎓 連續答對，已升到第 5 箱 → 標記為精通'
          : ('📅 ' + BOX_LABELS[rec.box - 1] + '，下次複習：' + rec.due);

        bodyWrap.appendChild(Util.h('div.card', { style: { marginTop: '14px' } },
          Util.h('div.card-body', {},
            Util.h('h3', {}, isCorrect ? '✅ 答對了' : '❌ 還不熟，明天再來一次'),
            Util.h('p', {}, scheduleText),
            Util.h('p.u-text-muted', { style: { fontSize: '0.85rem', marginTop: '4px' } },
              '累計重做 ' + rec.reviews + ' 次，答對 ' + rec.rights + ' 次。')
          )
        ));

        if (!isCorrect) {
          var picker = buildReasonPicker(id, paint);
          if (picker) bodyWrap.appendChild(picker);
        }

        bodyWrap.appendChild(Util.h('div.u-flex.u-items-center.u-gap-sm.u-mt-md', { style: { flexWrap: 'wrap' } },
          Util.h('button.btn.btn-primary.btn-sm', {
            onClick: function () {
              if (closeModal) closeModal();
              onResolved(isCorrect);
            }
          }, '下一題 →')
        ));
      }
    }

    paint();
    closeModal = Util.modal({ title: entry.partLabel + ' · 重做 · ' + id, body: bodyWrap, actions: [] });
    S.activeModalClose = closeModal;
  }

  function runRedoQueue(ids) {
    if (!ids.length) {
      Util.toast('目前沒有可重做的題目', 'info');
      return;
    }
    var queue = ids.slice();
    var total = queue.length;
    var correct = 0;
    var answeredCount = 0;

    function step() {
      if (queue.length === 0) {
        refresh();
        Util.toast('本輪重做完成：' + correct + ' / ' + answeredCount + ' 題答對', 'success');
        return;
      }
      var id = queue.shift();
      openRedoModal(id, function (wasCorrect) {
        if (wasCorrect !== null) {
          answeredCount += 1;
          if (wasCorrect) correct += 1;
        }
        step();
      });
    }
    step();
  }

  // -----------------------------------------------------------------------
  // 列表 / 表格
  // -----------------------------------------------------------------------

  function unmasteredIdsInScope() {
    return sortedItems(filteredItems().filter(function (it) { return !it.mastered; }))
      .map(function (it) { return it.id; });
  }

  function dueIdsInScope() {
    return sortedItems(filteredItems().filter(function (it) { return it.isDue; }))
      .map(function (it) { return it.id; });
  }

  function renderCounts() {
    if (S.countEl) {
      var total = S.items.length;
      var unmastered = S.items.filter(function (it) { return !it.mastered; }).length;
      var due = S.items.filter(function (it) { return it.isDue; }).length;
      S.countEl.textContent = '共 ' + total + ' 題錯題 · ' + unmastered + ' 題未精通 · 今天該複習 ' + due + ' 題';
    }
  }

  function buildRow(it) {
    var statusBadge = it.mastered
      ? Util.h('span.badge.badge-success', {}, '已精通')
      : (it.isDue
        ? Util.h('span.badge.badge-danger', {}, '今天該複習')
        : Util.h('span.badge.badge-warning', {}, BOX_LABELS[it.box - 1]));
    var rDef = reasonDef(it.reason);

    return Util.h('tr', {},
      Util.h('td', {}, Util.h('span.badge.badge-primary', {}, it.partShort)),
      Util.h('td', {},
        Util.h('span', {
          style: { maxWidth: '320px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'inline-block' }
        }, summaryText(it.entry, it.id))
      ),
      Util.h('td', {}, rDef
        ? Util.h('span.badge', { title: rDef.advice }, rDef.icon + ' ' + rDef.label)
        : Util.h('span.u-text-muted', {}, '未標記')),
      Util.h('td', {}, String(it.count)),
      Util.h('td', {}, it.mastered ? '—' : (it.due || '—')),
      Util.h('td', {}, statusBadge),
      Util.h('td', {},
        Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } },
          Util.h('button.btn.btn-ghost.btn-sm', { onClick: function () { openViewModal(it.id); } }, '查看'),
          Util.h('button', {
            class: 'btn btn-sm ' + (it.isDue ? 'btn-primary' : 'btn-ghost'),
            onClick: function () { runRedoQueue([it.id]); }
          }, '重做'),
          it.mastered
            ? Util.h('button.btn.btn-ghost.btn-sm', {
              onClick: function () { toggleMastered(it.id, false); }
            }, '取消已精通')
            : null
        )
      ),
      Util.h('td', {}, fmtLastAt(it.lastAt))
    );
  }

  function renderList() {
    var wrap = S.listWrapEl;
    if (!wrap) return;
    while (wrap.firstChild) wrap.removeChild(wrap.firstChild);

    var items = sortedItems(filteredItems());
    var redoIds = unmasteredIdsInScope();
    var dueIds = dueIdsInScope();

    wrap.appendChild(Util.h('div.u-flex.u-justify-between.u-items-center.u-mt-md', { style: { flexWrap: 'wrap', gap: '10px' } },
      Util.h('span.u-text-muted', {},
        '目前篩選共 ' + items.length + ' 題 · ' + dueIds.length + ' 題今天到期 · ' + redoIds.length + ' 題未精通'),
      Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } },
        Util.h('button.btn.btn-primary.btn-sm', {
          disabled: dueIds.length === 0,
          onClick: function () { runRedoQueue(dueIds); }
        }, '複習今日到期（' + dueIds.length + '）'),
        Util.h('button.btn.btn-ghost.btn-sm', {
          disabled: redoIds.length === 0,
          onClick: function () { runRedoQueue(redoIds); }
        }, '重做全部未精通')
      )
    ));

    if (!items.length) {
      wrap.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', {}, '🔍'),
        Util.h('h2', {}, '找不到符合條件的錯題'),
        Util.h('p', {}, '試試調整 Part 篩選或取消「只看未精通」。')
      ));
      return;
    }

    var table = Util.h('table.table', {},
      Util.h('thead', {}, Util.h('tr', {},
        Util.h('th', {}, '題型'), Util.h('th', {}, '題目摘要'), Util.h('th', {}, '錯因'),
        Util.h('th', {}, '錯誤次數'), Util.h('th', {}, '下次複習'), Util.h('th', {}, '狀態'),
        Util.h('th', {}, '操作'), Util.h('th', {}, '最後作答')
      )),
      Util.h('tbody', {}, items.map(buildRow))
    );
    wrap.appendChild(Util.h('div.table-wrap.u-mt-md', {}, table));
  }

  // -----------------------------------------------------------------------
  // 篩選列
  // -----------------------------------------------------------------------

  function partLabel(code) { return code === 'all' ? '全部' : code; }

  function buildPartChips() {
    var row = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } });
    PART_FILTER_CODES.forEach(function (code) {
      var count = code === 'all' ? S.items.length : S.items.filter(function (it) { return it.partShort === code; }).length;
      var isActive = S.filters.part === code;
      var btn = Util.h('button', {
        class: 'btn btn-sm ' + (isActive ? 'btn-primary' : 'btn-ghost'),
        onClick: function () {
          S.filters.part = code;
          rebuildFilterBar();
          renderList();
        }
      }, partLabel(code) + '（' + count + '）');
      row.appendChild(btn);
    });
    return row;
  }

  function buildReasonChips() {
    var defs = reasonDefs();
    if (!defs.length) return null;
    var row = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } });
    var all = [{ code: '', label: '全部', icon: '' }].concat(defs);
    all.forEach(function (d) {
      var count = d.code === ''
        ? S.items.length
        : S.items.filter(function (it) { return it.reason === d.code; }).length;
      row.appendChild(Util.h('button', {
        class: 'btn btn-sm ' + (S.filters.reason === d.code ? 'btn-primary' : 'btn-ghost'),
        onClick: function () {
          S.filters.reason = d.code;
          rebuildFilterBar();
          renderList();
        }
      }, (d.icon ? d.icon + ' ' : '') + d.label + '（' + count + '）'));
    });
    return row;
  }

  function buildFilterBar() {
    var dueCount = S.items.filter(function (it) { return it.isDue; }).length;
    var dueCheckbox = Util.h('label.checkbox-row', {},
      Util.h('input', {
        type: 'checkbox', checked: S.filters.dueOnly,
        onChange: function (e) { S.filters.dueOnly = e.target.checked; renderList(); }
      }),
      Util.h('span', {}, '只看今天該複習（' + dueCount + '）')
    );

    var unmasteredCheckbox = Util.h('label.checkbox-row', {},
      Util.h('input', {
        type: 'checkbox', checked: S.filters.unmasteredOnly,
        onChange: function (e) { S.filters.unmasteredOnly = e.target.checked; renderList(); }
      }),
      Util.h('span', {}, '只看未精通')
    );

    var sortSelect = Util.h('select.select', {
      onChange: function (e) { S.sort = e.target.value; renderList(); }
    }, SORT_OPTIONS.map(function (o) {
      return Util.h('option', { value: o.code, selected: o.code === S.sort }, o.label);
    }));

    var reasonChips = buildReasonChips();

    return Util.h('div.card', {},
      Util.h('div.card-body', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } },
        Util.h('div', {},
          Util.h('div.card-subtitle', { style: { marginTop: '0' } }, 'Part'),
          buildPartChips()
        ),
        reasonChips ? Util.h('div', {},
          Util.h('div.card-subtitle', { style: { marginTop: '0' } }, '錯因'),
          reasonChips
        ) : null,
        Util.h('div.u-flex.u-items-center.u-justify-between', { style: { flexWrap: 'wrap', gap: '10px' } },
          Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } }, dueCheckbox, unmasteredCheckbox),
          Util.h('div.field', { style: { marginBottom: '0', minWidth: '220px' } },
            Util.h('label.field-label', {}, '排序'), sortSelect
          )
        )
      )
    );
  }

  function rebuildFilterBar() {
    if (!S.filterBarSlotEl) return;
    while (S.filterBarSlotEl.firstChild) S.filterBarSlotEl.removeChild(S.filterBarSlotEl.firstChild);
    S.filterBarSlotEl.appendChild(buildFilterBar());
  }

  // -----------------------------------------------------------------------
  // render / destroy
  // -----------------------------------------------------------------------

  function render(containerEl, params) {
    container = containerEl;
    params = params || {};

    S = {
      today: Util.todayISO(),
      wrongBook: {},
      items: [],
      // params.due=1（例如從閱讀診斷室的「先清掉 N 題到期錯題」點進來）→ 預設只看今日到期
      filters: { part: 'all', unmasteredOnly: false, dueOnly: params.due === '1' || params.due === 1, reason: '' },
      sort: 'due_asc',
      countEl: null,
      statsWrapEl: null,
      reasonWrapEl: null,
      filterBarSlotEl: null,
      listWrapEl: null,
      activeModalClose: null
    };

    if (params.task) {
      try { Store.completeTask(params.task); } catch (e) { /* 忽略單一任務完成失敗，不阻斷頁面渲染 */ }
    }

    S.wrongBook = (Store.get().wrongBook) || {};
    S.items = loadItems();

    container.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, '錯題本'),
        Util.h('p.view-subtitle', { id: 'reviewCount' }, '共 0 題錯題 · 0 題未精通')
      )
    ));
    S.countEl = Util.$('#reviewCount', container);

    if (!Object.keys(S.wrongBook).length) {
      container.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', {}, '🎉'),
        Util.h('h2', {}, '目前沒有錯題'),
        Util.h('p', {}, '太棒了！去做幾題累積練習量吧。'),
        Util.h('button.btn.btn-primary', {
          onClick: function () { if (window.App && App.navigate) App.navigate('#/quiz'); }
        }, '開始做題')
      ));
      renderCounts();
      return;
    }

    // 今日到期提示：進頁面第一眼就知道該做什麼
    var dueNow = S.items.filter(function (it) { return it.isDue; });
    if (dueNow.length) {
      container.appendChild(Util.h('div.card', {},
        Util.h('div.card-title', {}, '📅 今天有 ' + dueNow.length + ' 題該複習'),
        Util.h('div.card-subtitle', {},
          '答對就往上一箱（1 → 2 → 4 → 7 → 14 天後再見），答錯退回第 1 箱明天重來。' +
          '連續答對到第 5 箱才算真的會。'),
        Util.h('div.card-actions', {},
          Util.h('button.btn.btn-primary', {
            onClick: function () {
              runRedoQueue(sortedItems(S.items.filter(function (it) { return it.isDue; }))
                .map(function (it) { return it.id; }));
            }
          }, '開始複習')
        )
      ));
    }

    var reasonCard = Util.h('div.card', {},
      Util.h('div.card-header', {},
        Util.h('div', {},
          Util.h('div.card-title', {}, '錯因分佈'),
          Util.h('div.card-subtitle', {}, '第一層檢討：先分清楚為什麼錯，才知道要補什麼')
        )
      )
    );
    S.reasonWrapEl = Util.h('div.card-body', {});
    reasonCard.appendChild(S.reasonWrapEl);
    container.appendChild(reasonCard);

    var statsCard = Util.h('div.card', {},
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, '各 Part / 類別錯誤分佈'))
    );
    S.statsWrapEl = Util.h('div.card-body', {});
    statsCard.appendChild(S.statsWrapEl);
    container.appendChild(statsCard);

    S.filterBarSlotEl = Util.h('div');
    S.filterBarSlotEl.appendChild(buildFilterBar());
    container.appendChild(S.filterBarSlotEl);

    S.listWrapEl = Util.h('div');
    container.appendChild(S.listWrapEl);

    renderStats();
    renderReasonStats();
    renderList();
    renderCounts();
  }

  function destroy() {
    if (S && S.activeModalClose) {
      try { S.activeModalClose(); } catch (e) { /* 忽略關閉失敗 */ }
    }
    if (window.TTS) TTS.stop();
    S = null;
    container = null;
  }

  window.Views = window.Views || {};
  window.Views.review = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/settings.js */
/**
 * js/views/settings.js
 * 設定頁：開始日/考試日/每日分鐘、TTS 語速與聲音、主題、資料匯出/匯入、重置、版本與資料集統計。
 * 暴露：window.Views.settings = { render(container, params), destroy() }
 * 依賴：window.Util、window.Store、window.TTS（選用）、window.TOEIC_DATA（可能缺檔）。
 */
(function () {
  'use strict';

  var APP_VERSION = '1.0.0';
  var TOTAL_DAYS = 30;
  var RATE_MIN = 0.8;
  var RATE_MAX = 1.2;
  var RATE_STEP = 0.1;
  var SAMPLE_TEXT = 'Please submit your quarterly report to the finance department by Friday afternoon.';
  var THEME_OPTIONS = [
    { value: 'light', label: '☀️ 淺色模式' },
    { value: 'dark', label: '🌙 深色模式' },
    { value: 'auto', label: '🌓 跟隨系統' }
  ];
  var THEME_ICON = { light: '☀️', dark: '🌙', auto: '🌓' };
  var THEME_LABEL = { light: '淺色模式', dark: '深色模式', auto: '跟隨系統' };

  // 本 view 目前渲染狀態（每次 render() 重新初始化）
  var container = null;
  var changeListener = null;
  var destroyed = false;
  var cachedVoices = [];

  // -----------------------------------------------------------------
  // 資料存取
  // -----------------------------------------------------------------

  function hasStore() {
    return !!(window.Store && typeof Store.get === 'function');
  }

  function getState() {
    return hasStore() ? Store.get() : null;
  }

  function td(key) {
    return (window.TOEIC_DATA && window.TOEIC_DATA[key]) || null;
  }

  function countArr(v) {
    return Array.isArray(v) ? v.length : 0;
  }

  function sumQuestions(arr) {
    if (!Array.isArray(arr)) return 0;
    return arr.reduce(function (n, item) {
      return n + (item && Array.isArray(item.questions) ? item.questions.length : 0);
    }, 0);
  }

  function countPlanTasks(plan) {
    if (!plan || !Array.isArray(plan.days)) return 0;
    var n = 0;
    plan.days.forEach(function (d) {
      n += (d.tasks || []).length;
    });
    return n;
  }

  // -----------------------------------------------------------------
  // 共用小工具
  // -----------------------------------------------------------------

  function applyThemeToDocument(theme) {
    var root = document.documentElement;
    if (theme === 'dark' || theme === 'light') {
      root.setAttribute('data-theme', theme);
    } else {
      root.removeAttribute('data-theme');
    }
    var btn = document.getElementById('themeToggle');
    if (btn) {
      btn.textContent = THEME_ICON[theme] || THEME_ICON.auto;
      btn.setAttribute('aria-label', '目前主題：' + (THEME_LABEL[theme] || THEME_LABEL.auto) + '，點擊切換');
      btn.setAttribute('title', THEME_LABEL[theme] || THEME_LABEL.auto);
    }
  }

  function copyToClipboard(text, textareaEl) {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      navigator.clipboard.writeText(text).then(function () {
        Util.toast('已複製到剪貼簿', 'success');
      }, function () {
        fallbackCopy(textareaEl);
      });
      return;
    }
    fallbackCopy(textareaEl);
  }

  function fallbackCopy(textareaEl) {
    try {
      textareaEl.focus();
      textareaEl.select();
      var ok = document.execCommand('copy');
      Util.toast(ok ? '已複製到剪貼簿' : '複製失敗，請手動選取文字複製', ok ? 'success' : 'error');
    } catch (e) {
      Util.toast('複製失敗，請手動選取文字複製', 'error');
    }
  }

  // -----------------------------------------------------------------
  // 區塊：頁首
  // -----------------------------------------------------------------

  function buildHeader() {
    var dayIdx = hasStore() && typeof Store.getDayIndex === 'function' ? Store.getDayIndex() : 0;
    var daysToExam = hasStore() && typeof Store.daysToExam === 'function' ? Store.daysToExam() : null;
    var subtitleParts = ['Day ' + (dayIdx || 0) + '/' + TOTAL_DAYS];
    if (daysToExam !== null) subtitleParts.push('距考試 ' + daysToExam + ' 天');

    return Util.h(
      'div.view-header',
      {},
      Util.h(
        'div.view-title',
        {},
        Util.h('h1', {}, '設定'),
        Util.h('p.view-subtitle', {}, subtitleParts.join(' · '))
      )
    );
  }

  // -----------------------------------------------------------------
  // 區塊：學習計畫（開始日／考試日／每日分鐘）
  // -----------------------------------------------------------------

  function confirmStartDateChange(oldDate, newDate, inputEl) {
    var closeModal = Util.modal({
      title: '確定要變更開始日期嗎？',
      body: Util.h(
        'div',
        {},
        Util.h('p', {}, '變更開始日期會重新計算「今天是第幾天」，可能影響 30 天計畫的日期對應與今日任務顯示，但不會刪除任何已完成紀錄、答題歷史或單字進度。'),
        Util.h('p.u-text-muted', {}, '開始日期：' + oldDate + ' → ' + newDate)
      ),
      actions: [
        {
          label: '取消',
          class: 'btn btn-ghost',
          onClick: function (close) {
            inputEl.value = oldDate;
            close();
          }
        },
        {
          label: '確定變更',
          class: 'btn btn-primary',
          onClick: function (close) {
            Store.update('startDate', newDate);
            close();
            Util.toast('已更新開始日期', 'success');
          }
        }
      ]
    });
    return closeModal;
  }

  function buildPlanCard(state) {
    var startDateInput = Util.h('input.input', {
      type: 'date',
      id: 'settingsStartDate',
      value: state.startDate,
      onChange: function (e) {
        var newDate = e.target.value;
        if (!newDate || newDate === state.startDate) return;
        confirmStartDateChange(state.startDate, newDate, startDateInput);
      }
    });

    var examDateInput = Util.h('input.input', {
      type: 'date',
      id: 'settingsExamDate',
      value: state.examDate,
      onChange: function (e) {
        var newDate = e.target.value;
        if (!newDate) {
          e.target.value = state.examDate;
          Util.toast('考試日期不可留空', 'warning');
          return;
        }
        Store.update('examDate', newDate);
        Util.toast('已更新考試日期', 'success');
      }
    });

    var minutesInput = Util.h('input.input', {
      type: 'number',
      id: 'settingsDailyMinutes',
      min: '15',
      step: '15',
      value: String(state.dailyMinutes),
      onChange: function (e) {
        var n = parseInt(e.target.value, 10);
        if (isNaN(n) || n < 15) {
          e.target.value = String(state.dailyMinutes);
          Util.toast('請輸入至少 15 的整數分鐘數', 'warning');
          return;
        }
        Store.update('dailyMinutes', n);
        Util.toast('已更新每日可用時數', 'success');
      }
    });

    return Util.h(
      'div.card',
      {},
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, '學習計畫')),
      Util.h(
        'div.card-body',
        {},
        Util.h(
          'div.field',
          {},
          Util.h('label.field-label', { for: 'settingsStartDate' }, '開始日期'),
          startDateInput,
          Util.h('p.field-hint', {}, '影響「今天是 Day 幾」的計算，變更前會請你確認。')
        ),
        Util.h(
          'div.field',
          {},
          Util.h('label.field-label', { for: 'settingsExamDate' }, '考試日期'),
          examDateInput,
          Util.h('p.field-hint', {}, '預設 2026-09-20，用於頁首「距考試 N 天」倒數。')
        ),
        Util.h(
          'div.field',
          {},
          Util.h('label.field-label', { for: 'settingsDailyMinutes' }, '每日可用分鐘'),
          minutesInput,
          Util.h('p.field-hint', {}, '用來評估每日任務量是否吃得消（僅供參考，不會自動調整計畫）。')
        )
      )
    );
  }

  // -----------------------------------------------------------------
  // 區塊：TTS 語音設定
  // -----------------------------------------------------------------

  function findVoiceByName(name) {
    if (!name) return null;
    for (var i = 0; i < cachedVoices.length; i++) {
      if (cachedVoices[i].name === name) return cachedVoices[i];
    }
    return null;
  }

  function populateVoiceSelect(selectEl, currentVoiceName, hintEl) {
    if (!window.TTS || typeof TTS.voices !== 'function') return;
    TTS.voices().then(function (list) {
      if (destroyed) return;
      cachedVoices = list || [];
      selectEl.innerHTML = '';
      selectEl.appendChild(Util.h('option', { value: '' }, '系統預設'));
      cachedVoices.forEach(function (v) {
        selectEl.appendChild(Util.h('option', { value: v.name }, v.name + '（' + v.lang + '）'));
      });
      selectEl.value = findVoiceByName(currentVoiceName) ? currentVoiceName : '';
      if (cachedVoices.length === 0) {
        selectEl.innerHTML = '';
        selectEl.appendChild(Util.h('option', { value: '' }, '沒有可用語音'));
        selectEl.disabled = true;
        // 沒有偵測到英文語音時，用同一段安裝提示取代原本的一般說明文字，而不是留一個空選單。
        if (hintEl) {
          hintEl.textContent = (window.TTS && TTS.NO_ENGLISH_VOICE_HINT) ||
            '未偵測到英文語音，建議在作業系統安裝英文語音。';
        }
      }
    });
  }

  function buildTtsCard(state) {
    var supported = !!(window.TTS && TTS.isSupported());
    var rate = typeof state.settings.ttsRate === 'number' ? state.settings.ttsRate : 1.0;

    var rateLabel = Util.h('span.badge.badge-primary', {}, '語速 ' + rate.toFixed(1) + 'x');
    var rateInput = Util.h('input', {
      type: 'range',
      id: 'settingsTtsRate',
      min: String(RATE_MIN),
      max: String(RATE_MAX),
      step: String(RATE_STEP),
      value: String(rate),
      style: { width: '100%' },
      onInput: function (e) {
        var v = parseFloat(e.target.value);
        rateLabel.textContent = '語速 ' + v.toFixed(1) + 'x';
      },
      onChange: function (e) {
        var v = parseFloat(e.target.value);
        if (isNaN(v)) return;
        Store.update('settings.ttsRate', v);
      }
    });

    var voiceSelect = Util.h('select.select', {
      id: 'settingsTtsVoice',
      disabled: !supported,
      onChange: function (e) {
        Store.update('settings.ttsVoice', e.target.value);
      }
    }, Util.h('option', { value: '' }, supported ? '載入中…' : '不支援語音朗讀'));

    var voiceHint = Util.h('p.field-hint', {}, '不同瀏覽器/系統提供的語音清單不同；留空表示由程式自動挑選。');

    if (supported) populateVoiceSelect(voiceSelect, state.settings.ttsVoice, voiceHint);

    var testBtn = Util.h('button.btn.btn-primary.btn-sm', {
      type: 'button',
      disabled: !supported,
      onClick: function () {
        if (!window.TTS) return;
        var voice = findVoiceByName(voiceSelect.value);
        TTS.stop();
        TTS.speak(SAMPLE_TEXT, { rate: parseFloat(rateInput.value), voice: voice || undefined });
      }
    }, '🔊 測試播放');

    var stopBtn = Util.h('button.btn.btn-ghost.btn-sm', {
      type: 'button',
      disabled: !supported,
      onClick: function () {
        if (window.TTS) TTS.stop();
      }
    }, '⏹ 停止');

    return Util.h(
      'div.card',
      {},
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, '語音朗讀（TTS）')),
      Util.h(
        'div.card-body',
        {},
        !supported ? Util.h('p.u-text-muted', {}, '此瀏覽器不支援 Web Speech API，語音相關功能將無法發聲。') : null,
        Util.h(
          'div.field',
          {},
          Util.h(
            'div.u-flex.u-items-center.u-justify-between',
            {},
            Util.h('label.field-label', { for: 'settingsTtsRate' }, '語速（0.8x–1.2x）'),
            rateLabel
          ),
          rateInput,
          Util.h('p.field-hint', {}, '拖曳調整播放速度，鬆開後自動儲存。')
        ),
        Util.h(
          'div.field',
          {},
          Util.h('label.field-label', { for: 'settingsTtsVoice' }, '語音聲音'),
          voiceSelect,
          voiceHint
        ),
        Util.h('div.card-actions', {}, testBtn, stopBtn)
      )
    );
  }

  // -----------------------------------------------------------------
  // 區塊：主題
  // -----------------------------------------------------------------

  function buildThemeCard(state) {
    var themeSelect = Util.h(
      'select.select',
      {
        id: 'settingsTheme',
        onChange: function (e) {
          var value = e.target.value;
          Store.update('settings.theme', value);
          applyThemeToDocument(value);
          Util.toast('已切換主題：' + (THEME_LABEL[value] || value), 'success');
        }
      },
      THEME_OPTIONS.map(function (opt) {
        return Util.h('option', { value: opt.value, selected: opt.value === state.settings.theme }, opt.label);
      })
    );

    return Util.h(
      'div.card',
      {},
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, '外觀')),
      Util.h(
        'div.card-body',
        {},
        Util.h(
          'div.field',
          {},
          Util.h('label.field-label', { for: 'settingsTheme' }, '主題'),
          themeSelect,
          Util.h('p.field-hint', {}, '跟隨系統會依裝置的淺色/深色設定自動切換，也可用頂欄按鈕快速切換。')
        )
      )
    );
  }

  // -----------------------------------------------------------------
  // 區塊：匯出 / 匯入
  // -----------------------------------------------------------------

  function buildExportCard() {
    var jsonStr = hasStore() ? Store.export() : '{}';

    var exportTextarea = Util.h('textarea.textarea', {
      id: 'settingsExportArea',
      rows: 8,
      readOnly: true,
      value: jsonStr,
      style: { fontFamily: 'monospace', fontSize: '0.78rem' }
    });

    var copyBtn = Util.h('button.btn.btn-primary.btn-sm', {
      type: 'button',
      onClick: function () {
        copyToClipboard(jsonStr, exportTextarea);
      }
    }, '📋 複製到剪貼簿');

    var downloadLink = Util.h('a.btn.btn-ghost.btn-sm', {
      href: 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonStr),
      download: 'toeic30-backup-' + Util.todayISO() + '.json'
    }, '⬇️ 下載 JSON 檔');

    return Util.h(
      'div.card',
      {},
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, '資料匯出')),
      Util.h(
        'div.card-body',
        {},
        Util.h('p.field-hint', {}, '複製或下載目前的學習紀錄與設定，可作為備份或轉移到其他裝置。'),
        exportTextarea,
        Util.h('div.card-actions.u-mt-md', {}, copyBtn, downloadLink)
      )
    );
  }

  function buildImportCard() {
    var importTextarea = Util.h('textarea.textarea', {
      id: 'settingsImportArea',
      rows: 8,
      placeholder: '貼上先前匯出的 JSON 內容……',
      style: { fontFamily: 'monospace', fontSize: '0.78rem' }
    });

    var importBtn = Util.h('button.btn.btn-primary.btn-sm', {
      type: 'button',
      onClick: function () {
        var text = importTextarea.value.trim();
        if (!text) {
          Util.toast('請先貼上 JSON 內容', 'warning');
          return;
        }
        try {
          Store.import(text);
          Util.toast('匯入成功，已更新所有設定與紀錄', 'success');
        } catch (e) {
          Util.toast('匯入失敗：' + e.message, 'error');
        }
      }
    }, '📥 匯入');

    return Util.h(
      'div.card',
      {},
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, '資料匯入')),
      Util.h(
        'div.card-body',
        {},
        Util.h('p.field-hint', {}, '貼上先前匯出的 JSON，會整份取代目前的紀錄與設定，請先確認來源正確。'),
        importTextarea,
        Util.h('div.card-actions.u-mt-md', {}, importBtn)
      )
    );
  }

  // -----------------------------------------------------------------
  // 區塊：重置
  // -----------------------------------------------------------------

  function openResetModal() {
    var confirmInput = Util.h('input.input', {
      type: 'text',
      placeholder: '輸入 RESET',
      'aria-label': '輸入 RESET 以確認重置',
      onInput: function (e) {
        var btn = Util.$('.js-settings-reset-confirm');
        if (btn) btn.disabled = e.target.value.trim() !== 'RESET';
      }
    });

    Util.modal({
      title: '確定要重置所有進度嗎？',
      body: Util.h(
        'div',
        {},
        Util.h('p', {}, '此動作無法復原，將清除所有作答紀錄、錯題本、單字 SRS 進度、連續天數與已完成任務，並把開始日期重設為今天。'),
        Util.h(
          'div.field',
          {},
          Util.h('label.field-label', {}, '請輸入 RESET 以確認'),
          confirmInput
        )
      ),
      actions: [
        { label: '取消', class: 'btn btn-ghost' },
        {
          label: '確定重置',
          class: 'btn btn-danger js-settings-reset-confirm',
          onClick: function (close) {
            if (confirmInput.value.trim() !== 'RESET') return;
            Store.reset();
            close();
            Util.toast('已重置所有進度', 'success');
          }
        }
      ]
    });

    var confirmBtn = Util.$('.js-settings-reset-confirm');
    if (confirmBtn) confirmBtn.disabled = true;
  }

  function buildResetCard() {
    return Util.h(
      'div.card',
      {},
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, '重置')),
      Util.h(
        'div.card-body',
        {},
        Util.h('p.field-hint', {}, '清除所有本機儲存的學習紀錄與設定，回到初始狀態。建議重置前先匯出備份。'),
        Util.h(
          'div.card-actions',
          {},
          Util.h('button.btn.btn-danger.btn-sm', {
            type: 'button',
            onClick: openResetModal
          }, '🗑 重置所有進度')
        )
      )
    );
  }

  // -----------------------------------------------------------------
  // 區塊：版本與資料集統計
  // -----------------------------------------------------------------

  function statRow(label, value) {
    return Util.h('tr', {}, Util.h('td', {}, label), Util.h('td', {}, value));
  }

  function buildStatsCard(state) {
    var plan = td('plan');
    var listening = td('listening') || {};
    var isPersistent = hasStore() && typeof Store.isPersistent === 'function' ? Store.isPersistent() : true;
    var persistLabel = isPersistent ? '瀏覽器本機' : '僅本次工作階段';

    var rows = [
      statRow('技巧 Tips', countArr(td('tips')) + ' 則'),
      statRow('30 天計畫', (plan && Array.isArray(plan.days) ? plan.days.length : 0) + ' 天／' + countPlanTasks(plan) + ' 項任務'),
      statRow('單字 Vocab', countArr(td('vocab')) + ' 個'),
      statRow('P5 文法題', countArr(td('p5')) + ' 題'),
      statRow('P6 短文填空', countArr(td('p6')) + ' 篇／' + sumQuestions(td('p6')) + ' 題'),
      statRow('P7 閱讀測驗', countArr(td('p7')) + ' 篇／' + sumQuestions(td('p7')) + ' 題'),
      statRow('聽力 P1（照片描述）', countArr(listening.p1) + ' 題'),
      statRow('聽力 P2（應答問題）', countArr(listening.p2) + ' 題'),
      statRow('聽力 P3（簡短對話）', countArr(listening.p3) + ' 組／' + sumQuestions(listening.p3) + ' 題'),
      statRow('聽力 P4（簡短獨白）', countArr(listening.p4) + ' 組／' + sumQuestions(listening.p4) + ' 題')
    ];

    return Util.h(
      'div.card',
      {},
      Util.h(
        'div.card-header',
        {},
        Util.h('div.card-title', {}, '版本與資料集統計')
      ),
      Util.h(
        'div.card-body',
        {},
        Util.h(
          'p.u-text-muted',
          {},
          'App 版本 v' + APP_VERSION + ' · 資料格式版本 v' + (state.version != null ? state.version : '?')
        ),
        Util.h('p.u-text-muted', {}, '進度儲存：' + persistLabel),
        Util.h(
          'div.table-wrap.u-mt-md',
          {},
          Util.h(
            'table.table',
            {},
            Util.h('thead', {}, Util.h('tr', {}, Util.h('th', {}, '資料集'), Util.h('th', {}, '數量'))),
            Util.h('tbody', {}, rows)
          )
        )
      )
    );
  }

  // -----------------------------------------------------------------
  // 空狀態（Store 不可用時）
  // -----------------------------------------------------------------

  function storeMissingState() {
    return Util.h(
      'div.empty-state.empty-state-error',
      {},
      Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, '⚠️'),
      Util.h('h2', {}, '設定功能暫時無法使用'),
      Util.h('p', {}, '找不到儲存模組（Store），請重新整理頁面後再試一次。')
    );
  }

  // -----------------------------------------------------------------
  // 渲染主流程
  // -----------------------------------------------------------------

  function renderAll() {
    if (!container) return;
    container.innerHTML = '';

    if (!hasStore()) {
      container.appendChild(buildHeader());
      container.appendChild(storeMissingState());
      return;
    }

    var state = getState();

    container.appendChild(buildHeader());
    container.appendChild(Util.h('div.u-mt-md', {}, buildPlanCard(state)));
    container.appendChild(Util.h('div.u-mt-md', {}, buildTtsCard(state)));
    container.appendChild(Util.h('div.u-mt-md', {}, buildThemeCard(state)));
    container.appendChild(Util.h('div.u-mt-md', {}, buildExportCard()));
    container.appendChild(Util.h('div.u-mt-md', {}, buildImportCard()));
    container.appendChild(Util.h('div.u-mt-md', {}, buildResetCard()));
    container.appendChild(Util.h('div.u-mt-md', {}, buildStatsCard(state)));
  }

  // -----------------------------------------------------------------
  // Views 契約
  // -----------------------------------------------------------------

  function render(containerEl) {
    container = containerEl;
    destroyed = false;
    cachedVoices = [];

    changeListener = function () { renderAll(); };
    window.addEventListener('toeic30:change', changeListener);

    renderAll();
  }

  function destroy() {
    destroyed = true;
    if (changeListener) {
      window.removeEventListener('toeic30:change', changeListener);
      changeListener = null;
    }
    if (window.TTS && typeof TTS.stop === 'function') TTS.stop();
    container = null;
    cachedVoices = [];
  }

  window.Views = window.Views || {};
  window.Views.settings = { render: render, destroy: destroy };
})();

</script>

<!-- app shell（最後載入） -->
<script>
/* js/app.js */
/**
 * js/app.js
 * App shell：hash router、導覽列同步、主題切換、頂欄倒數/Day 顯示。
 * 暴露：window.App = { navigate, currentRoute, registerView, start }
 * 依賴：window.Util（必要）、window.Store（選用，defensively 處理缺席情況）
 */
(function () {
  'use strict';

  var ROUTES = ['dashboard', 'plan', 'tips', 'quiz', 'reading', 'listening', 'vocab', 'mock', 'review', 'settings'];
  var DEFAULT_ROUTE = 'dashboard';
  var TOTAL_DAYS = 30;

  var ROUTE_LABELS = {
    dashboard: '儀表板',
    plan: '30 天計畫',
    tips: '技巧庫',
    quiz: '閱讀做題',
    reading: '閱讀診斷室',
    listening: '聽力練習',
    vocab: '單字卡',
    mock: '迷你模考',
    review: '錯題本',
    settings: '設定'
  };

  // 底部 tab bar 放不下的路由，收進「更多」選單
  var MORE_ROUTES = [
    { route: 'tips', label: '技巧庫', icon: '💡' },
    { route: 'vocab', label: '單字卡', icon: '📚' },
    { route: 'listening', label: '聽力練習', icon: '🎧' },
    { route: 'mock', label: '迷你模考', icon: '🎯' },
    { route: 'review', label: '錯題本', icon: '🔁' },
    { route: 'settings', label: '設定', icon: '⚙️' }
  ];

  var THEME_ORDER = ['light', 'dark', 'auto'];
  var THEME_ICON = { light: '☀️', dark: '🌙', auto: '🌓' };
  var THEME_LABEL = { light: '淺色模式', dark: '深色模式', auto: '跟隨系統' };

  var currentView = null;
  var currentRouteName = null;
  var topbarTimer = null;
  var started = false;

  // -----------------------------------------------------------------
  // 防禦式存取 Store（A3 尚未提供時也不能讓 app.js 崩潰）
  // -----------------------------------------------------------------

  function hasStore() {
    return !!(window.Store && typeof window.Store.get === 'function');
  }

  function safeGetState() {
    if (hasStore()) {
      try {
        var state = window.Store.get();
        if (state) return state;
      } catch (e) {
        console.error('[App] Store.get() 失敗', e);
      }
    }
    var today = window.Util ? window.Util.todayISO() : new Date().toISOString().slice(0, 10);
    return {
      startDate: today,
      examDate: window.Util ? window.Util.addDays(today, TOTAL_DAYS) : today,
      settings: { theme: 'auto' }
    };
  }

  function safeSetTheme(theme) {
    if (hasStore() && typeof window.Store.set === 'function') {
      try {
        window.Store.set(function (old) {
          old = old || {};
          var oldSettings = old.settings || {};
          var newSettings = Object.assign({}, oldSettings, { theme: theme });
          return Object.assign({}, old, { settings: newSettings });
        });
        return;
      } catch (e) {
        console.error('[App] Store.set() 失敗', e);
      }
    }
    console.warn('[App] Store 尚未載入，主題僅套用於畫面，不會被保存');
  }

  // -----------------------------------------------------------------
  // 主題
  // -----------------------------------------------------------------

  function applyTheme(theme) {
    var root = document.documentElement;
    if (theme === 'dark' || theme === 'light') {
      root.setAttribute('data-theme', theme);
    } else {
      root.removeAttribute('data-theme');
    }
    var btn = document.getElementById('themeToggle');
    if (btn) {
      btn.textContent = THEME_ICON[theme] || THEME_ICON.auto;
      btn.setAttribute('aria-label', '目前主題：' + (THEME_LABEL[theme] || THEME_LABEL.auto) + '，點擊切換');
      btn.setAttribute('title', THEME_LABEL[theme] || THEME_LABEL.auto);
    }
  }

  function getCurrentTheme() {
    var state = safeGetState();
    return (state && state.settings && state.settings.theme) || 'auto';
  }

  function bindThemeToggle() {
    var btn = document.getElementById('themeToggle');
    applyTheme(getCurrentTheme());
    if (!btn) return;
    btn.addEventListener('click', function () {
      var current = getCurrentTheme();
      var idx = THEME_ORDER.indexOf(current);
      var next = THEME_ORDER[(idx + 1) % THEME_ORDER.length];
      safeSetTheme(next);
      applyTheme(next);
    });
  }

  // -----------------------------------------------------------------
  // 頂欄：倒數天數 / Day X/30
  // -----------------------------------------------------------------

  function updateTopbar() {
    if (!window.Util) return;
    var state = safeGetState();
    var today = Util.todayISO();
    var examDate = (state && state.examDate) || Util.addDays(today, TOTAL_DAYS);
    var startDate = (state && state.startDate) || today;

    var daysLeft = Util.diffDays(today, examDate);
    var dayNum = Util.clamp(Util.diffDays(startDate, today) + 1, 1, TOTAL_DAYS);

    var countdownEl = document.getElementById('countdownText');
    var dayEl = document.getElementById('dayText');

    if (countdownEl) {
      if (daysLeft > 0) countdownEl.textContent = '距考試 ' + daysLeft + ' 天';
      else if (daysLeft === 0) countdownEl.textContent = '考試就是今天！';
      else countdownEl.textContent = '考試已結束';
    }
    if (dayEl) {
      dayEl.textContent = 'Day ' + dayNum + '/' + TOTAL_DAYS;
    }
  }

  // -----------------------------------------------------------------
  // 導覽列 active 狀態
  // -----------------------------------------------------------------

  function updateNavActive(name) {
    if (!window.Util) return;
    Util.$$('[data-route]').forEach(function (el) {
      var isActive = el.getAttribute('data-route') === name;
      el.classList.toggle('is-active', isActive);
      if (el.tagName === 'A') {
        if (isActive) el.setAttribute('aria-current', 'page');
        else el.removeAttribute('aria-current');
      }
    });
  }

  // -----------------------------------------------------------------
  // 側欄（手機版抽屜）與「更多」選單
  // -----------------------------------------------------------------

  function bindSidebarToggle() {
    var toggleBtn = document.getElementById('sidebarToggle');
    var sidebar = document.getElementById('sidebar');
    var backdrop = document.getElementById('sidebarBackdrop');
    if (!toggleBtn || !sidebar) return;

    function setOpen(open) {
      sidebar.classList.toggle('is-open', open);
      if (backdrop) backdrop.classList.toggle('is-open', open);
      toggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    toggleBtn.addEventListener('click', function () {
      setOpen(!sidebar.classList.contains('is-open'));
    });
    if (backdrop) {
      backdrop.addEventListener('click', function () {
        setOpen(false);
      });
    }
    sidebar.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a[data-route]')) setOpen(false);
    });
  }

  function bindMoreMenu() {
    var btn = document.getElementById('moreTabBtn');
    if (!btn || !window.Util) return;
    btn.addEventListener('click', function () {
      var closeModal = Util.modal({
        title: '更多功能',
        body: Util.h(
          'div',
          { class: 'more-menu' },
          MORE_ROUTES.map(function (r) {
            return Util.h(
              'button',
              {
                class: 'more-menu-item',
                onClick: function () {
                  navigate('#/' + r.route);
                  closeModal();
                }
              },
              Util.h('span', { class: 'more-menu-icon', 'aria-hidden': 'true' }, r.icon),
              Util.h('span', { class: 'more-menu-label' }, r.label)
            );
          })
        )
      });
    });
  }

  // -----------------------------------------------------------------
  // Route rendering
  // -----------------------------------------------------------------

  function routeLabel(name) {
    return ROUTE_LABELS[name] || name;
  }

  function renderMissingView(container, name) {
    container.appendChild(
      Util.h(
        'div',
        { class: 'empty-state' },
        Util.h('div', { class: 'empty-state-icon', 'aria-hidden': 'true' }, '🚧'),
        Util.h('h2', {}, '此頁面尚未完成'),
        Util.h('p', {}, '「' + routeLabel(name) + '」頁面正在準備中，請稍後再回來看看。'),
        Util.h(
          'button',
          {
            class: 'btn btn-primary',
            onClick: function () {
              navigate('#/dashboard');
            }
          },
          '回儀表板'
        )
      )
    );
  }

  function renderErrorView(container, name, err) {
    container.innerHTML = '';
    container.appendChild(
      Util.h(
        'div',
        { class: 'empty-state empty-state-error' },
        Util.h('div', { class: 'empty-state-icon', 'aria-hidden': 'true' }, '⚠️'),
        Util.h('h2', {}, '頁面發生錯誤'),
        Util.h('p', {}, '「' + routeLabel(name) + '」載入時發生問題，請重新整理頁面再試一次。'),
        Util.h(
          'button',
          {
            class: 'btn btn-primary',
            onClick: function () {
              window.location.reload();
            }
          },
          '重新整理'
        )
      )
    );
    console.error('[App] view render error @' + name, err);
  }

  function focusContainerNoScroll(container) {
    try {
      container.focus({ preventScroll: true });
    } catch (e) {
      container.focus();
    }
  }

  function renderRoute() {
    if (!window.Util) {
      console.error('[App] window.Util 未載入，無法啟動路由');
      return;
    }
    var parsed = Util.qs(window.location.hash);
    var name = parsed.route || DEFAULT_ROUTE;
    if (ROUTES.indexOf(name) === -1) name = DEFAULT_ROUTE;

    var container = document.getElementById('view');
    if (!container) {
      console.error('[App] 找不到 #view 容器');
      return;
    }

    if (currentView && typeof currentView.destroy === 'function') {
      try {
        currentView.destroy();
      } catch (e) {
        console.error('[App] destroy() 失敗 @' + currentRouteName, e);
      }
    }

    container.innerHTML = '';

    var view = window.Views && window.Views[name];
    if (!view || typeof view.render !== 'function') {
      renderMissingView(container, name);
      currentView = null;
      currentRouteName = name;
      updateNavActive(name);
      focusContainerNoScroll(container);
      window.scrollTo(0, 0);
      return;
    }

    try {
      view.render(container, parsed.params);
      currentView = view;
    } catch (e) {
      renderErrorView(container, name, e);
      currentView = null;
    }

    currentRouteName = name;
    updateNavActive(name);
    updateTopbar();
    focusContainerNoScroll(container);
    window.scrollTo(0, 0);
  }

  // -----------------------------------------------------------------
  // Public API
  // -----------------------------------------------------------------

  function navigate(hash) {
    if (!hash) return;
    if (hash.charAt(0) !== '#') hash = '#' + hash;
    if (window.location.hash === hash) {
      renderRoute();
    } else {
      window.location.hash = hash;
    }
  }

  function currentRoute() {
    return currentRouteName;
  }

  function registerView(name, view) {
    window.Views = window.Views || {};
    window.Views[name] = view;
  }

  function showFatalError(err) {
    console.error('[App] start() 初始化失敗', err);
    var container = document.getElementById('view');
    if (!container) return;
    // 刻意不依賴 Util（初始化失敗時 Util 也可能尚未就緒），只用原生 DOM API
    container.innerHTML = '';
    var wrap = document.createElement('div');
    wrap.className = 'empty-state empty-state-error';
    var icon = document.createElement('div');
    icon.className = 'empty-state-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '⚠️';
    var h2 = document.createElement('h2');
    h2.textContent = '應用程式初始化失敗';
    var p = document.createElement('p');
    p.textContent = '很抱歉，頁面初始化時發生問題，請重新整理頁面再試一次。';
    var btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.textContent = '重新整理';
    btn.addEventListener('click', function () {
      window.location.reload();
    });
    wrap.appendChild(icon);
    wrap.appendChild(h2);
    wrap.appendChild(p);
    wrap.appendChild(btn);
    container.appendChild(wrap);
  }

  function start() {
    if (started) return;
    started = true;

    try {
      if (!document.getElementById('view')) {
        console.error('[App] 找不到 #view 容器，App 無法啟動');
        return;
      }

      window.addEventListener('hashchange', renderRoute);
      bindThemeToggle();
      bindSidebarToggle();
      bindMoreMenu();

      if (!window.location.hash) {
        window.location.hash = '#/' + DEFAULT_ROUTE;
      }
      renderRoute();
      updateTopbar();

      if (topbarTimer) clearInterval(topbarTimer);
      topbarTimer = setInterval(updateTopbar, 60000);
    } catch (e) {
      try {
        showFatalError(e);
      } catch (e2) {
        console.error('[App] showFatalError() 亦失敗', e2);
      }
    }
  }

  window.App = {
    navigate: navigate,
    currentRoute: currentRoute,
    registerView: registerView,
    start: start
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();

</script>
</body>
</html>
