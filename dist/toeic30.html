    var state = window.Store ? Store.get() : { completedTasks: {}, startDate: Util.todayISO() };
    var todayIdx = window.Store && typeof Store.getDayIndex === 'function' ? Store.getDayIndex() : 0;
    var total = countAllTasks(plan);
    var completed = countCompletedTasks(plan, state);
    var overallPct = Util.pct(completed, total);

    container.appendChild(buildHeader(todayIdx, overallPct));
    container.appendChild(buildPhases(plan, todayIdx));
    container.appendChild(Util.h('div.u-mt-md', {}, buildDayGrid(plan, state, todayIdx)));
    container.appendChild(Util.h('div.u-mt-md', {}, buildDetail(plan, state, todayIdx)));
  }

  // -----------------------------------------------------------------
  // Views 契約
  // -----------------------------------------------------------------

  function render(containerEl, params) {
    container = containerEl;

    var todayIdx = window.Store && typeof Store.getDayIndex === 'function' ? Store.getDayIndex() : 0;
    var requestedDay = params && params.day ? parseInt(params.day, 10) : NaN;
    if (!isNaN(requestedDay) && requestedDay >= 1 && requestedDay <= TOTAL_DAYS) {
      selectedDay = requestedDay;
    } else {
      selectedDay = todayIdx >= 1 && todayIdx <= TOTAL_DAYS ? todayIdx : 1;
    }

    changeListener = function () { renderAll(); };
    window.addEventListener('toeic30:change', changeListener);

    renderAll();
  }

  function destroy() {
    if (changeListener) {
      window.removeEventListener('toeic30:change', changeListener);
      changeListener = null;
    }
    container = null;
  }

  window.Views = window.Views || {};
  window.Views.plan = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/tips.js */
/**
 * js/views/tips.js — 技巧庫（#/tips）
 * Part 篩選（含數量）、priority 篩選、關鍵字搜尋、「只看未掌握」切換；
 * 卡片顯示 title/detail/steps/pitfalls/example/sources、「已掌握」toggle（Store.tipsMastered）。
 * params.part 為預設 Part 篩選；params.count + params.task 存在時顯示本日任務進度條，
 * 累積「已掌握」或「已閱讀」達 count 條後自動 Store.completeTask(task) 並 toast。
 * 純 IIFE，暴露 window.Views.tips = { render, destroy }。
 */
(function () {
  'use strict';

  var PART_CODES = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'General', 'Vocab', 'Time', 'Plan'];
  var PRIORITY_CODES = ['high', 'medium', 'low'];
  var PRIORITY_LABEL = { high: '高', medium: '中', low: '低' };
  var PRIORITY_BADGE = { high: 'badge-danger', medium: 'badge-warning', low: 'badge' };

  // 單一 module-level 執行狀態，每次 render() 重新初始化
  var S = null;

  function partLabel(code) {
    return code === 'all' ? '全部' : code;
  }

  function priorityLabel(code) {
    return code === 'all' ? '全部' : (PRIORITY_LABEL[code] || code);
  }

  function sourceHost(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, '');
    } catch (e) {
      return String(url || '');
    }
  }

  function matchesKeyword(tip, kwLower) {
    if (!kwLower) return true;
    var hay = [tip.title_zh || '', tip.title_en || '', tip.detail_zh || '']
      .concat(tip.steps || [])
      .join('  ')
      .toLowerCase();
    return hay.indexOf(kwLower) !== -1;
  }

  function filterTips() {
    var f = S.filters;
    var kwLower = f.keyword.trim().toLowerCase();
    return S.allTips.filter(function (t) {
      if (f.part !== 'all' && t.part !== f.part) return false;
      if (f.priority !== 'all' && t.priority !== f.priority) return false;
      if (f.unmasteredOnly && S.masteredMap[t.id]) return false;
      if (!matchesKeyword(t, kwLower)) return false;
      return true;
    });
  }

  // -----------------------------------------------------------------------
  // 任務進度（params.count + params.task）
  // -----------------------------------------------------------------------

  function taskScopeTips() {
    if (!S.taskPart) return S.allTips;
    return S.allTips.filter(function (t) { return t.part === S.taskPart; });
  }

  function taskDoneCount() {
    var scope = taskScopeTips();
    var n = 0;
    scope.forEach(function (t) {
      if (S.masteredMap[t.id] || S.sessionReadIds[t.id]) n += 1;
    });
    return n;
  }

  function refreshProgress() {
    if (!S.taskCount) return;
    var done = Math.min(taskDoneCount(), S.taskCount);
    var pct = Util.pct(done, S.taskCount);
    S.progressFillEl.style.width = pct + '%';
    S.progressFillEl.classList.toggle('is-success', done >= S.taskCount);
    S.progressTextEl.textContent = done + ' / ' + S.taskCount + (done >= S.taskCount ? '（已完成！）' : '');

    if (done >= S.taskCount && !Store.isTaskDone(S.taskId)) {
      Store.completeTask(S.taskId);
      Util.toast('已完成本日任務：閱讀 ' + S.taskCount + ' 條技巧', 'success');
    }
  }

  // -----------------------------------------------------------------------
  // 卡片
  // -----------------------------------------------------------------------

  function toggleMastered(tip) {
    var next = !S.masteredMap[tip.id];
    var newState = Store.update(['tipsMastered', tip.id], next);
    S.masteredMap = newState.tipsMastered;
    if (next) delete S.sessionReadIds[tip.id]; // 已掌握本身即涵蓋已讀
    renderList();
    refreshProgress();
  }

  function toggleRead(tip, checked) {
    if (checked) S.sessionReadIds[tip.id] = true;
    else delete S.sessionReadIds[tip.id];
    refreshProgress();
    // 只需更新這張卡片本身的視覺狀態，不必整份重建列表
  }

  function buildStepsList(steps) {
    if (!steps || !steps.length) return null;
    return Util.h('div.u-mt-md', {},
      Util.h('div', { class: 'card-subtitle' }, '步驟'),
      Util.h('ol', { style: { margin: '6px 0 0', paddingLeft: '20px', color: 'var(--color-text-secondary)' } },
        steps.map(function (s) { return Util.h('li', {}, s); })
      )
    );
  }

  function buildPitfalls(pitfalls) {
    if (!pitfalls || !pitfalls.length) return null;
    return Util.h('div.u-mt-md', {
      style: {
        background: 'var(--color-warning-soft)',
        borderLeft: '3px solid var(--color-warning)',
        borderRadius: 'var(--radius-sm)',
        padding: '10px 14px'
      }
    },
      Util.h('div', { style: { fontWeight: '700', color: 'var(--color-warning)' } }, '⚠ 常見陷阱'),
      Util.h('ul', { style: { margin: '6px 0 0', paddingLeft: '20px', color: 'var(--color-text-secondary)' } },
        pitfalls.map(function (p) { return Util.h('li', {}, p); })
      )
    );
  }

  function buildExample(example) {
    if (!example) return null;
    return Util.h('div.u-mt-md', {},
      Util.h('div', { class: 'card-subtitle' }, '例句'),
      Util.h('div', {
        style: {
          marginTop: '4px',
          fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
          background: 'var(--color-surface-alt)',
          border: '1px solid var(--color-border)',
          borderRadius: 'var(--radius-sm)',
          padding: '10px 14px',
          color: 'var(--color-text)'
        }
      }, example)
    );
  }

  function buildSources(sources) {
    if (!sources || !sources.length) return null;
    return Util.h('div.u-mt-md', {},
      Util.h('div', { class: 'card-subtitle' }, '參考來源'),
      Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap', marginTop: '4px' } },
        sources.map(function (url) {
          return Util.h('a', {
            href: url,
            target: '_blank',
            rel: 'noopener',
            class: 'badge badge-primary',
            style: { textDecoration: 'none' }
          }, '🔗 ' + sourceHost(url));
        })
      )
    );
  }

  function renderTipCard(tip) {
    var isMastered = !!S.masteredMap[tip.id];
    var isRead = !!S.sessionReadIds[tip.id];
    var priorityBadgeClass = PRIORITY_BADGE[tip.priority] || 'badge';

    var badges = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap', flexShrink: '0' } },
      Util.h('span', { class: 'badge badge-primary' }, tip.part),
      Util.h('span', { class: 'badge ' + priorityBadgeClass }, priorityLabel(tip.priority) + '優先'),
      isMastered
        ? Util.h('span', { class: 'badge badge-success' }, '已掌握')
        : Util.h('span', { class: 'badge badge-warning' }, '未掌握')
    );

    var readRow = null;
    if (S.taskCount) {
      readRow = Util.h('label', { class: 'checkbox-row' },
        Util.h('input', {
          type: 'checkbox',
          checked: isMastered || isRead,
          disabled: isMastered,
          onChange: function (e) { toggleRead(tip, e.target.checked); }
        }),
        Util.h('span', {}, '已閱讀（計入今日任務）')
      );
    }

    return Util.h('div.card', {},
      Util.h('div.card-header', {},
        Util.h('div', {},
          Util.h('div.card-title', {}, tip.title_zh || tip.id),
          Util.h('div.card-subtitle', {}, tip.title_en || '')
        ),
        badges
      ),
      Util.h('div.card-body', {},
        Util.h('p', {}, tip.detail_zh || ''),
        buildStepsList(tip.steps),
        buildPitfalls(tip.pitfalls),
        buildExample(tip.example),
        buildSources(tip.sources),
        readRow
      ),
      Util.h('div.card-actions', {},
        Util.h('button', {
          class: 'btn btn-sm ' + (isMastered ? 'btn-ghost' : 'btn-primary'),
          onClick: function () { toggleMastered(tip); }
        }, isMastered ? '取消已掌握' : '標記已掌握')
      )
    );
  }

  function renderList() {
    var listWrap = S.listWrapEl;
    while (listWrap.firstChild) listWrap.removeChild(listWrap.firstChild);

    var tips = filterTips();
    if (!tips.length) {
      listWrap.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', {}, '🔍'),
        Util.h('h2', {}, '找不到符合條件的技巧'),
        Util.h('p', {}, '試試調整 Part、優先度或關鍵字篩選條件。')
      ));
      return;
    }
    tips.forEach(function (tip) {
      listWrap.appendChild(renderTipCard(tip));
    });
  }

  // -----------------------------------------------------------------------
  // 篩選列
  // -----------------------------------------------------------------------

  function setActiveChip(chipList, activeCode) {
    chipList.forEach(function (item) {
      var active = item.code === activeCode;
      item.el.classList.toggle('btn-primary', active);
      item.el.classList.toggle('btn-ghost', !active);
    });
  }

  function buildPartChips() {
    var codes = ['all'].concat(PART_CODES);
    var chips = [];
    var row = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } });
    codes.forEach(function (code) {
      var count = code === 'all' ? S.allTips.length : S.allTips.filter(function (t) { return t.part === code; }).length;
      var isActive = S.filters.part === code;
      var btn = Util.h('button', {
        class: 'btn btn-sm ' + (isActive ? 'btn-primary' : 'btn-ghost'),
        onClick: function () {
          S.filters.part = code;
          setActiveChip(S.partChips, code);
          renderList();
        }
      }, partLabel(code) + '（' + count + '）');
      chips.push({ code: code, el: btn });
      row.appendChild(btn);
    });
    S.partChips = chips;
    return row;
  }

  function buildPriorityChips() {
    var codes = ['all'].concat(PRIORITY_CODES);
    var chips = [];
    var row = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } });
    codes.forEach(function (code) {
      var isActive = S.filters.priority === code;
      var btn = Util.h('button', {
        class: 'btn btn-sm ' + (isActive ? 'btn-primary' : 'btn-ghost'),
        onClick: function () {
          S.filters.priority = code;
          setActiveChip(S.priorityChips, code);
          renderList();
        }
      }, priorityLabel(code));
      chips.push({ code: code, el: btn });
      row.appendChild(btn);
    });
    S.priorityChips = chips;
    return row;
  }

  function buildFilterBar() {
    var searchInput = Util.h('input', {
      class: 'input',
      type: 'search',
      placeholder: '搜尋標題、內容或步驟關鍵字…',
      value: S.filters.keyword,
      onInput: function (e) {
        var val = e.target.value;
        clearTimeout(S.searchTimer);
        S.searchTimer = setTimeout(function () {
          S.filters.keyword = val;
          renderList();
        }, 250);
      }
    });

    var unmasteredCheckbox = Util.h('label', { class: 'checkbox-row' },
      Util.h('input', {
        type: 'checkbox',
        checked: S.filters.unmasteredOnly,
        onChange: function (e) {
          S.filters.unmasteredOnly = e.target.checked;
          renderList();
        }
      }),
      Util.h('span', {}, '只看未掌握')
    );

    return Util.h('div.card', {},
      Util.h('div.card-body', { style: { display: 'flex', flexDirection: 'column', gap: '14px' } },
        Util.h('div', {},
          Util.h('div', { class: 'card-subtitle u-mt-md', style: { marginTop: '0' } }, 'Part'),
          buildPartChips()
        ),
        Util.h('div', {},
          Util.h('div', { class: 'card-subtitle' }, '優先度'),
          buildPriorityChips()
        ),
        Util.h('div.field', { style: { marginBottom: '0' } },
          Util.h('label', { class: 'field-label' }, '關鍵字搜尋'),
          searchInput
        ),
        unmasteredCheckbox
      )
    );
  }

  function buildTaskProgress() {
    if (!S.taskCount) return null;

    S.progressFillEl = Util.h('div.progress-bar-fill', { style: { width: '0%' } });
    S.progressTextEl = Util.h('div.u-text-secondary.u-text-center.u-mt-md', {}, '0 / ' + S.taskCount);

    var card = Util.h('div.card', {},
      Util.h('div.card-header', {},
        Util.h('div', {},
          Util.h('div.card-title', {}, '本日任務：閱讀 ' + S.taskCount + ' 條'),
          Util.h('div.card-subtitle', {}, S.taskPart ? ('範圍：Part ' + S.taskPart) : '範圍：全部技巧')
        )
      ),
      Util.h('div.card-body', {},
        Util.h('div.progress-bar', {}, S.progressFillEl),
        S.progressTextEl
      )
    );
    return card;
  }

  // -----------------------------------------------------------------------
  // render / destroy
  // -----------------------------------------------------------------------

  function render(container, params) {
    params = params || {};
    var data = (window.TOEIC_DATA && window.TOEIC_DATA.tips) || [];

    S = {
      allTips: data,
      masteredMap: (Store.get().tipsMastered) || {},
      sessionReadIds: {},
      filters: {
        part: params.part && PART_CODES.indexOf(params.part) !== -1 ? params.part : 'all',
        priority: 'all',
        keyword: '',
        unmasteredOnly: false
      },
      taskPart: params.part || '',
      taskCount: parseInt(params.count, 10) || 0,
      taskId: params.task || '',
      searchTimer: null,
      listWrapEl: null,
      progressFillEl: null,
      progressTextEl: null,
      partChips: [],
      priorityChips: []
    };
    if (!S.taskId) S.taskCount = 0; // task/count 必須成對出現才啟用進度追蹤

    container.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, '技巧庫'),
        Util.h('p.view-subtitle', {}, '依 Part、優先度篩選作答與聽力技巧，讀完就標記已掌握。')
      )
    ));

    if (!S.allTips.length) {
      container.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', {}, '📭'),
        Util.h('h2', {}, '尚無技巧資料'),
        Util.h('p', {}, '技巧資料尚未載入，請確認 data/tips.js 已正確引入。')
      ));
      return;
    }

    var progressCard = buildTaskProgress();
    if (progressCard) container.appendChild(progressCard);

    container.appendChild(buildFilterBar());

    S.listWrapEl = Util.h('div.u-flex-col', { style: { gap: '0' } });
    container.appendChild(S.listWrapEl);

    renderList();
    refreshProgress();
  }

  function destroy() {
    if (S && S.searchTimer) clearTimeout(S.searchTimer);
    S = null;
  }

  window.Views = window.Views || {};
  window.Views.tips = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/quiz.js */
/**
 * js/views/quiz.js
 * 閱讀測驗引擎（Part 5 / 6 / 7）。
 * 流程：設定面板 → 作答（逐題即時解析 / 交卷後解析，可選計時）→ 交卷 → 結果頁。
 * 支援 params.skill 做「考點專項練習」（P5 依 tag、P6 依 type、P7 依 skill 篩題）。
 * 每題記錄作答秒數，交卷時連同考點寫回 Store.recordQuiz({ skillStats })，
 * 供 #/reading 閱讀診斷室算各考點正確率與配速。
 * 暴露：window.Views.quiz = { render, destroy }
 */
(function () {
  'use strict';

  var PART_LABELS = { P5: 'Part 5 單句填空', P6: 'Part 6 段落填空', P7: 'Part 7 閱讀理解' };
  var WRONG_RATIO = 0.3;
  var OPTION_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  // 目標配速以 window.Reading 為單一來源；Reading 缺席時退回同樣的預設值
  var FALLBACK_PACE = { P5: 20, P6: 30, P7: 60 };

  function paceTarget(part) {
    var table = (window.Reading && window.Reading.PACE_TARGET) || FALLBACK_PACE;
    return table[part] || FALLBACK_PACE[part] || 30;
  }

  function skillKeyOf(part, q) {
    if (window.Reading && typeof window.Reading.skillKey === 'function') {
      return window.Reading.skillKey(part, q);
    }
    if (part === 'P5') return 'P5:' + ((q && q.tag) || 'other');
    if (part === 'P6') return 'P6:' + ((q && q.type) || 'word');
    return 'P7:' + ((q && q.skill) || 'detail');
  }

  function skillLabelOf(key) {
    if (window.Reading && typeof window.Reading.labelFor === 'function') {
      return window.Reading.labelFor(key);
    }
    return key;
  }

  /** 該 Part 的考點欄位值（P5:tag / P6:type / P7:skill） */
  function skillTagOf(part, q) {
    if (part === 'P5') return (q && q.tag) || 'other';
    if (part === 'P6') return (q && q.type) || 'word';
    return (q && q.skill) || 'detail';
  }

  var KIND_LABELS = {
    email: '電子郵件', notice: '公告', article: '文章', ad: '廣告', form: '表單',
    chat: '對話串', memo: '備忘錄', schedule: '時程表', invoice: '發票', letter: '信件'
  };
  var SKILL_LABELS = {
    main_idea: '主旨', detail: '細節', inference: '推論', NOT: 'NOT 題',
    vocab_in_context: '字義', sentence_insert: '句子插入', cross_ref: '交叉對照'
  };

  // ---- module state（每次 render 重新建立）----
  var hostContainer = null;
  var session = null;
  var timerId = null;

  // ---------------------------------------------------------------------
  // 小工具
  // ---------------------------------------------------------------------

  function clearNode(el) {
    while (el && el.firstChild) el.removeChild(el.firstChild);
  }

  function truncate(str, n) {
    str = str || '';
    return str.length > n ? str.slice(0, n) + '…' : str;
  }

  function getPool(part) {
    var data = window.TOEIC_DATA;
    if (!data) return [];
    if (part === 'P5') return Array.isArray(data.p5) ? data.p5 : [];
    if (part === 'P6') return Array.isArray(data.p6) ? data.p6 : [];
    if (part === 'P7') return Array.isArray(data.p7) ? data.p7 : [];
    return [];
  }

  function normalizePart(raw) {
    if (!raw) return null;
    var p = String(raw).toUpperCase();
    return (p === 'P5' || p === 'P6' || p === 'P7') ? p : null;
  }

  function normalizeCount(raw) {
    if (raw === undefined || raw === null || raw === '') return null;
    if (String(raw).toLowerCase() === 'all') return 'all';
    var n = parseInt(raw, 10);
    if (!isFinite(n) || isNaN(n) || n <= 0) return null;
    return n;
  }

  function groupQuestionCount(part, g) {
    if (part === 'P5') return 1;
    return (g.questions || []).length || 1;
  }

  /**
   * 子題 key。務必與 mock.js / listening.js / review.js 一致用 `<groupId>-q<n>`，
   * 否則寫進 wrongBook 的錯題在錯題本會查不到題目。
   */
  function subKeyFor(part, g, q, idx) {
    if (part === 'P5') return g.id;
    return g.id + '-q' + (part === 'P6' ? q.n : (idx + 1));
  }

  function wrongKeysForGroup(part, g) {
    if (part === 'P5') return [g.id];
    return (g.questions || []).map(function (q, i) { return subKeyFor(part, g, q, i); });
  }

  /** 這一組（P5 單題 / P6·P7 整篇）有沒有命中指定考點 */
  function groupHasSkill(part, g, skill) {
    if (!skill) return true;
    if (part === 'P5') return skillTagOf('P5', g) === skill;
    return (g.questions || []).some(function (q) { return skillTagOf(part, q) === skill; });
  }

  /** 該 Part 題庫中出現過的考點清單（含題數），供設定面板顯示 */
  function skillOptionsFor(part, pool) {
    var counts = {};
    (pool || []).forEach(function (g) {
      if (part === 'P5') {
        var t = skillTagOf('P5', g);
        counts[t] = (counts[t] || 0) + 1;
        return;
      }
      (g.questions || []).forEach(function (q) {
        var tag = skillTagOf(part, q);
        counts[tag] = (counts[tag] || 0) + 1;
      });
    });
    return Object.keys(counts)
      .map(function (tag) {
        return { value: tag, count: counts[tag], label: skillLabelOf(part + ':' + tag) + '（' + counts[tag] + '）' };
      })
      .sort(function (a, b) { return b.count - a.count; });
  }

  /**
   * 優先抽 wrongBook 中未 mastered 者佔 30%（若有），其餘隨機不重複。
   * skill 有值時先把題庫縮到該考點（P6/P7 以「整篇含該考點」為單位）。
   */
  function sampleGroups(part, rawPool, countTarget, wrongBook, skill) {
    wrongBook = wrongBook || {};
    var pool = (rawPool || []).filter(function (g) { return groupHasSkill(part, g, skill); });
    if (!pool.length) return [];
    if (countTarget === 'all') return Util.shuffle(pool);

    var target = Util.clamp(countTarget, 1, 99999);
    var wrongCandidates = pool.filter(function (g) {
      return wrongKeysForGroup(part, g).some(function (k) {
        var w = wrongBook[k];
        return !!w && !w.mastered;
      });
    });
    var wrongGoal = Math.floor(target * WRONG_RATIO);

    var selected = [];
    var qCount = 0;
    Util.shuffle(wrongCandidates).forEach(function (g) {
      if (qCount >= wrongGoal) return;
      selected.push(g);
      qCount += groupQuestionCount(part, g);
    });

    var selectedIds = {};
    selected.forEach(function (g) { selectedIds[g.id] = true; });
    var remaining = Util.shuffle(pool.filter(function (g) { return !selectedIds[g.id]; }));

    var i = 0;
    while (qCount < target && i < remaining.length) {
      selected.push(remaining[i]);
      qCount += groupQuestionCount(part, remaining[i]);
      i += 1;
    }
    return Util.shuffle(selected);
  }

  function countTotalQuestions(groups, part) {
    var total = 0;
    groups.forEach(function (g) { total += groupQuestionCount(part, g); });
    return total;
  }

  function cleanupTimer() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function updateSession(patch) {
    session = Object.assign({}, session, patch);
  }

  /** 以 Date.now() 差值計算實際經過秒數，避免背景分頁節流 setInterval 導致計時失準。 */
  function computeElapsedSeconds() {
    if (!session || !session.startedAt) return 0;
    return Math.max(0, Math.floor((Date.now() - session.startedAt) / 1000));
  }

  // ---------------------------------------------------------------------
  // 入口
  // ---------------------------------------------------------------------

  function render(container, params) {
    clearNode(container);
    cleanupTimer();
    hostContainer = container;
    session = null;
    params = params || {};

    var pools = { P5: getPool('P5'), P6: getPool('P6'), P7: getPool('P7') };

    if (!pools.P5.length && !pools.P6.length && !pools.P7.length) {
      renderEmptyNoData();
      return;
    }

    var directPart = normalizePart(params.part);
    if (directPart && pools[directPart].length) {
      startSession({
        part: directPart,
        count: normalizeCount(params.count) || 10,
        mode: 'immediate',
        timerOn: true,
        skill: params.skill || null,
        task: params.task || null
      });
      return;
    }

    renderSetup(pools, params);
  }

  function destroy() {
    cleanupTimer();
    session = null;
    hostContainer = null;
  }

  function renderEmptyNoData() {
    hostContainer.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {}, Util.h('h1', {}, '閱讀做題'))
    ));
    hostContainer.appendChild(Util.h('div.empty-state', {},
      Util.h('div.empty-state-icon', {}, '📭'),
      Util.h('h2', {}, '目前沒有題庫資料'),
      Util.h('p', {}, '請確認 Part 5／6／7 的題庫資料檔已正確載入。')
    ));
  }

  function renderEmptyForPart(part, skill) {
    hostContainer.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {}, Util.h('h1', {}, PART_LABELS[part] || '閱讀做題'))
    ));
    hostContainer.appendChild(Util.h('div.empty-state', {},
      Util.h('div.empty-state-icon', {}, '📭'),
      Util.h('h2', {}, skill ? '這個考點目前沒有題目' : '這個 Part 目前沒有題目'),
      Util.h('p', {}, skill
        ? ('「' + skillLabelOf(part + ':' + skill) + '」在此 Part 的題庫中沒有題目，換個考點試試。')
        : '題庫資料尚未準備好，請稍後再試或選擇其他 Part。'),
      Util.h('button.btn.btn-primary', {
        type: 'button',
        onClick: function () { render(hostContainer, {}); }
      }, '回設定頁')
    ));
  }

  // ---------------------------------------------------------------------
  // 設定面板
  // ---------------------------------------------------------------------

  function toggleGroup(options, current, onSelect) {
    return Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } },
      options.map(function (opt) {
        var active = opt.value === current;
        return Util.h('button', {
          type: 'button',
          class: 'btn btn-sm ' + (active ? 'btn-primary' : 'btn-ghost'),
          disabled: !!opt.disabled,
          onClick: function () { onSelect(opt.value); }
        }, opt.label);
      })
    );
  }

  function renderSetup(pools, params) {
    var draft = {
      part: normalizePart(params.part) ||
        (pools.P5.length ? 'P5' : (pools.P6.length ? 'P6' : (pools.P7.length ? 'P7' : 'P5'))),
      count: normalizeCount(params.count) || 10,
      mode: 'immediate',
      timerOn: true,
      skill: params.skill || ''
    };
    var taskId = params.task || null;

    hostContainer.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, '閱讀做題'),
        Util.h('p.view-subtitle', {}, '選擇 Part、考點、題數與作答模式後開始練習。做完會依考點更新閱讀診斷。')
      ),
      Util.h('button.btn.btn-ghost.btn-sm', {
        type: 'button',
        onClick: function () { if (window.App) window.App.navigate('#/reading'); }
      }, '📈 看閱讀診斷')
    ));

    var bodyHost = Util.h('div');
    hostContainer.appendChild(bodyHost);

    function repaint() {
      clearNode(bodyHost);
      bodyHost.appendChild(buildCard());
    }

    function buildCard() {
      var partOptions = [
        { value: 'P5', label: 'Part 5 單句', disabled: !pools.P5.length },
        { value: 'P6', label: 'Part 6 段落', disabled: !pools.P6.length },
        { value: 'P7', label: 'Part 7 文章', disabled: !pools.P7.length }
      ];
      var countOptions = [
        { value: 5, label: '5 題' }, { value: 10, label: '10 題' },
        { value: 20, label: '20 題' }, { value: 'all', label: '全部' }
      ];
      var modeOptions = [
        { value: 'immediate', label: '逐題即時解析' }, { value: 'end', label: '交卷後解析' }
      ];
      var currentPool = pools[draft.part] || [];
      var skillOpts = skillOptionsFor(draft.part, currentPool);
      // 換 Part 後舊考點可能不存在 → 自動退回「全部考點」
      if (draft.skill && !skillOpts.some(function (o) { return o.value === draft.skill; })) {
        draft.skill = '';
      }
      var skillToggle = [{ value: '', label: '全部考點' }].concat(skillOpts);
      var matchedGroups = currentPool.filter(function (g) {
        return groupHasSkill(draft.part, g, draft.skill);
      }).length;

      return Util.h('div.card', {},
        Util.h('div.card-body', {},
          Util.h('div.field', {},
            Util.h('label.field-label', {}, '選擇 Part'),
            toggleGroup(partOptions, draft.part, function (v) { draft.part = v; repaint(); })
          ),
          Util.h('div.field', {},
            Util.h('label.field-label', {}, '考點（專項練習）'),
            toggleGroup(skillToggle, draft.skill, function (v) { draft.skill = v; repaint(); }),
            Util.h('p.field-hint', {}, draft.skill
              ? (draft.part === 'P5'
                ? ('只抽「' + skillLabelOf(draft.part + ':' + draft.skill) + '」考點，共 ' + matchedGroups + ' 題。')
                : ('只抽含「' + skillLabelOf(draft.part + ':' + draft.skill) + '」的文章共 ' + matchedGroups +
                  ' 篇；同篇其他題型也會一起作答。'))
              : '選一個考點就會只抽該類型的題目，適合針對弱點做專項特訓。')
          ),
          Util.h('div.field', {},
            Util.h('label.field-label', {}, '題數'),
            toggleGroup(countOptions, draft.count, function (v) { draft.count = v; repaint(); }),
            Util.h('p.field-hint', {},
              currentPool.length
                ? ('題庫共 ' + currentPool.length + (draft.part === 'P5'
                  ? ' 題。'
                  : ' 篇文章；Part 6/7 以整篇文章為單位抽取，題數為概略目標。'))
                : '此 Part 目前沒有題目資料。')
          ),
          Util.h('div.field', {},
            Util.h('label.field-label', {}, '解析模式'),
            toggleGroup(modeOptions, draft.mode, function (v) { draft.mode = v; repaint(); })
          ),
          Util.h('label.checkbox-row', {},
            Util.h('input', {
              type: 'checkbox',
              checked: draft.timerOn,
              onChange: function (e) { draft.timerOn = e.target.checked; }
            }),
            Util.h('span', {}, '開啟計時（目標 ' + paceTarget(draft.part) + ' 秒／題，與正式考配速一致）')
          )
        ),
        Util.h('div.card-actions', {},
          Util.h('button.btn.btn-primary.btn-block', {
            type: 'button',
            disabled: !currentPool.length || !matchedGroups,
            onClick: function () {
              startSession({
                part: draft.part, count: draft.count, mode: draft.mode,
                timerOn: draft.timerOn, skill: draft.skill || null, task: taskId
              });
            }
          }, '開始測驗')
        )
      );
    }

    repaint();
  }

  // ---------------------------------------------------------------------
  // 作答流程
  // ---------------------------------------------------------------------

  function startSession(cfg) {
    cleanupTimer();
    var pool = getPool(cfg.part);
    var state = Store.get();
    var groups = sampleGroups(cfg.part, pool, cfg.count, state.wrongBook, cfg.skill);

    clearNode(hostContainer);
    if (!groups.length) {
      renderEmptyForPart(cfg.part, cfg.skill);
      return;
    }

    var now = Date.now();
    session = {
      part: cfg.part,
      mode: cfg.mode,
      timerOn: !!cfg.timerOn,
      skill: cfg.skill || null,
      task: cfg.task || null,
      requestedCount: cfg.count,
      groups: groups,
      currentIndex: 0,
      answers: {},
      revealed: {},
      qSeconds: {},      // key → 該題花掉的秒數（第一次作答時定版）
      lastAnswerAt: now, // 上一次作答的時間戳，用來切分每題耗時
      activeMarker: null,
      elapsedSeconds: 0,
      startedAt: now,
      phase: 'running',
      result: null
    };

    if (session.timerOn) {
      timerId = setInterval(function () {
        updateSession({ elapsedSeconds: computeElapsedSeconds() });
        var el = Util.$('#quizTimer', hostContainer);
        if (el) el.textContent = Util.fmtTime(session.elapsedSeconds);
      }, 1000);
    }

    paintRunning();
  }

  function paintRunning() {
    clearNode(hostContainer);
    hostContainer.appendChild(buildRunHeader());
    hostContainer.appendChild(buildProgressBar());
    hostContainer.appendChild(buildGroupBody(session.groups[session.currentIndex]));
    hostContainer.appendChild(buildRunFooter());
  }

  function buildRunHeader() {
    var total = session.groups.length;
    return Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, PART_LABELS[session.part] + ' 測驗'),
        Util.h('p.view-subtitle', {},
          '第 ' + (session.currentIndex + 1) + ' / ' + total + ' 組 · 目標每題 ' +
          paceTarget(session.part) + ' 秒 · ' +
          (session.mode === 'immediate' ? '逐題即時解析' : '交卷後解析') +
          (session.skill ? ' · 專項：' + skillLabelOf(session.part + ':' + session.skill) : ''))
      ),
      session.timerOn ? Util.h('span.pill', { id: 'quizTimer' }, Util.fmtTime(session.elapsedSeconds)) : null
    );
  }

  function buildProgressBar() {
    var total = session.groups.length;
    var ratio = total ? (session.currentIndex + 1) / total : 0;
    return Util.h('div.progress-bar', { style: { marginBottom: '16px' } },
      Util.h('div.progress-bar-fill', { style: { width: Math.round(ratio * 100) + '%' } })
    );
  }

  function buildGroupBody(group) {
    if (session.part === 'P5') return buildP5Body(group);
    if (session.part === 'P6') return buildP6Body(group);
    return buildP7Body(group);
  }

  function buildRunFooter() {
    var atFirst = session.currentIndex === 0;
    var atLast = session.currentIndex >= session.groups.length - 1;
    return Util.h('div.u-flex.u-justify-between.u-items-center.u-mt-md', { style: { flexWrap: 'wrap', gap: '10px' } },
      Util.h('button.btn.btn-ghost', { type: 'button', disabled: atFirst, onClick: goPrev }, '← 上一題'),
      Util.h('div.u-flex.u-gap-sm', {},
        Util.h('button.btn.btn-ghost', { type: 'button', disabled: atLast, onClick: goNext }, '下一題 →'),
        Util.h('button.btn.btn-primary', { type: 'button', onClick: onSubmitClick }, '交卷')
      )
    );
  }

  function goPrev() {
    if (session.currentIndex > 0) {
      updateSession({ currentIndex: session.currentIndex - 1 });
      paintRunning();
    }
  }

  function goNext() {
    if (session.currentIndex < session.groups.length - 1) {
      updateSession({ currentIndex: session.currentIndex + 1 });
      paintRunning();
    }
  }

  function setActiveMarker(n) {
    if (!session || session.activeMarker === n) return;
    updateSession({ activeMarker: n });
    paintRunning();
  }

  function selectAnswer(key, idx) {
    if (session.mode === 'immediate' && session.revealed[key]) return;
    var answers = Object.assign({}, session.answers);
    answers[key] = idx;
    var patch = { answers: answers };

    // 每題耗時：以「距上一次作答」估算，只在第一次作答時定版（改答案不重算）。
    var now = Date.now();
    if (session.qSeconds[key] === undefined) {
      var qSeconds = Object.assign({}, session.qSeconds);
      qSeconds[key] = Math.max(1, Math.round((now - session.lastAnswerAt) / 1000));
      patch.qSeconds = qSeconds;
    }
    patch.lastAnswerAt = now;

    if (session.mode === 'immediate') {
      var revealed = Object.assign({}, session.revealed);
      revealed[key] = true;
      patch.revealed = revealed;
    }
    updateSession(patch);
    paintRunning();
  }

  // ---------------------------------------------------------------------
  // 共用元件：選項清單 / 解析
  // ---------------------------------------------------------------------

  function buildOptionList(options, selected, revealed, correctIndex, onSelect) {
    return Util.h('div.option-list', {},
      (options || []).map(function (opt, i) {
        var classes = ['option-btn'];
        if (revealed) {
          if (i === correctIndex) classes.push('is-correct');
          else if (i === selected) classes.push('is-incorrect');
        } else if (i === selected) {
          classes.push('is-selected');
        }
        var showMark = revealed && (i === correctIndex || i === selected);
        return Util.h('button', {
          type: 'button',
          class: classes.join(' '),
          disabled: revealed,
          onClick: function () { onSelect(i); }
        },
          Util.h('span.option-label', {}, OPTION_LETTERS[i] || String(i + 1)),
          Util.h('span.option-text', {}, opt),
          showMark ? Util.h('span.option-mark', {}, i === correctIndex ? '✓' : '✗') : null
        );
      })
    );
  }

  function buildExplanation(text) {
    return Util.h('div.card', { style: { marginTop: '14px', background: 'var(--color-surface-alt)' } },
      Util.h('p', { style: { fontWeight: 700, marginBottom: '4px' } }, '解析'),
      Util.h('p', {}, text || '（此題暫無解析）')
    );
  }

  // ---------------------------------------------------------------------
  // Part 5
  // ---------------------------------------------------------------------

  /** 解析展開時才顯示考點徽章（作答中先揭露考點等於送分） */
  function skillBadge(part, q, revealed) {
    if (!revealed) return null;
    return Util.h('span.badge.badge-primary', {}, skillLabelOf(part + ':' + skillTagOf(part, q)));
  }

  function buildP5Body(group) {
    var key = group.id;
    var selected = session.answers[key];
    var revealed = session.mode === 'immediate' && !!session.revealed[key];
    return Util.h('div.card', {},
      revealed ? Util.h('div.card-header', {}, skillBadge('P5', group, true)) : null,
      Util.h('div.card-body', {},
        Util.h('p', { style: { fontSize: '1.08rem', lineHeight: '1.8', marginBottom: '16px' } }, group.stem)
      ),
      buildOptionList(group.options, selected, revealed, group.answer, function (i) { selectAnswer(key, i); }),
      revealed ? buildExplanation(group.explanation_zh) : null
    );
  }

  // ---------------------------------------------------------------------
  // Part 6
  // ---------------------------------------------------------------------

  function renderPassageWithMarkers(text) {
    var raw = text || '';
    var segments = raw.split(/(\[\d\])/g);
    return segments.map(function (seg) {
      var m = /^\[(\d)\]$/.exec(seg);
      if (!m) return seg;
      var n = Number(m[1]);
      var active = session.activeMarker === n;
      return Util.h('span.badge.badge-primary', {
        style: active ? { boxShadow: '0 0 0 2px var(--color-primary)' } : {}
      }, '[' + n + ']');
    });
  }

  function buildP6SubQuestion(group, q) {
    var key = subKeyFor('P6', group, q);
    var selected = session.answers[key];
    var revealed = session.mode === 'immediate' && !!session.revealed[key];
    var prompt = q.type === 'sentence'
      ? ('選出最適合插入 [' + q.n + '] 位置的句子')
      : ('選出最適合填入 [' + q.n + '] 空格的選項');
    return Util.h('div.card', {
      onMouseenter: function () { setActiveMarker(q.n); },
      onFocusin: function () { setActiveMarker(q.n); }
    },
      Util.h('div.card-header', {},
        Util.h('span.badge.badge-primary', {}, '第 ' + q.n + ' 題'),
        q.type === 'sentence' ? Util.h('span.badge.badge-warning', {}, '句子插入') : null
      ),
      Util.h('p', { style: { fontWeight: 600, marginBottom: '10px' } }, prompt),
      buildOptionList(q.options, selected, revealed, q.answer, function (i) { selectAnswer(key, i); }),
      revealed ? buildExplanation(q.explanation_zh) : null
    );
  }

  function buildP6Body(group) {
    var passageCard = Util.h('div.card', { style: { flex: '1 1 360px', minWidth: '260px' } },
      Util.h('div.card-header', {}, Util.h('div.card-title', {}, group.title || 'Part 6 短文')),
      Util.h('div.card-body', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.9' } },
        renderPassageWithMarkers(group.passage))
    );
    var questionsCol = Util.h('div.u-flex-col.u-gap-md', { style: { flex: '1 1 320px', minWidth: '260px' } },
      (group.questions || []).map(function (q) { return buildP6SubQuestion(group, q); })
    );
    return Util.h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '16px', alignItems: 'flex-start' } },
      passageCard, questionsCol);
  }

  // ---------------------------------------------------------------------
  // Part 7
  // ---------------------------------------------------------------------

  function buildP7SubQuestion(group, q, idx) {
    var n = idx + 1;
    var key = subKeyFor('P7', group, q, idx);
    var selected = session.answers[key];
    var revealed = session.mode === 'immediate' && !!session.revealed[key];
    return Util.h('div.card', {},
      Util.h('div.card-header', {},
        Util.h('span.badge', {}, '第 ' + n + ' 題'),
        q.skill ? Util.h('span.badge.badge-primary', {}, SKILL_LABELS[q.skill] || q.skill) : null
      ),
      Util.h('p', { style: { fontWeight: 600, marginBottom: '10px' } }, q.q),
      buildOptionList(q.options, selected, revealed, q.answer, function (i) { selectAnswer(key, i); }),
      revealed ? buildExplanation(q.explanation_zh) : null
    );
  }

  function buildP7Body(group) {
    var passageCol = Util.h('div.u-flex-col.u-gap-md', { style: { flex: '1 1 360px', minWidth: '260px' } },
      (group.passages || []).map(function (p, i) {
        return Util.h('div.card', {},
          Util.h('div.card-header', {},
            Util.h('div.card-title', {}, p.title || ('文件 ' + (i + 1))),
            Util.h('span.badge.badge-primary', {}, KIND_LABELS[p.kind] || p.kind || '')
          ),
          Util.h('div.card-body', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.9' } }, p.text || '')
        );
      })
    );
    var questionsCol = Util.h('div.u-flex-col.u-gap-md', { style: { flex: '1 1 320px', minWidth: '260px' } },
      (group.questions || []).map(function (q, idx) { return buildP7SubQuestion(group, q, idx); })
    );
    return Util.h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '16px', alignItems: 'flex-start' } },
      passageCol, questionsCol);
  }

  // ---------------------------------------------------------------------
  // 交卷與結果
  // ---------------------------------------------------------------------

  function onSubmitClick() {
    var totalQ = countTotalQuestions(session.groups, session.part);
    var answeredQ = Object.keys(session.answers).length;
    if (answeredQ < totalQ) {
      Util.modal({
        title: '尚有題目未作答',
        body: '目前已作答 ' + answeredQ + ' / ' + totalQ + ' 題，確定要交卷嗎？未作答的題目視為答錯。',
        actions: [
          { label: '繼續作答', class: 'btn btn-ghost' },
          {
            label: '確定交卷', class: 'btn btn-danger',
            onClick: function (close) { close(); submitQuiz(); }
          }
        ]
      });
    } else {
      submitQuiz();
    }
  }

  function scoreSession(sess) {
    var total = 0;
    var correct = 0;
    var wrongIds = [];
    var detail = [];

    var target = paceTarget(sess.part);

    sess.groups.forEach(function (g) {
      if (sess.part === 'P5') {
        var key = g.id;
        var sel = sess.answers[key];
        var ok = sel === g.answer;
        total += 1;
        if (ok) correct += 1; else wrongIds.push(key);
        detail.push({
          key: key, label: truncate(g.stem, 60), ok: ok,
          stem: g.stem, options: g.options, answer: g.answer,
          explanation: g.explanation_zh, selected: sel,
          skillKey: skillKeyOf('P5', g),
          seconds: sess.qSeconds[key] || 0,
          targetSeconds: target
        });
        return;
      }
      (g.questions || []).forEach(function (q, idx) {
        var n = sess.part === 'P6' ? q.n : (idx + 1);
        var subKey = subKeyFor(sess.part, g, q, idx);
        var subSel = sess.answers[subKey];
        var subOk = subSel === q.answer;
        total += 1;
        if (subOk) correct += 1; else wrongIds.push(subKey);
        var stemText = sess.part === 'P6'
          ? ((g.title || g.id) + ' · 第 ' + n + ' 題')
          : (q.q || ((g.title || g.id) + ' 第 ' + n + ' 題'));
        detail.push({
          key: subKey, label: truncate(stemText, 60), ok: subOk,
          stem: q.q || stemText, options: q.options, answer: q.answer,
          explanation: q.explanation_zh, selected: subSel,
          skillKey: skillKeyOf(sess.part, q),
          seconds: sess.qSeconds[subKey] || 0,
          targetSeconds: target
        });
      });
    });

    return { total: total, correct: correct, wrongIds: wrongIds, detail: detail };
  }

  function submitQuiz() {
    cleanupTimer();
    var finalElapsed = computeElapsedSeconds();
    updateSession({ elapsedSeconds: finalElapsed });
    var result = scoreSession(session);
    Store.recordQuiz({
      mode: 'quiz',
      part: session.part,
      total: result.total,
      correct: result.correct,
      seconds: finalElapsed,
      wrongIds: result.wrongIds,
      // 逐題考點 + 秒數 → state.readingStats，閱讀診斷室據此排弱點與配速
      skillStats: result.detail.map(function (d) {
        return { key: d.skillKey, correct: d.ok, seconds: d.seconds };
      })
    });
    if (session.task) {
      Store.completeTask(session.task);
      Util.toast('任務已完成，做得好！', 'success');
    }
    updateSession({ phase: 'result', result: result });
    paintResult();
  }

  function buildResultTable(result) {
    return Util.h('div.table-wrap', {},
      Util.h('table.table', {},
        Util.h('thead', {}, Util.h('tr', {},
          Util.h('th', {}, '#'), Util.h('th', {}, '題目'), Util.h('th', {}, '考點'),
          Util.h('th', {}, '用時'), Util.h('th', {}, '結果')
        )),
        Util.h('tbody', {}, result.detail.map(function (d, i) {
          var over = d.seconds > d.targetSeconds;
          return Util.h('tr', { style: { cursor: 'pointer' }, onClick: function () { openReviewModal(d); } },
            Util.h('td', {}, String(i + 1)),
            Util.h('td', {}, d.label),
            Util.h('td', {}, Util.h('span.badge', {}, skillLabelOf(d.skillKey))),
            Util.h('td', {}, d.seconds
              ? Util.h('span', { class: over ? 'badge badge-warning' : '' }, d.seconds + 's')
              : Util.h('span.u-text-muted', {}, '—')),
            Util.h('td', {}, d.ok
              ? Util.h('span.badge.badge-success', {}, '✓ 正確')
              : Util.h('span.badge.badge-danger', {}, '✗ 錯誤'))
          );
        }))
      )
    );
  }

  /** 交卷後的錯因標記列（三層檢討法第一層：先講清楚為什麼錯） */
  function buildReasonRow(d, onDone) {
    var reasons = (window.TOEIC_DATA && window.TOEIC_DATA.reading && window.TOEIC_DATA.reading.reasons) || [];
    if (!reasons.length) return null;
    var current = '';
    try {
      var wb = Store.get().wrongBook || {};
      current = (wb[d.key] && wb[d.key].reason) || '';
    } catch (e) {
      current = '';
    }

    var row = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap', marginTop: '8px' } });
    reasons.forEach(function (r) {
      row.appendChild(Util.h('button', {
        type: 'button',
        class: 'btn btn-sm ' + (current === r.code ? 'btn-primary' : 'btn-ghost'),
        onClick: function () {
          try {
            Store.setWrongReason(d.key, current === r.code ? '' : r.code);
            Util.toast(current === r.code ? '已取消錯因標記' : ('已標記錯因：' + r.label), 'success');
            if (onDone) onDone();
          } catch (e) {
            Util.toast('標記失敗：' + e.message, 'error');
          }
        }
      }, r.icon + ' ' + r.label));
    });

    return Util.h('div.card', { style: { marginTop: '14px', background: 'var(--color-surface-alt)' } },
      Util.h('p', { style: { fontWeight: 700, marginBottom: '4px' } }, '這題為什麼錯？'),
      Util.h('p.u-text-muted', { style: { fontSize: '0.85rem' } },
        '標記錯因後，錯題本會統計你最常見的失分原因，並給對應的補強做法。'),
      row
    );
  }

  function openReviewModal(d) {
    var bodyWrap = Util.h('div');

    function paint() {
      clearNode(bodyWrap);
      bodyWrap.appendChild(Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap', marginBottom: '10px' } },
        Util.h('span.badge.badge-primary', {}, skillLabelOf(d.skillKey)),
        d.seconds
          ? Util.h('span', {
            class: 'badge ' + (d.seconds > d.targetSeconds ? 'badge-warning' : 'badge-success')
          }, '用時 ' + d.seconds + ' 秒／目標 ' + d.targetSeconds + ' 秒')
          : null
      ));
      bodyWrap.appendChild(Util.h('p', { style: { fontWeight: 600, marginBottom: '12px' } }, d.stem));
      bodyWrap.appendChild(buildOptionList(d.options, d.selected, true, d.answer, function () {}));
      bodyWrap.appendChild(buildExplanation(d.explanation));

      if (!d.ok) {
        var reasonCard = buildReasonRow(d, paint);
        if (reasonCard) bodyWrap.appendChild(reasonCard);
      } else {
        // 蒙對的題目不該被正確率蓋掉 — 讓使用者主動丟回錯題本
        bodyWrap.appendChild(Util.h('div.card', { style: { marginTop: '14px', background: 'var(--color-surface-alt)' } },
          Util.h('p', { style: { fontWeight: 700, marginBottom: '4px' } }, '這題是真的會，還是猜的？'),
          Util.h('button.btn.btn-ghost.btn-sm', {
            type: 'button',
            onClick: function () {
              try {
                Store.flagWrong(d.key, 'guess');
                Util.toast('已加入錯題本（錯因：沒把握用猜的）', 'success');
              } catch (e) {
                Util.toast('加入失敗：' + e.message, 'error');
              }
            }
          }, '🎲 其實是猜的，加入錯題本')
        ));
      }
    }

    paint();
    Util.modal({
      title: d.ok ? '答對了 🎉' : '答錯了，一起看解析',
      body: bodyWrap,
      actions: [{ label: '關閉', class: 'btn btn-primary' }]
    });
  }

  /** 本次作答依考點分解，直接指出哪個考點該補 */
  function buildSkillSummary(result) {
    var map = {};
    result.detail.forEach(function (d) {
      if (!map[d.skillKey]) map[d.skillKey] = { total: 0, correct: 0, seconds: 0 };
      map[d.skillKey].total += 1;
      map[d.skillKey].correct += d.ok ? 1 : 0;
      map[d.skillKey].seconds += d.seconds || 0;
    });
    var rows = Object.keys(map).map(function (key) {
      var m = map[key];
      return { key: key, label: skillLabelOf(key), total: m.total, correct: m.correct, pct: Util.pct(m.correct, m.total) };
    }).sort(function (a, b) { return a.pct - b.pct || b.total - a.total; });

    if (rows.length < 2) return null;

    var list = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px', marginTop: '12px' } });
    rows.forEach(function (r) {
      var tone = r.pct >= 80 ? ' is-success' : (r.pct >= 50 ? ' is-warning' : ' is-danger');
      list.appendChild(Util.h('div', {},
        Util.h('div.u-flex.u-justify-between', {},
          Util.h('span', {}, r.label),
          Util.h('span.u-text-muted', {}, r.correct + '/' + r.total + '　' + r.pct + '%')
        ),
        Util.h('div.progress-bar', { style: { marginTop: '4px' } },
          Util.h('div', { class: 'progress-bar-fill' + tone, style: { width: r.pct + '%' } })
        )
      ));
    });

    var weakest = rows[0];
    return Util.h('div.card', {},
      Util.h('div.card-title', {}, '本次考點分解'),
      Util.h('div.card-subtitle', {}, '同一個 Part 裡，不同考點的熟練度差很多 — 專項練最快'),
      list,
      weakest.pct < 70 ? Util.h('div.card-actions', {},
        Util.h('button.btn.btn-primary.btn-sm', {
          type: 'button',
          onClick: function () {
            var part = weakest.key.split(':')[0];
            var tag = weakest.key.slice(part.length + 1);
            if (window.App) window.App.navigate('#/quiz?part=' + part + '&skill=' + encodeURIComponent(tag) + '&count=10');
          }
        }, '專攻「' + weakest.label + '」10 題')
      ) : null
    );
  }

  /** 配速卡：實際每題秒數 vs 目標，換算成整份 Reading 做不做得完 */
  function buildPaceCard(result) {
    var timed = result.detail.filter(function (d) { return d.seconds > 0; });
    if (!timed.length) return null;
    var target = paceTarget(session.part);
    var totalSec = timed.reduce(function (s, d) { return s + d.seconds; }, 0);
    var avg = Math.round(totalSec / timed.length);
    var over = timed.filter(function (d) { return d.seconds > target; });
    var ratio = target ? avg / target : 1;

    var verdict, tone;
    if (ratio > 1.5) { verdict = '明顯超時 — 照這個速度正式考的閱讀會做不完'; tone = 'danger'; }
    else if (ratio > 1.15) { verdict = '略慢，還有壓縮空間'; tone = 'warning'; }
    else if (ratio < 0.6 && Util.pct(result.correct, result.total) < 70) {
      verdict = '很快但正確率偏低，比較像在猜'; tone = 'warning';
    } else { verdict = '配速在目標範圍內，保持住'; tone = 'success'; }

    return Util.h('div.card', {},
      Util.h('div.card-title', {}, '配速分析'),
      Util.h('div.card-subtitle', {},
        PART_LABELS[session.part] + ' 的目標是每題 ' + target + ' 秒（Reading 全長 75 分鐘 100 題）'),
      Util.h('div.stat-grid', { style: { marginTop: '12px' } },
        Util.h('div.stat-card', {},
          Util.h('div.stat-value', {}, avg + 's'),
          Util.h('div.stat-label', {}, '平均每題')),
        Util.h('div.stat-card', {},
          Util.h('div.stat-value', {}, target + 's'),
          Util.h('div.stat-label', {}, '目標每題')),
        Util.h('div.stat-card', {},
          Util.h('div.stat-value', {}, over.length + ' 題'),
          Util.h('div.stat-label', {}, '超過目標秒數'))
      ),
      Util.h('p', { style: { marginTop: '12px' } },
        Util.h('span', { class: 'badge badge-' + tone }, verdict))
    );
  }

  function onRetry() {
    startSession({
      part: session.part, count: session.requestedCount,
      mode: session.mode, timerOn: session.timerOn,
      skill: session.skill, task: session.task
    });
  }

  function paintResult() {
    clearNode(hostContainer);
    var result = session.result;
    var pctVal = Util.pct(result.correct, result.total);

    hostContainer.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, PART_LABELS[session.part] + ' 結果'),
        Util.h('p.view-subtitle', {},
          '共 ' + result.total + ' 題 · 用時 ' + Util.fmtTime(session.elapsedSeconds) +
          (session.skill ? ' · 專項：' + skillLabelOf(session.part + ':' + session.skill) : ''))
      )
    ));

    hostContainer.appendChild(Util.h('div.stat-grid', {},
      Util.h('div.stat-card', {},
        Util.h('div.stat-value', {}, result.correct + ' / ' + result.total),
        Util.h('div.stat-label', {}, '答對題數')),
      Util.h('div.stat-card', {},
        Util.h('div.stat-value', {}, pctVal + '%'),
        Util.h('div.stat-label', {}, '正確率')),
      Util.h('div.stat-card', {},
        Util.h('div.stat-value', {}, Util.fmtTime(session.elapsedSeconds)),
        Util.h('div.stat-label', {}, '用時'))
    ));

    var fillClass = 'progress-bar-fill' + (pctVal >= 70 ? ' is-success' : pctVal >= 40 ? ' is-warning' : ' is-danger');
    hostContainer.appendChild(Util.h('div.progress-bar', { style: { margin: '16px 0 20px' } },
      Util.h('div', { class: fillClass, style: { width: pctVal + '%' } })
    ));

    var paceCard = buildPaceCard(result);
    if (paceCard) hostContainer.appendChild(paceCard);

    var skillCard = buildSkillSummary(result);
    if (skillCard) hostContainer.appendChild(skillCard);

    if (result.wrongIds.length) {
      hostContainer.appendChild(Util.h('div.card', {},
        Util.h('div.card-title', {}, '別讓錯題停在這裡'),
        Util.h('div.card-subtitle', {},
          '這次答錯的 ' + result.wrongIds.length + ' 題已進入錯題本，並排入 1 天後的複習。' +
          '點下方表格任一列可以看解析並標記錯因。'),
        Util.h('div.card-actions', {},
          Util.h('button.btn.btn-ghost.btn-sm', {
            type: 'button',
            onClick: function () { if (window.App) window.App.navigate('#/review'); }
          }, '去錯題本檢討')
        )
      ));
    }

    hostContainer.appendChild(Util.h('h2', { style: { fontSize: '1.05rem', margin: '20px 0 10px' } }, '逐題結果'));
    hostContainer.appendChild(buildResultTable(result));

    hostContainer.appendChild(Util.h('div.u-flex.u-gap-sm.u-mt-md', { style: { flexWrap: 'wrap' } },
      Util.h('button.btn.btn-primary', { type: 'button', onClick: onRetry }, '再做一組'),
      Util.h('button.btn.btn-ghost', {
        type: 'button',
        onClick: function () { if (window.App) window.App.navigate('#/reading'); }
      }, '看閱讀診斷'),
      Util.h('button.btn.btn-ghost', {
        type: 'button',
        onClick: function () { if (window.App) window.App.navigate('#/dashboard'); }
      }, '回儀表板')
    ));
  }

  window.Views = window.Views || {};
  window.Views.quiz = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/reading.js */
/**
 * js/views/reading.js — 閱讀診斷室（#/reading）
 *
 * 把「做完題 → 知道哪裡爛 → 知道怎麼補 → 一鍵去練」串成閉環，是閱讀強化的入口頁。
 * 四個分頁：
 *   診斷    Reading 粗估分數、行動建議清單、整份 75 分鐘做不做得完
 *   考點    P5/P6/P7 各考點正確率與平均秒數排行，可直接開專項練習
 *   配速    各 Part 實際 vs 目標配速、官方配速表與考場檢查點
 *   框架    十大文法判斷框架 + Part 7 題型攻略（原創教材）
 *
 * 資料來源：Store.get()（readingStats / quizHistory / wrongBook）+ TOEIC_DATA.reading。
 * 計算全部委託 window.Reading（js/reading.js），本檔只負責畫面。
 * 暴露：window.Views.reading = { render, destroy }
 */
(function () {
  'use strict';

  var TABS = [
    { code: 'diagnosis', label: '診斷', icon: '🩺' },
    { code: 'skills', label: '考點', icon: '🎯' },
    { code: 'pace', label: '配速', icon: '⏱️' },
    { code: 'frameworks', label: '框架', icon: '📐' }
  ];

  var S = null;
  var container = null;
  var changeHandler = null;

  // -----------------------------------------------------------------------
  // 小工具
  // -----------------------------------------------------------------------

  function goTo(hash) {
    if (window.App && typeof window.App.navigate === 'function') window.App.navigate(hash);
    else window.location.hash = hash;
  }

  function clearNode(el) {
    while (el && el.firstChild) el.removeChild(el.firstChild);
  }

  function readingData() {
    return (window.TOEIC_DATA && window.TOEIC_DATA.reading) || null;
  }

  function toneClass(tone) {
    if (tone === 'success') return 'badge-success';
    if (tone === 'warning') return 'badge-warning';
    if (tone === 'danger') return 'badge-danger';
    if (tone === 'primary') return 'badge-primary';
    return '';
  }

  function barClass(pct) {
    if (pct >= 80) return 'progress-bar-fill is-success';
    if (pct >= 55) return 'progress-bar-fill is-warning';
    return 'progress-bar-fill is-danger';
  }

  function statCard(value, label, hint) {
    return Util.h('div.stat-card', {},
      Util.h('div.stat-value', {}, value),
      Util.h('div.stat-label', {}, label),
      hint ? Util.h('div.u-text-muted', { style: { fontSize: '0.75rem', marginTop: '2px' } }, hint) : null
    );
  }

  // -----------------------------------------------------------------------
  // 分頁一：診斷
  // -----------------------------------------------------------------------

  function buildRcCard(d) {
    var rc = d.rc;
    var card = Util.h('div.card', {},
      Util.h('div.card-header', {},
        Util.h('div', {},
          Util.h('div.card-title', {}, '閱讀分數粗估'),
          Util.h('div.card-subtitle', {}, '依你在本站的做題正確率換算，僅供追蹤趨勢，非官方分數')
        )
      )
    );

    if (rc.score === null) {
      card.appendChild(Util.h('div.card-body', {},
        Util.h('p', {}, '還沒有做題紀錄。先做一組 10 題的 Part 5，就能算出第一個基準分數。'),
        Util.h('div.card-actions', {},
          Util.h('button.btn.btn-primary.btn-sm', {
            onClick: function () { goTo('#/quiz?part=P5&count=10'); }
          }, '做 10 題 Part 5')
        )
      ));
      return card;
    }

    var confLabel = { high: '樣本充足', medium: '樣本尚可', low: '樣本偏少，僅供參考' }[rc.confidence] || '';

    card.appendChild(Util.h('div.stat-grid', { style: { marginTop: '12px' } },
      statCard(String(rc.score), '粗估 Reading 分數', '滿分 495'),
      statCard(rc.accuracy + '%', '整體正確率', '共 ' + rc.sample + ' 題'),
      rc.questionsToNext !== null
        ? statCard('+' + rc.questionsToNext + '%', '距 ' + rc.nextScore + ' 分', '正確率再拉高這麼多')
        : statCard('—', '距下一級距', '')
    ));
    card.appendChild(Util.h('p', { style: { marginTop: '12px' } },
      Util.h('span', { class: 'badge ' + (rc.confidence === 'low' ? 'badge-warning' : 'badge-primary') }, confLabel)
    ));

    var proj = d.projection;
    card.appendChild(Util.h('div.card', { style: { marginTop: '14px', background: 'var(--color-surface-alt)' } },
      Util.h('p', { style: { fontWeight: 700, marginBottom: '4px' } }, '整份 Reading 做得完嗎？'),
      Util.h('p', {}, proj.measuredParts === 0
        ? '還沒有計時紀錄。做題時請開啟計時，才能推估考場上的完成度。'
        : (proj.willFinish
          ? ('照目前配速，100 題大約需要 ' + proj.minutes + ' 分鐘，在 75 分鐘的限制內，可以做完。')
          // 超時的分鐘數換算成「來不及作答的題數」：用 Part 7 的每題目標秒數估算，
          // 因為時間不夠時被犧牲的一定是排在最後面的 Part 7。
          : ('照目前配速，100 題大約需要 ' + proj.minutes + ' 分鐘，超過限制 ' + proj.overMinutes +
            ' 分鐘 — 大約會有 ' +
            Math.round(proj.overMinutes * 60 / (Reading.PACE_TARGET.P7 || 60)) +
            ' 題來不及作答。')))
    ));

    return card;
  }

  function buildAdviceCard(d) {
    var card = Util.h('div.card', {},
      Util.h('div.card-title', {}, '接下來該做什麼'),
      Util.h('div.card-subtitle', {}, '依「投入時間 → 分數回收」的順序排列，從上面做起就對了')
    );

    var list = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '12px' } });
    d.advice.forEach(function (a, i) {
      list.appendChild(Util.h('div.card', { style: { background: 'var(--color-surface-alt)' } },
        Util.h('div.u-flex.u-items-center.u-gap-sm', {},
          Util.h('span', { style: { fontSize: '1.2rem' } }, a.icon),
          Util.h('span.badge.badge-primary', {}, '第 ' + (i + 1) + ' 順位'),
          Util.h('strong', {}, a.title)
        ),
        Util.h('p', { style: { marginTop: '6px' } }, a.detail),
        Util.h('div.u-flex.u-gap-sm', { style: { marginTop: '10px', flexWrap: 'wrap' } },
          Util.h('button.btn.btn-primary.btn-sm', {
            onClick: function () { goTo(a.hash); }
          }, a.actionLabel),
          a.frameworkId ? Util.h('button.btn.btn-ghost.btn-sm', {
            onClick: function () { S.tab = 'frameworks'; S.focusFramework = a.frameworkId; repaint(); }
          }, '先讀框架') : null
        )
      ));
    });
    card.appendChild(list);
    return card;
  }

  function buildReasonCard(d) {
    var r = d.reasons;
    var card = Util.h('div.card', {},
      Util.h('div.card-title', {}, '錯因分佈'),
      Util.h('div.card-subtitle', {}, '在錯題本或做題結果頁標記錯因後，這裡會告訴你「主要是哪一種失分」')
    );

    if (!r.total) {
      card.appendChild(Util.h('p', { style: { marginTop: '12px' } }, '目前沒有閱讀錯題。'));
      return card;
    }

    var tagged = r.total - r.untagged;
    if (!tagged) {
      card.appendChild(Util.h('p', { style: { marginTop: '12px' } },
        '你有 ' + r.total + ' 題閱讀錯題，但都還沒標記錯因。' +
        '花兩分鐘標一標 — 這是整個檢討流程裡最值錢的一步，因為「單字不會」和「時間不夠」要用完全不同的方法補。'));
      card.appendChild(Util.h('div.card-actions', {},
        Util.h('button.btn.btn-primary.btn-sm', { onClick: function () { goTo('#/review'); } }, '去標記錯因')
      ));
      return card;
    }

    var list = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '12px' } });
    r.rows.filter(function (row) { return row.count > 0; }).forEach(function (row) {
      list.appendChild(Util.h('div', {},
        Util.h('div.u-flex.u-justify-between', {},
          Util.h('span', {}, row.icon + ' ' + row.label),
          Util.h('span.u-text-muted', {}, row.count + ' 題（' + row.share + '%）')
        ),
        Util.h('div.progress-bar', { style: { marginTop: '4px' } },
          Util.h('div.progress-bar-fill', { style: { width: row.share + '%' } })
        ),
        Util.h('p.u-text-muted', { style: { fontSize: '0.82rem', marginTop: '4px' } }, row.advice)
      ));
    });
    card.appendChild(list);

    if (r.untagged) {
      card.appendChild(Util.h('p.u-text-muted', { style: { marginTop: '10px' } },
        '還有 ' + r.untagged + ' 題未標記錯因。'));
    }
    return card;
  }

  function renderDiagnosis(host, d) {
    host.appendChild(buildRcCard(d));
    host.appendChild(buildAdviceCard(d));
    host.appendChild(buildReasonCard(d));
  }

  // -----------------------------------------------------------------------
  // 分頁二：考點
  // -----------------------------------------------------------------------

  function skillRow(r) {
    var fw = Reading.frameworkForTag(r.tag);
    var showFramework = r.part === 'P5' && fw;
    return Util.h('div.card', { style: { background: 'var(--color-surface-alt)' } },
      Util.h('div.u-flex.u-justify-between.u-items-center', { style: { flexWrap: 'wrap', gap: '8px' } },
        Util.h('div.u-flex.u-items-center.u-gap-sm', { style: { flexWrap: 'wrap' } },
          Util.h('strong', {}, r.label),
          Util.h('span', { class: 'badge ' + toneClass(r.level.tone) }, r.level.label)
        ),
        Util.h('span.u-text-muted', {},
          r.correct + '/' + r.total + '　' + r.accuracy + '%' +
          (r.avgSeconds ? ('　平均 ' + r.avgSeconds + 's／目標 ' + r.targetSeconds + 's') : ''))
      ),
      Util.h('div.progress-bar', { style: { marginTop: '6px' } },
        Util.h('div', { class: barClass(r.accuracy), style: { width: r.accuracy + '%' } })
      ),
      r.overPace ? Util.h('p.u-text-muted', { style: { fontSize: '0.82rem', marginTop: '4px' } },
        '⏱️ 這個考點花的時間明顯高於目標，通常代表判斷規則還不夠自動化。') : null,
      Util.h('div.u-flex.u-gap-sm', { style: { marginTop: '10px', flexWrap: 'wrap' } },
        Util.h('button.btn.btn-primary.btn-sm', {
          disabled: !r.poolSize,
          onClick: function () { goTo(Reading.drillHash(r.key, r.part === 'P5' ? 10 : 6)); }
        }, r.poolSize ? ('專練 ' + (r.part === 'P5' ? 10 : 6) + ' 題') : '題庫無此考點'),
        showFramework ? Util.h('button.btn.btn-ghost.btn-sm', {
          onClick: function () { S.tab = 'frameworks'; S.focusFramework = fw.id; repaint(); }
        }, '讀判斷框架') : null
      )
    );
  }

  function renderSkills(host, d) {
    var partFilter = S.skillPart;
    var rows = d.skills.filter(function (r) { return partFilter === 'all' || r.part === partFilter; });

    var chipRow = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } });
    [['all', '全部'], ['P5', 'Part 5'], ['P6', 'Part 6'], ['P7', 'Part 7']].forEach(function (pair) {
      var count = pair[0] === 'all' ? d.skills.length
        : d.skills.filter(function (r) { return r.part === pair[0]; }).length;
      chipRow.appendChild(Util.h('button', {
        class: 'btn btn-sm ' + (partFilter === pair[0] ? 'btn-primary' : 'btn-ghost'),
        onClick: function () { S.skillPart = pair[0]; repaint(); }
      }, pair[1] + '（' + count + '）'));
    });

    host.appendChild(Util.h('div.card', {},
      Util.h('div.card-title', {}, '考點正確率排行'),
      Util.h('div.card-subtitle', {},
        '弱的排前面。樣本少於 ' + Reading.MIN_SAMPLE + ' 題會標「資料不足」，先多做幾題再看結論。'),
      Util.h('div', { style: { marginTop: '12px' } }, chipRow)
    ));

    if (!rows.length) {
      host.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', {}, '📊'),
        Util.h('h2', {}, '還沒有考點資料'),
        Util.h('p', {}, '做過閱讀練習後，這裡會依 Part 5 文法考點、Part 6 篇章題型、Part 7 閱讀技巧分別統計正確率。'),
        Util.h('button.btn.btn-primary', { onClick: function () { goTo('#/quiz'); } }, '去做題')
      ));
    } else {
      var list = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '4px' } });
      rows.forEach(function (r) { list.appendChild(skillRow(r)); });
      host.appendChild(list);
    }

    var untouched = d.untouched.filter(function (u) { return partFilter === 'all' || u.part === partFilter; });
    if (untouched.length) {
      var chips = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap', marginTop: '10px' } });
      untouched.forEach(function (u) {
        chips.appendChild(Util.h('button.btn.btn-ghost.btn-sm', {
          onClick: function () { goTo(Reading.drillHash(u.key, u.part === 'P5' ? 10 : 6)); }
        }, u.label + '（' + u.poolSize + ' 題）'));
      });
      host.appendChild(Util.h('div.card', {},
        Util.h('div.card-title', {}, '還沒練過的考點'),
        Util.h('div.card-subtitle', {}, '沒有資料就沒有診斷。這些考點各做幾題，弱點地圖才會完整。'),
        chips
      ));
    }
  }

  // -----------------------------------------------------------------------
  // 分頁三：配速
  // -----------------------------------------------------------------------

  function paceRow(p) {
    var toneMap = { slow: 'danger', warn: 'warning', rush: 'warning', ok: 'success', none: '' };
    var ratioPct = p.avgSeconds
      ? Util.clamp(Math.round((p.targetSeconds / p.avgSeconds) * 100), 0, 100)
      : 0;
    return Util.h('div.card', { style: { background: 'var(--color-surface-alt)' } },
      Util.h('div.u-flex.u-justify-between.u-items-center', { style: { flexWrap: 'wrap', gap: '8px' } },
        Util.h('strong', {}, p.label),
        Util.h('span', { class: 'badge ' + toneClass(toneMap[p.verdict]) }, p.verdictText)
      ),
      p.avgSeconds
        ? Util.h('div', {},
          Util.h('p.u-text-muted', { style: { marginTop: '6px' } },
            '實際平均 ' + p.avgSeconds + ' 秒／題 · 目標 ' + p.targetSeconds + ' 秒／題 · ' +
            '共 ' + p.questions + ' 題 · 正確率 ' + p.accuracy + '%'),
          Util.h('div.progress-bar', { style: { marginTop: '6px' } },
            Util.h('div', { class: barClass(ratioPct), style: { width: ratioPct + '%' } })
          )
        )
        : Util.h('p.u-text-muted', { style: { marginTop: '6px' } },
          '還沒有計時紀錄。做題時把「開啟計時」打勾就會開始累積。'),
      Util.h('div.u-flex.u-gap-sm', { style: { marginTop: '10px', flexWrap: 'wrap' } },
        Util.h('button.btn.btn-primary.btn-sm', {
          onClick: function () { goTo('#/quiz?part=' + p.part + '&count=10'); }
        }, '計時練 ' + p.part)
      )
    );
  }

  function renderPace(host, d) {
    var proj = d.projection;
    host.appendChild(Util.h('div.card', {},
      Util.h('div.card-title', {}, '你目前的配速'),
      Util.h('div.card-subtitle', {}, '閱讀失分有一半來自「沒做完」，而不是「不會」'),
      Util.h('div.stat-grid', { style: { marginTop: '12px' } },
        statCard(proj.minutes + ' 分', '推估完成 100 題', '限制 75 分鐘'),
        statCard(proj.willFinish ? '做得完' : ('超時 ' + proj.overMinutes + ' 分'), '完成度預測',
          proj.measuredParts + '/3 個 Part 有計時資料')
      )
    ));

    var list = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '12px' } });
    d.pace.forEach(function (p) { list.appendChild(paceRow(p)); });
    host.appendChild(list);

    var data = readingData();
    if (!data || !data.pace) return;

    var rows = data.pace.parts.map(function (p) {
      return Util.h('tr', {},
        Util.h('td', {}, p.name),
        Util.h('td', {}, p.count + ' 題'),
        Util.h('td', {}, p.minutes + ' 分'),
        Util.h('td', {}, p.secPerQ + ' 秒'),
        Util.h('td', {}, p.checkpoint)
      );
    });

    host.appendChild(Util.h('div.card', {},
      Util.h('div.card-title', {}, '官方配速表與考場檢查點'),
      Util.h('div.card-subtitle', {},
        'Reading Section 共 ' + data.pace.totalQuestions + ' 題 / ' + data.pace.totalMinutes + ' 分鐘'),
      Util.h('div.table-wrap.u-mt-md', {},
        Util.h('table.table', {},
          Util.h('thead', {}, Util.h('tr', {},
            Util.h('th', {}, 'Part'), Util.h('th', {}, '題數'), Util.h('th', {}, '時間'),
            Util.h('th', {}, '每題'), Util.h('th', {}, '檢查點')
          )),
          Util.h('tbody', {}, rows)
        )
      )
    ));

    var tips = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px', marginTop: '12px' } });
    data.pace.parts.forEach(function (p) {
      tips.appendChild(Util.h('div', {},
        Util.h('strong', {}, p.name),
        Util.h('p.u-text-muted', { style: { marginTop: '2px' } }, p.tip)
      ));
    });
    data.pace.rules.forEach(function (rule) {
      tips.appendChild(Util.h('p', {}, '・' + rule));
    });
    host.appendChild(Util.h('div.card', {},
      Util.h('div.card-title', {}, '配速心法'),
      tips
    ));
  }

  // -----------------------------------------------------------------------
  // 分頁四：框架
  // -----------------------------------------------------------------------

  function frameworkCard(fw, stat, focused) {
    var steps = Util.h('ol', { style: { margin: '8px 0 0 20px', display: 'flex', flexDirection: 'column', gap: '4px' } },
      fw.steps.map(function (s) { return Util.h('li', {}, s); })
    );

    return Util.h('div.card', {
      id: 'fw-' + fw.id,
      style: focused ? { boxShadow: '0 0 0 2px var(--color-primary)' } : {}
    },
      Util.h('div.card-header', {},
        Util.h('div', {},
          Util.h('div.card-title', {}, fw.title),
          Util.h('div.card-subtitle', {}, fw.when)
        ),
        stat && stat.enough
          ? Util.h('span', { class: 'badge ' + toneClass(stat.level.tone) }, '你的正確率 ' + stat.accuracy + '%')
          : Util.h('span.badge', {}, '目標 ' + fw.seconds + ' 秒')
      ),
      Util.h('div.card-body', {},
        Util.h('strong', {}, '判斷步驟'),
        steps,
        Util.h('div.card', { style: { marginTop: '12px', background: 'var(--color-surface-alt)' } },
          Util.h('p', { style: { fontWeight: 700, marginBottom: '4px' } }, '例句'),
          Util.h('p', { style: { fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace' } }, fw.example.en),
          Util.h('p.u-text-muted', { style: { marginTop: '4px' } }, fw.example.zh),
          Util.h('p', { style: { marginTop: '8px' } }, '💡 ' + fw.example.point)
        ),
        Util.h('p', { style: { marginTop: '10px' } },
          Util.h('span.badge.badge-warning', {}, '常見陷阱'), ' ', fw.trap)
      ),
      Util.h('div.card-actions', {},
        Util.h('button.btn.btn-primary.btn-sm', {
          onClick: function () { goTo('#/quiz?part=P5&skill=' + encodeURIComponent(fw.tag) + '&count=10'); }
        }, '立刻練 10 題')
      )
    );
  }

  function playbookCard(pb, stat) {
    return Util.h('div.card', {},
      Util.h('div.card-header', {},
        Util.h('div', {},
          Util.h('div.card-title', {}, pb.label),
          Util.h('div.card-subtitle', {}, '題目長相：' + pb.signal)
        ),
        stat && stat.enough
          ? Util.h('span', { class: 'badge ' + toneClass(stat.level.tone) }, '你的正確率 ' + stat.accuracy + '%')
          : Util.h('span.badge', {}, '建議 ' + pb.seconds + ' 秒')
      ),
      Util.h('div.card-body', {},
        Util.h('ol', { style: { margin: '0 0 0 20px', display: 'flex', flexDirection: 'column', gap: '4px' } },
          pb.steps.map(function (s) { return Util.h('li', {}, s); })),
        Util.h('p', { style: { marginTop: '10px' } },
          Util.h('span.badge.badge-warning', {}, '常見陷阱'), ' ', pb.trap)
      ),
      Util.h('div.card-actions', {},
        Util.h('button.btn.btn-primary.btn-sm', {
          onClick: function () {
            var part = pb.skill === 'sentence_insert' ? 'P6' : 'P7';
            var tag = pb.skill === 'sentence_insert' ? 'sentence' : pb.skill;
            goTo('#/quiz?part=' + part + '&skill=' + encodeURIComponent(tag) + '&count=6');
          }
        }, '練這個題型')
      )
    );
  }

  function renderFrameworks(host, d) {
    var data = readingData();
    if (!data) {
      host.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', {}, '📭'),
        Util.h('h2', {}, '教材資料未載入'),
        Util.h('p', {}, '請確認 data/reading_frameworks.js 已正確載入。')
      ));
      return;
    }

    var statByKey = {};
    d.skills.forEach(function (r) { statByKey[r.key] = r; });

    var subTabs = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } },
      [['grammar', 'Part 5 文法框架'], ['p7', 'Part 6/7 題型攻略']].map(function (pair) {
        return Util.h('button', {
          class: 'btn btn-sm ' + (S.fwTab === pair[0] ? 'btn-primary' : 'btn-ghost'),
          onClick: function () { S.fwTab = pair[0]; repaint(); }
        }, pair[1]);
      })
    );

    host.appendChild(Util.h('div.card', {},
      Util.h('div.card-title', {}, S.fwTab === 'grammar' ? '十大文法判斷框架' : 'Part 6/7 題型攻略'),
      Util.h('div.card-subtitle', {}, S.fwTab === 'grammar'
        ? 'Part 5 的考點是固定的。把這十條變成反射動作，30 題可以在 10 分鐘內做完。'
        : '閱讀題型各有各的解法與時間預算。先分辨題型，再套對應的步驟。'),
      Util.h('div', { style: { marginTop: '12px' } }, subTabs)
    ));

    var list = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '16px' } });
    if (S.fwTab === 'grammar') {
      (data.frameworks || []).forEach(function (fw) {
        list.appendChild(frameworkCard(fw, statByKey['P5:' + fw.tag], S.focusFramework === fw.id));
      });
    } else {
      (data.p7Playbook || []).forEach(function (pb) {
        var key = pb.skill === 'sentence_insert' ? 'P6:sentence' : ('P7:' + pb.skill);
        list.appendChild(playbookCard(pb, statByKey[key]));
      });
    }
    host.appendChild(list);

    // 從建議卡「先讀框架」跳過來時，捲到該張卡片
    if (S.focusFramework && S.fwTab === 'grammar') {
      var target = S.focusFramework;
      S.focusFramework = null;
      setTimeout(function () {
        var el = document.getElementById('fw-' + target);
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
      }, 0);
    }
  }

  // -----------------------------------------------------------------------
  // 版面
  // -----------------------------------------------------------------------

  function buildTabBar() {
    var row = Util.h('div.u-flex.u-gap-sm', { style: { flexWrap: 'wrap', marginBottom: '16px' } });
    TABS.forEach(function (t) {
      row.appendChild(Util.h('button', {
        class: 'btn btn-sm ' + (S.tab === t.code ? 'btn-primary' : 'btn-ghost'),
        onClick: function () { S.tab = t.code; repaint(); }
      }, t.icon + ' ' + t.label));
    });
    return row;
  }

  function repaint() {
    if (!S || !S.bodyEl) return;
    clearNode(S.bodyEl);

    var state;
    try {
      state = Store.get();
    } catch (e) {
      S.bodyEl.appendChild(Util.h('div.empty-state.empty-state-error', {},
        Util.h('div.empty-state-icon', {}, '⚠️'),
        Util.h('h2', {}, '無法讀取學習紀錄'),
        Util.h('p', {}, '請重新整理頁面再試一次。')
      ));
      return;
    }

    var d = Reading.diagnose(state, { today: Util.todayISO() });

    S.bodyEl.appendChild(buildTabBar());
    var host = Util.h('div', { style: { display: 'flex', flexDirection: 'column', gap: '16px' } });
    S.bodyEl.appendChild(host);

    if (S.tab === 'skills') renderSkills(host, d);
    else if (S.tab === 'pace') renderPace(host, d);
    else if (S.tab === 'frameworks') renderFrameworks(host, d);
    else renderDiagnosis(host, d);
  }

  // -----------------------------------------------------------------------
  // render / destroy
  // -----------------------------------------------------------------------

  function render(containerEl, params) {
    container = containerEl;
    params = params || {};

    if (!window.Reading || !window.Store || !window.Util) {
      container.appendChild(Util.h('div.empty-state.empty-state-error', {},
        Util.h('div.empty-state-icon', {}, '⚠️'),
        Util.h('h2', {}, '無法載入閱讀診斷室'),
        Util.h('p', {}, '核心模組（js/reading.js）尚未載入，請重新整理頁面。')
      ));
      return;
    }

    var validTabs = TABS.map(function (t) { return t.code; });
    S = {
      tab: validTabs.indexOf(params.tab) !== -1 ? params.tab : 'diagnosis',
      skillPart: 'all',
      fwTab: 'grammar',
      focusFramework: null,
      bodyEl: null
    };

    if (params.task) {
      try { Store.completeTask(params.task); } catch (e) { /* 任務勾選失敗不阻斷頁面 */ }
    }

    container.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, '閱讀診斷室'),
        Util.h('p.view-subtitle', {}, '找出閱讀失分在哪、為什麼、然後直接去補')
      ),
      Util.h('button.btn.btn-primary.btn-sm', {
        onClick: function () { goTo('#/quiz'); }
      }, '✏️ 去做題')
    ));

    S.bodyEl = Util.h('div');
    container.appendChild(S.bodyEl);
    repaint();

    // 在其他頁面作答後回到本頁時，資料要跟著更新
    changeHandler = function () { repaint(); };
    window.addEventListener('toeic30:change', changeHandler);
  }

  function destroy() {
    if (changeHandler) {
      window.removeEventListener('toeic30:change', changeHandler);
      changeHandler = null;
    }
    S = null;
    container = null;
  }

  window.Views = window.Views || {};
  window.Views.reading = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/listening.js */
/**
 * js/views/listening.js
 * 聽力練習（Part 1–4）：設定 → 播放（TTS）→ 作答 → 解析 → 結果。
 * 暴露 window.Views.listening = { render, destroy }
 * 依 docs/DESIGN.md §5.7、§3；依 docs/API_ui.md、docs/API_infra.md 呼叫 Util / Store / TTS。
 */
(function () {
  'use strict';

  var LETTERS = ['A', 'B', 'C', 'D'];
  var PART_META = [
    { key: 'P1', label: 'Part 1 照片描述', dataKey: 'p1' },
    { key: 'P2', label: 'Part 2 應答問題', dataKey: 'p2' },
    { key: 'P3', label: 'Part 3 簡短對話', dataKey: 'p3' },
    { key: 'P4', label: 'Part 4 簡短獨白', dataKey: 'p4' }
  ];
  var P4_KIND_LABELS = {
    announcement: '公告', voicemail: '語音留言', talk: '簡短演講',
    ad: '廣告', news: '新聞', tour: '導覽解說'
  };

  // ---- module-level 狀態（每次 render() 重新建立） ----
  var S = null;
  var container = null;
  var timerId = null;
  var timerStartTs = null;

  // ---------------------------------------------------------------------
  // 小工具
  // ---------------------------------------------------------------------

  function stripLetterPrefix(s) {
    return String(s || '').replace(/^[A-D][.).:]?\s+/, '');
  }

  function pickCountOptions(total) {
    if (!total || total <= 0) return [];
    var candidates = [5, 10, 15, 20, 30, 40, 50];
    var opts = candidates.filter(function (n) { return n < total; });
    opts.push(total);
    opts = opts.filter(function (n, i) { return opts.indexOf(n) === i; });
    opts.sort(function (a, b) { return a - b; });
    return opts;
  }

  function getData(partKey) {
    var listening = window.TOEIC_DATA && window.TOEIC_DATA.listening;
    if (!listening) return [];
    var meta = null;
    for (var i = 0; i < PART_META.length; i++) {
      if (PART_META[i].key === partKey) { meta = PART_META[i]; break; }
    }
