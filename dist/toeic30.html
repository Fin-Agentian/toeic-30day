    if (!meta) return [];
    return listening[meta.dataKey] || [];
  }

  function ttsReady() {
    return !!(window.TTS && TTS.isSupported());
  }

  // 非阻擋檢查：目前瀏覽器是否偵測得到英文語音。結果只影響提示文字顯示，不影響播放/作答流程。
  function checkEnglishVoice() {
    if (!ttsReady() || typeof TTS.hasEnglishVoice !== 'function') return;
    TTS.hasEnglishVoice().then(function (has) {
      if (!S || S.phase !== 'session') return;
      S.hasEnglishVoiceChecked = true;
      S.hasEnglishVoice = has;
      rerender();
    });
  }

  function stopTimer() {
    if (timerId) { window.clearInterval(timerId); timerId = null; }
    timerStartTs = null;
  }

  function startTimer() {
    stopTimer();
    // 用 Date.now() 差值計算已花費秒數，避免背景分頁被瀏覽器節流 setInterval 導致計時不準。
    timerStartTs = Date.now() - (S.elapsedSec || 0) * 1000;
    timerId = window.setInterval(function () {
      if (!S) return;
      S.elapsedSec = Math.floor((Date.now() - timerStartTs) / 1000);
      var el = Util.$('#lsTimer', container);
      if (el) el.textContent = Util.fmtTime(S.elapsedSec);
    }, 1000);
  }

  // ---------------------------------------------------------------------
  // 資料整形：把各 Part 原始資料整理成統一的 unit 結構
  // unit: { id, kind, raw, questions:[{qid, prompt, options, answer, explanation_zh}], transcriptLines:[...] }
  // ---------------------------------------------------------------------

  function buildUnit(part, item) {
    if (part === 'P1') {
      var statements = (item.statements || []).map(stripLetterPrefix);
      return {
        id: item.id, kind: 'P1', raw: item,
        questions: [{
          qid: item.id, prompt: null, options: statements,
          answer: item.answer, explanation_zh: item.explanation_zh
        }],
        transcriptLines: statements.map(function (s, i) { return LETTERS[i] + '. ' + s; })
      };
    }
    if (part === 'P2') {
      var responses = (item.responses || []).map(stripLetterPrefix);
      return {
        id: item.id, kind: 'P2', raw: item,
        questions: [{
          qid: item.id, prompt: null, options: responses,
          answer: item.answer, explanation_zh: item.explanation_zh
        }],
        transcriptLines: ['Q: ' + item.question].concat(
          responses.map(function (r, i) { return LETTERS[i] + '. ' + r; })
        )
      };
    }
    if (part === 'P3') {
      var qs3 = (item.questions || []).map(function (q, i) {
        return {
          qid: item.id + '-q' + (i + 1), prompt: q.q, options: q.options,
          answer: q.answer, explanation_zh: q.explanation_zh
        };
      });
      return {
        id: item.id, kind: 'P3', raw: item, questions: qs3,
        transcriptLines: (item.script || []).map(function (line) { return line.s + '：' + line.t; })
      };
    }
    // P4
    var qs4 = (item.questions || []).map(function (q, i) {
      return {
        qid: item.id + '-q' + (i + 1), prompt: q.q, options: q.options,
        answer: q.answer, explanation_zh: q.explanation_zh
      };
    });
    return {
      id: item.id, kind: 'P4', raw: item, questions: qs4,
      transcriptLines: [item.script || '']
    };
  }

  function buildAudioItems(unit) {
    var rate = S.rate;
    if (unit.kind === 'P1') {
      return unit.questions[0].options.map(function (text, i) {
        return { text: LETTERS[i] + '. ' + text, rate: rate, pauseMs: 400 };
      });
    }
    if (unit.kind === 'P2') {
      var items = [{ text: unit.raw.question, rate: rate, pauseMs: 500 }];
      unit.questions[0].options.forEach(function (text, i) {
        items.push({ text: LETTERS[i] + '. ' + text, rate: rate, pauseMs: 300 });
      });
      return items;
    }
    if (unit.kind === 'P3') {
      return (unit.raw.script || []).map(function (line) {
        return { text: line.t, gender: line.s === 'W' ? 'female' : 'male', rate: rate, pauseMs: 350 };
      });
    }
    return [{ text: unit.raw.script || '', rate: rate, pauseMs: 0 }];
  }

  // ---------------------------------------------------------------------
  // 播放控制
  // ---------------------------------------------------------------------

  function playUnit(unit) {
    if (!S || S.isPlayingUnitId) return;
    var used = S.playsUsedMap[unit.id] || 0;
    if (used >= S.playCount) { Util.toast('已達播放次數上限', 'warning'); return; }
    if (!ttsReady()) { Util.toast('此瀏覽器不支援語音朗讀', 'warning'); return; }

    S.isPlayingUnitId = unit.id;
    var token = (S.playToken = (S.playToken || 0) + 1);
    rerender();

    TTS.speakSequence(buildAudioItems(unit)).then(function () {
      if (!S || S.playToken !== token) return;
      var newMap = Object.assign({}, S.playsUsedMap);
      newMap[unit.id] = (newMap[unit.id] || 0) + 1;
      S.playsUsedMap = newMap;
      S.isPlayingUnitId = null;
      rerender();
    });
  }

  function stopPlayback() {
    if (window.TTS) TTS.stop();
    if (!S) return;
    S.isPlayingUnitId = null;
    rerender();
  }

  // ---------------------------------------------------------------------
  // 作答
  // ---------------------------------------------------------------------

  function selectAnswer(q, optIdx) {
    if (!S || S.answers.hasOwnProperty(q.qid)) return;
    var next = Object.assign({}, S.answers);
    next[q.qid] = optIdx;
    S.answers = next;
    rerender();
  }

  function isUnitAnswered(unit) {
    return unit.questions.every(function (q) { return S.answers.hasOwnProperty(q.qid); });
  }

  function currentUnit() { return S.units[S.index]; }

  // ---------------------------------------------------------------------
  // 渲染：setup
  // ---------------------------------------------------------------------

  function renderHeader(subtitle) {
    container.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, '聽力練習'),
        subtitle ? Util.h('p.view-subtitle', {}, subtitle) : null
      )
    ));
  }

  function renderSetup() {
    renderHeader('設定 Part、題數與播放參數，開始聽力練習。');

    var available = PART_META.map(function (p) {
      return { key: p.key, label: p.label, n: getData(p.key).length };
    });
    var hasAnyData = available.some(function (a) { return a.n > 0; });
    if (!hasAnyData) {
      container.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', {}, '🎧'),
        Util.h('h2', {}, '尚無聽力題目資料'),
        Util.h('p', {}, '請確認 data/listening_*.js 是否已載入。')
      ));
      return;
    }

    var currentMeta = available.filter(function (a) { return a.key === S.part; })[0];
    if (!currentMeta || currentMeta.n === 0) {
      currentMeta = available.filter(function (a) { return a.n > 0; })[0];
      S.part = currentMeta.key;
    }
    var countOptions = pickCountOptions(currentMeta.n);
    if (countOptions.indexOf(S.count) === -1) {
      if (S.count >= 1 && S.count <= currentMeta.n) {
        // 指定題數在合法範圍內但不在預設選項中（例如 URL 帶入 count=3）：直接併入選項，
        // 確保下拉選單有一個選項與 S.count 一致，不會靜默改掉使用者指定的題數。
        countOptions.push(S.count);
        countOptions = countOptions.filter(function (n, i) { return countOptions.indexOf(n) === i; });
        countOptions.sort(function (a, b) { return a - b; });
      } else {
        // 超出範圍：選最接近的既有選項，並讓 S.count 與畫面選取狀態保持一致。
        S.count = countOptions.reduce(function (best, n) {
          return Math.abs(n - S.count) < Math.abs(best - S.count) ? n : best;
        }, countOptions[0]);
      }
    }

    var partSelect = Util.h('select.select', {
      id: 'lsPart',
      onChange: function (e) { S.part = e.target.value; rerender(); }
    }, available.map(function (a) {
      return Util.h('option', { value: a.key, selected: a.key === S.part, disabled: a.n === 0 },
        a.label + (a.n === 0 ? '（無資料）' : '（' + a.n + ' 組）'));
    }));

    var countSelect = Util.h('select.select', {
      id: 'lsCount',
      onChange: function (e) { S.count = parseInt(e.target.value, 10); }
    }, countOptions.map(function (n) {
      return Util.h('option', { value: n, selected: n === S.count }, n + ' 組');
    }));

    var playSelect = Util.h('select.select', {
      id: 'lsPlayCount',
      onChange: function (e) { S.playCount = parseInt(e.target.value, 10); }
    }, [1, 2].map(function (n) {
      return Util.h('option', { value: n, selected: n === S.playCount }, n + ' 次');
    }));

    var rateLabel = Util.h('span', {}, S.rate.toFixed(1) + 'x');
    var rateInput = Util.h('input.input', {
      type: 'range', min: '0.8', max: '1.2', step: '0.1', value: String(S.rate),
      onInput: function (e) {
        S.rate = parseFloat(e.target.value);
        rateLabel.textContent = S.rate.toFixed(1) + 'x';
      }
    });

    var transcriptCheckbox = Util.h('input', {
      type: 'checkbox', checked: S.showTranscriptAfter,
      onChange: function (e) { S.showTranscriptAfter = e.target.checked; }
    });

    var noTTSNotice = !ttsReady()
      ? Util.h('p.u-text-muted', {}, '⚠️ 此瀏覽器不支援語音朗讀，將直接顯示逐字稿供閱讀作答。')
      : null;

    container.appendChild(Util.h('div.card', {},
      Util.h('div.card-body', {},
        Util.h('div.field', {}, Util.h('label.field-label', { for: 'lsPart' }, '選擇 Part'), partSelect),
        Util.h('div.field', {}, Util.h('label.field-label', { for: 'lsCount' }, '題數'), countSelect),
        Util.h('div.field', {}, Util.h('label.field-label', { for: 'lsPlayCount' }, '播放次數'), playSelect),
        Util.h('div.field', {},
          Util.h('label.field-label', {}, '語速'),
          Util.h('div.u-flex.u-items-center.u-gap-sm', {}, rateInput, rateLabel)
        ),
        Util.h('label.checkbox-row', {}, transcriptCheckbox, Util.h('span', {}, '作答後顯示逐字稿')),
        noTTSNotice,
        Util.h('div.card-actions', {},
          Util.h('button.btn.btn-primary.btn-block', { onClick: startSession }, '開始聽力練習')
        )
      )
    ));
  }

  function startSession() {
    var raw = getData(S.part);
    var n = Util.clamp(S.count, 1, raw.length || 1);
    var picked = raw.length ? Util.sample(raw, n) : [];
    S.units = picked.map(function (item) { return buildUnit(S.part, item); });
    S.index = 0;
    S.answers = {};
    S.playsUsedMap = {};
    S.isPlayingUnitId = null;
    S.sceneExpanded = {};
    S.elapsedSec = 0;
    S.resultSummary = null;
    S.hasEnglishVoiceChecked = false;
    S.hasEnglishVoice = null;
    if (S.units.length === 0) {
      Util.toast('此 Part 目前沒有可用題目', 'warning');
      return;
    }
    S.phase = 'session';
    startTimer();
    checkEnglishVoice();
    rerender();
  }

  function resetToSetup() {
    S.phase = 'setup';
    S.units = [];
    S.answers = {};
    S.index = 0;
    S.resultSummary = null;
    rerender();
  }

  // ---------------------------------------------------------------------
  // 渲染：session
  // ---------------------------------------------------------------------

  function renderOptions(q, hideText) {
    var answered = S.answers.hasOwnProperty(q.qid);
    var selected = S.answers[q.qid];
    return Util.h('div.option-list', {}, q.options.map(function (optText, i) {
      var isCorrect = i === q.answer;
      var isSelected = selected === i;
      var cls = ['option-btn'];
      if (answered) {
        if (isCorrect) cls.push('is-correct');
        else if (isSelected) cls.push('is-incorrect');
      } else if (isSelected) {
        cls.push('is-selected');
      }
      var showText = !hideText || answered;
      return Util.h('button', { class: cls, disabled: answered, onClick: function () { selectAnswer(q, i); } },
        Util.h('span.option-label', {}, LETTERS[i]),
        showText ? Util.h('span.option-text', {}, optText) : null,
        answered && isCorrect ? Util.h('span.option-mark', {}, '✓')
          : (answered && isSelected && !isCorrect ? Util.h('span.option-mark', {}, '✗') : null)
      );
    }));
  }

  function playbackControls(unit, noTTS) {
    if (noTTS) {
      return Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('p.u-text-muted', {}, '⚠️ 此瀏覽器不支援語音朗讀，請閱讀下方逐字稿作答。')
      ));
    }
    var used = S.playsUsedMap[unit.id] || 0;
    var remaining = S.playCount - used;
    var playing = S.isPlayingUnitId === unit.id;
    var label = used === 0 ? '▶ 播放音檔' : '▶ 重播（剩 ' + Math.max(remaining, 0) + ' 次）';
    return Util.h('div.card', {}, Util.h('div.card-body', {},
      Util.h('div.u-flex.u-items-center.u-gap-sm', {},
        playing
          ? Util.h('button.btn.btn-danger', { onClick: stopPlayback }, '■ 停止播放')
          : Util.h('button.btn.btn-primary', {
              disabled: remaining <= 0 || !!S.isPlayingUnitId,
              onClick: function () { playUnit(unit); }
            }, label),
        Util.h('span.u-text-muted', {}, playing ? '🔊 播放中…' : ('已播放 ' + used + ' / ' + S.playCount + ' 次'))
      )
    ));
  }

  function sceneEnToggle(unit) {
    var expanded = !!S.sceneExpanded[unit.id];
    return Util.h('div', {},
      Util.h('button.btn.btn-ghost.btn-sm', {
        onClick: function () {
          var next = Object.assign({}, S.sceneExpanded);
          next[unit.id] = !expanded;
          S.sceneExpanded = next;
          rerender();
        }
      }, expanded ? '收合英文原文' : '展開英文原文'),
      expanded ? Util.h('p.u-text-secondary', {}, unit.raw.scene_en) : null
    );
  }

  function transcriptPanel(unit) {
    return Util.h('div.card', {}, Util.h('div.card-body', {},
      Util.h('h3', {}, '逐字稿'),
      Util.h('div.u-flex-col.u-gap-sm', {},
        unit.transcriptLines.map(function (line) { return Util.h('p', {}, line); })
      )
    ));
  }

  function explanationPanel(unit) {
    return Util.h('div.card', {}, Util.h('div.card-body', {},
      Util.h('h3', {}, '解析'),
      unit.questions.map(function (q, i) {
        var correctLetter = LETTERS[q.answer];
        var yourIdx = S.answers[q.qid];
        var yourLetter = yourIdx !== undefined ? LETTERS[yourIdx] : '—';
        var isRight = yourIdx === q.answer;
        return Util.h('div', { class: i > 0 ? ['u-mt-md'] : null },
          unit.questions.length > 1 ? Util.h('p.u-text-secondary', {}, '第 ' + (i + 1) + ' 題') : null,
          Util.h('p', {},
            Util.h('strong', {}, '正確答案：' + correctLetter),
            '　你的答案：' + yourLetter + (isRight ? '（答對 ✓）' : '（答錯 ✗）')
          ),
          Util.h('p.u-text-secondary', {}, q.explanation_zh || '')
        );
      })
    ));
  }

  function unitCard(unit, noTTS) {
    var answered = isUnitAnswered(unit);
    var body = [];

    if (unit.kind === 'P1') {
      body.push(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('h3', {}, '情境描述'),
        Util.h('p', {}, unit.raw.scene_zh || ''),
        unit.raw.scene_en ? sceneEnToggle(unit) : null
      )));
      body.push(playbackControls(unit, noTTS));
      body.push(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('h3', {}, '選出符合描述的敘述'),
        renderOptions(unit.questions[0], !noTTS)
      )));
    } else if (unit.kind === 'P2') {
      body.push(playbackControls(unit, noTTS));
      body.push(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('h3', {}, '選出最適合的回答'),
        renderOptions(unit.questions[0], !noTTS)
      )));
    } else {
      var kindLabel = unit.kind === 'P4' ? (P4_KIND_LABELS[unit.raw.kind] || unit.raw.kind) : null;
      body.push(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('div.u-flex.u-items-center.u-gap-sm', {},
          Util.h('h3', {}, unit.kind === 'P3' ? '簡短對話' : '簡短獨白'),
          kindLabel ? Util.h('span.badge.badge-primary', {}, kindLabel) : null
        ),
        unit.raw.setting_zh ? Util.h('p.u-text-secondary', {}, '情境：' + unit.raw.setting_zh) : null
      )));
      body.push(playbackControls(unit, noTTS));
      body.push(Util.h('div.card', {}, Util.h('div.card-body', {},
        Util.h('p.u-text-muted', {}, '💡 小技巧：播放前可先閱讀下方題目與選項，掌握重點方向。'),
        unit.questions.map(function (q, i) {
          return Util.h('div', { class: i > 0 ? ['u-mt-md'] : null },
            Util.h('h4', {}, '第 ' + (i + 1) + ' 題：' + q.prompt),
            renderOptions(q, false)
          );
        })
      )));
    }

    var showTranscriptNow = answered
      ? S.showTranscriptAfter
      : (noTTS && (unit.kind === 'P3' || unit.kind === 'P4'));
    if (showTranscriptNow) body.push(transcriptPanel(unit));
    if (answered) body.push(explanationPanel(unit));

    return Util.h('div', {}, body);
  }

  function goToIndex(newIndex) {
    if (window.TTS) TTS.stop();
    S.isPlayingUnitId = null;
    S.playToken = (S.playToken || 0) + 1;
    S.index = newIndex;
    rerender();
  }

  function renderSession() {
    var unit = currentUnit();
    renderHeader('Part ' + S.part.slice(1) + ' · 第 ' + (S.index + 1) + ' / ' + S.units.length + ' 題組');

    container.appendChild(Util.h('div.u-flex.u-items-center.u-gap-sm.u-mt-md', {},
      Util.h('span.pill', {}, '⏱ ', Util.h('span', { id: 'lsTimer' }, Util.fmtTime(S.elapsedSec))),
      Util.h('div.progress-bar', { style: { flex: '1' } },
        Util.h('div.progress-bar-fill', { style: { width: Util.pct(S.index, S.units.length) + '%' } })
      ),
      Util.h('span.u-text-muted', {}, (S.index + 1) + '/' + S.units.length)
    ));

    if (ttsReady() && S.hasEnglishVoiceChecked && !S.hasEnglishVoice) {
      container.appendChild(Util.h('div.card.u-mt-md', {}, Util.h('div.card-body', {},
        Util.h('p.u-text-muted', {}, '⚠️ ' + ((window.TTS && TTS.NO_ENGLISH_VOICE_HINT) ||
          '未偵測到英文語音，播放可能不標準；建議在作業系統安裝英文語音，或作答後閱讀逐字稿練習。'))
      )));
    }

    container.appendChild(unitCard(unit, !ttsReady()));

    var answered = isUnitAnswered(unit);
    container.appendChild(Util.h('div.u-flex.u-justify-between.u-mt-md', {},
      Util.h('button.btn.btn-ghost', {
        disabled: S.index === 0,
        onClick: function () { goToIndex(S.index - 1); }
      }, '← 上一組'),
      S.index < S.units.length - 1
        ? Util.h('button.btn.btn-primary', {
            disabled: !answered,
            onClick: function () { goToIndex(S.index + 1); }
          }, '下一組 →')
        : Util.h('button.btn.btn-primary', { disabled: !answered, onClick: finishSession }, '完成，查看結果')
    ));
  }

  function finishSession() {
    stopTimer();
    if (window.TTS) TTS.stop();

    var total = 0, correct = 0, wrongIds = [];
    S.units.forEach(function (u) {
      u.questions.forEach(function (q) {
        total += 1;
        var ans = S.answers[q.qid];
        if (ans === q.answer) correct += 1;
        else wrongIds.push(q.qid);
      });
    });

    try {
      if (window.Store) {
        Store.recordQuiz({
          mode: 'listening', part: S.part, total: total, correct: correct,
          seconds: S.elapsedSec, wrongIds: wrongIds
        });
        if (S.taskId) Store.completeTask(S.taskId);
      }
    } catch (e) {
      Util.toast('紀錄成績失敗：' + e.message, 'error');
    }

    S.resultSummary = { total: total, correct: correct, seconds: S.elapsedSec };
    S.phase = 'result';
    rerender();
  }

  function renderResult() {
    renderHeader('本次聽力練習結果');
    var r = S.resultSummary || { total: 0, correct: 0, seconds: 0 };
    var pct = Util.pct(r.correct, r.total);

    container.appendChild(Util.h('div.stat-grid', {},
      Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, pct + '%'), Util.h('div.stat-label', {}, '正確率')),
      Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, r.correct + '/' + r.total), Util.h('div.stat-label', {}, '答對題數')),
      Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, Util.fmtTime(r.seconds)), Util.h('div.stat-label', {}, '花費時間'))
    ));

    if (S.taskId) {
      container.appendChild(Util.h('p.u-text-secondary.u-mt-md', {}, '✅ 已完成今日任務。'));
    }

    container.appendChild(Util.h('div.u-flex.u-gap-sm.u-mt-md', {},
      Util.h('button.btn.btn-primary', { onClick: resetToSetup }, '再練習一組'),
      Util.h('button.btn.btn-ghost', {
        onClick: function () { if (window.App && App.navigate) App.navigate('#/review'); }
      }, '查看錯題本')
    ));
  }

  // ---------------------------------------------------------------------
  // 主渲染分派
  // ---------------------------------------------------------------------

  function rerender() {
    if (!container) return;
    container.innerHTML = '';
    if (S.phase === 'setup') renderSetup();
    else if (S.phase === 'session') renderSession();
    else renderResult();
  }

  function render(containerEl, params) {
    container = containerEl;
    var settings = (window.Store && Store.get().settings) || {};
    var p = params || {};
    var initialPart = /^P[1-4]$/.test(p.part || '') ? p.part : 'P1';
    var parsedCount = parseInt(p.count, 10);
    var initialCount = isNaN(parsedCount) || parsedCount <= 0 ? 10 : parsedCount;

    S = {
      phase: 'setup',
      part: initialPart,
      count: initialCount,
      playCount: 1,
      rate: Util.clamp(settings.ttsRate || 1.0, 0.8, 1.2),
      showTranscriptAfter: true,
      units: [],
      index: 0,
      answers: {},
      playsUsedMap: {},
      isPlayingUnitId: null,
      playToken: 0,
      elapsedSec: 0,
      sceneExpanded: {},
      resultSummary: null,
      taskId: p.task || null,
      hasEnglishVoiceChecked: false,
      hasEnglishVoice: null
    };

    rerender();
  }

  function destroy() {
    stopTimer();
    if (window.TTS) TTS.stop();
    if (S) S.playToken = (S.playToken || 0) + 1;
    S = null;
    container = null;
  }

  window.Views = window.Views || {};
  window.Views.listening = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/vocab.js */
/**
 * js/views/vocab.js — TOEIC 30 天衝刺平台
 * 單字 SRS（Leitner 5 箱）：首頁統計 → 今日學習閃卡 → 小測 → 瀏覽單字。
 * 依 docs/API_ui.md（Util / CSS class）與 docs/API_infra.md（Store / SRS / TTS）。
 * 純 IIFE，暴露 window.Views.vocab = { render, destroy }。
 */
(function () {
  'use strict';

  var TOPIC_LABELS = {
    office: '辦公室', hr: '人資', finance: '財務', marketing: '行銷',
    travel: '旅遊', logistics: '物流', manufacturing: '製造', tech: '科技',
    real_estate: '不動產', dining: '餐飲', health: '健康', general: '一般'
  };
  var INTERVAL_LABELS = ['每日', '1 天後', '3 天後', '7 天後', '14 天後'];
  var DEFAULT_NEW_LIMIT = 20;
  var QUIZ_SIZE = 10;

  // ---- module 狀態（每次 render() 重建）----
  var viewContainer = null;
  var vocabList = [];
  var vocabMap = {};
  var viewState = null;
  var keydownHandler = null;

  // ---------------------------------------------------------------------
  // 資料準備
  // ---------------------------------------------------------------------

  function loadVocabData() {
    var list = (window.TOEIC_DATA && Array.isArray(window.TOEIC_DATA.vocab)) ? window.TOEIC_DATA.vocab : [];
    var map = {};
    list.forEach(function (w) { map[w.id] = w; });
    return { list: list, map: map };
  }

  function topicLabel(topic) {
    return TOPIC_LABELS[topic] || topic || '其他';
  }

  function ttsRate() {
    var s = Store.get();
    return (s && s.settings && typeof s.settings.ttsRate === 'number') ? s.settings.ttsRate : 1.0;
  }

  function speakText(text) {
    if (!text) return;
    TTS.speak(text, { rate: ttsRate() });
  }

  // ---------------------------------------------------------------------
  // render / destroy（view 契約）
  // ---------------------------------------------------------------------

  function render(container, params) {
    viewContainer = container;
    var data = loadVocabData();
    vocabList = data.list;
    vocabMap = data.map;

    params = params || {};
    var newLimitParam = parseInt(params.newWords, 10);

    viewState = {
      screen: 'home',
      taskId: params.task ? String(params.task) : null,
      newLimit: (isFinite(newLimitParam) && newLimitParam >= 0) ? newLimitParam : DEFAULT_NEW_LIMIT,
      session: null,
      quiz: null,
      browse: { topic: '', q: '' }
    };

    keydownHandler = handleKeydown;
    document.addEventListener('keydown', keydownHandler);

    renderScreen();
  }

  function destroy() {
    if (keydownHandler) {
      document.removeEventListener('keydown', keydownHandler);
      keydownHandler = null;
    }
    TTS.stop();
    viewContainer = null;
    viewState = null;
  }

  function handleKeydown(e) {
    if (!viewState || viewState.screen !== 'session') return;
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      toggleFlip();
      return;
    }
    if (!viewState.session || !viewState.session.flipped) return;
    if (e.key === '1') { e.preventDefault(); gradeCurrent(true); }
    else if (e.key === '2') { e.preventDefault(); gradeCurrent(false); }
  }

  // ---------------------------------------------------------------------
  // 畫面切換
  // ---------------------------------------------------------------------

  function renderScreen() {
    if (!viewContainer) return;
    viewContainer.innerHTML = '';
    if (!vocabList.length) {
      viewContainer.appendChild(buildEmptyState());
      return;
    }
    switch (viewState.screen) {
      case 'session': viewContainer.appendChild(buildSession()); break;
      case 'summary': viewContainer.appendChild(buildSummary()); break;
      case 'quiz': viewContainer.appendChild(buildQuizScreen()); break;
      case 'quizSummary': viewContainer.appendChild(buildQuizSummary()); break;
      case 'browse': viewContainer.appendChild(buildBrowse()); break;
      default: viewContainer.appendChild(buildHome());
    }
  }

  function goHome() {
    viewState.screen = 'home';
    viewState.session = null;
    viewState.quiz = null;
    renderScreen();
  }

  function buildEmptyState() {
    return Util.h('div.empty-state', {},
      Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, '📭'),
      Util.h('h2', {}, '尚無單字資料'),
      Util.h('p', {}, '單字資料檔尚未載入，請確認 data/vocab_*.js 是否存在。')
    );
  }

  // ---------------------------------------------------------------------
  // 首頁統計
  // ---------------------------------------------------------------------

  function buildHome() {
    var state = Store.get();
    var cards = state.vocab || {};
    var stats = SRS.stats(cards);
    var today = Util.todayISO();
    var dueCount = 0;
    var newAvailable = 0;
    vocabList.forEach(function (w) {
      var c = cards[w.id];
      if (c) { if (SRS.isDue(c, today)) dueCount += 1; }
      else { newAvailable += 1; }
    });

    var frag = Util.h('div', {},
      Util.h('div.view-header', {},
        Util.h('div.view-title', {},
          Util.h('h1', {}, '單字卡'),
          Util.h('p.view-subtitle', {}, 'Leitner 5 箱間隔複習 · 共 ' + vocabList.length + ' 個單字')
        )
      ),
      Util.h('div.stat-grid', {},
        Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, String(vocabList.length)), Util.h('div.stat-label', {}, '總字數')),
        Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, String(stats.total)), Util.h('div.stat-label', {}, '已學單字')),
        Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, String(dueCount)), Util.h('div.stat-label', {}, '今日待複習')),
        Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, String(newAvailable)), Util.h('div.stat-label', {}, '尚未學習'))
      ),
      buildBoxCard(stats),
      buildStartCard(dueCount, newAvailable),
      Util.h('div.card', {},
        Util.h('div.card-header', {}, Util.h('div', {}, Util.h('div.card-title', {}, '其他練習'))),
        Util.h('div.card-body', {}, '從已學過的單字抽考小測，或直接瀏覽整個單字庫。'),
        Util.h('div.card-actions', {},
          Util.h('button.btn.btn-ghost', { onClick: startQuiz }, '📝 單字小測'),
          Util.h('button.btn.btn-ghost', { onClick: startBrowse }, '🔎 瀏覽單字')
        )
      )
    );
    return frag;
  }

  function buildBoxCard(stats) {
    var rows = [1, 2, 3, 4, 5].map(function (box) {
      var count = stats['box' + box];
      var pct = Util.pct(count, vocabList.length || 1);
      return Util.h('div.u-mt-md', {},
        Util.h('div.u-flex.u-justify-between', {},
          Util.h('span', {}, '箱 ' + box + '（' + INTERVAL_LABELS[box - 1] + '）'),
          Util.h('span.u-text-muted', {}, String(count) + ' 字')
        ),
        Util.h('div.progress-bar', {},
          Util.h('div.progress-bar-fill', { style: { width: pct + '%' } })
        )
      );
    });
    return Util.h('div.card', {},
      Util.h('div.card-header', {}, Util.h('div', {}, Util.h('div.card-title', {}, '各箱單字數量'))),
      Util.h('div.card-body', {}, rows)
    );
  }

  function buildStartCard(dueCount, newAvailable) {
    var taskNote = viewState.taskId
      ? Util.h('p.field-hint', {}, '完成本次學習後會自動勾選今日任務。')
      : null;
    return Util.h('div.card', {},
      Util.h('div.card-header', {}, Util.h('div', {}, Util.h('div.card-title', {}, '開始今日學習'))),
      Util.h('div.card-body', {},
        Util.h('p', {}, '今日複習：' + dueCount + ' 字 · 可學新字：' + newAvailable + ' 字'),
        Util.h('div.field', {},
          Util.h('label.field-label', { for: 'vocabNewLimit' }, '今日新字上限'),
          Util.h('input.input', {
            id: 'vocabNewLimit', type: 'number', min: '0', max: '100', step: '1',
            value: String(viewState.newLimit)
          }),
          Util.h('p.field-hint', {}, '複習到期的單字一律排入，不受此上限限制。')
        ),
        taskNote
      ),
      Util.h('div.card-actions', {},
        Util.h('button.btn.btn-primary.btn-block', { onClick: onStartSessionClick }, '🚀 開始今日學習')
      )
    );
  }

  function onStartSessionClick() {
    var input = Util.$('#vocabNewLimit', viewContainer);
    var limit = input ? Util.clamp(parseInt(input.value, 10) || 0, 0, 999) : viewState.newLimit;
    viewState.newLimit = limit;

    var state = Store.get();
    var picked = SRS.pickSession({
      cards: state.vocab || {},
      allIds: vocabList.map(function (w) { return w.id; }),
      newLimit: limit,
      reviewLimit: Infinity
    });
    var ids = picked.reviewIds.concat(picked.newIds);
    if (!ids.length) {
      Util.toast('今天沒有待複習或新字了，太棒了！', 'success');
      return;
    }
    viewState.session = { ids: ids, index: 0, flipped: false, remembered: 0, forgot: 0 };
    viewState.screen = 'session';
    renderScreen();
  }

  // ---------------------------------------------------------------------
  // 閃卡 session
  // ---------------------------------------------------------------------

  function buildSession() {
    var s = viewState.session;
    // 卡片 id 於資料中找不到時（資料異動）略過，純迴圈不觸發額外 render
    while (s.index < s.ids.length && !vocabMap[s.ids[s.index]]) { s.index += 1; }
    if (s.index >= s.ids.length) {
      applySessionCompletion();
      return buildSummary();
    }
    var word = vocabMap[s.ids[s.index]];

    var total = s.ids.length;
    var pct = Util.pct(s.index, total);

    return Util.h('div', {},
      Util.h('div.view-header', {},
        Util.h('div.view-title', {}, Util.h('h1', {}, '今日學習')),
        Util.h('button.btn.btn-ghost.btn-sm', { onClick: goHome }, '‹ 回總覽')
      ),
      Util.h('div.u-mt-md', {},
        Util.h('div.u-flex.u-justify-between', {},
          Util.h('span.u-text-muted', {}, '第 ' + (s.index + 1) + ' / ' + total + ' 張'),
          Util.h('span.u-text-muted', {}, '記得 ' + s.remembered + ' · 不記得 ' + s.forgot)
        ),
        Util.h('div.progress-bar', {}, Util.h('div.progress-bar-fill', { style: { width: pct + '%' } }))
      ),
      buildFlashcard(word, s.flipped),
      Util.h('p.u-text-center.u-text-muted.u-mt-md', {}, '點卡片或按空白鍵翻面 · 按 1 記得 / 2 不記得'),
      Util.h('div.u-flex.u-gap-md.u-justify-between.u-mt-md', {},
        Util.h('button.btn.btn-danger.btn-block', { disabled: !s.flipped, onClick: function () { gradeCurrent(false); } }, '🙁 不記得（2）'),
        Util.h('button.btn.btn-primary.btn-block', { disabled: !s.flipped, onClick: function () { gradeCurrent(true); } }, '😀 記得（1）')
      )
    );
  }

  function buildFlashcard(word, flipped) {
    var front = Util.h('div.flashcard-front', {},
      Util.h('div.flashcard-word', {}, word.word),
      Util.h('div.flashcard-pos', {}, word.pos),
      Util.h('button.icon-btn', {
        'aria-label': '播放單字發音',
        onClick: function (e) { e.stopPropagation(); speakText(word.word); }
      }, '🔊')
    );
    var back = Util.h('div.flashcard-back', {},
      Util.h('div.flashcard-zh', {}, word.zh),
      Util.h('div.flashcard-example', {}, word.example),
      Util.h('div.flashcard-example.u-text-secondary', {}, word.example_zh),
      word.collocations && word.collocations.length
        ? Util.h('p.u-text-muted.u-mt-md', {}, '常見搭配：' + word.collocations.join('、'))
        : null,
      Util.h('button.icon-btn', {
        'aria-label': '播放例句發音',
        onClick: function (e) { e.stopPropagation(); speakText(word.example); }
      }, '🔊')
    );
    return Util.h('div.flashcard' + (flipped ? '.is-flipped' : ''), { onClick: toggleFlip },
      Util.h('div.flashcard-inner', {}, front, back)
    );
  }

  function toggleFlip() {
    if (!viewState.session) return;
    viewState.session.flipped = !viewState.session.flipped;
    renderScreen();
  }

  function gradeCurrent(correct) {
    var s = viewState.session;
    if (!s || !s.flipped) return;
    var id = s.ids[s.index];
    var state = Store.get();
    var card = (state.vocab && state.vocab[id]) || SRS.initCard();
    var updated = SRS.review(card, correct, Util.todayISO());
    Store.update(['vocab', id], updated);

    if (correct) s.remembered += 1; else s.forgot += 1;
    s.index += 1;
    s.flipped = false;

    if (s.index >= s.ids.length) {
      finishSession();
      return;
    }
    renderScreen();
  }

  function applySessionCompletion() {
    viewState.screen = 'summary';
    try { Store.touchStreak(); } catch (e) { /* 忽略非致命錯誤，維持畫面可用 */ }
    if (viewState.taskId) {
      Store.completeTask(viewState.taskId);
      Util.toast('今日單字任務已完成！', 'success');
    }
  }

  function finishSession() {
    applySessionCompletion();
    renderScreen();
  }

  function buildSummary() {
    var s = viewState.session;
    return Util.h('div', {},
      Util.h('div.view-header', {}, Util.h('div.view-title', {}, Util.h('h1', {}, '學習完成'))),
      Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, '🎉'),
        Util.h('h2', {}, '本次學習了 ' + s.ids.length + ' 個單字'),
        Util.h('p', {}, '記得 ' + s.remembered + ' 個 · 不記得 ' + s.forgot + ' 個，不記得的單字已排回箱 1。'),
        Util.h('button.btn.btn-primary', { onClick: goHome }, '回總覽')
      )
    );
  }

  // ---------------------------------------------------------------------
  // 小測
  // ---------------------------------------------------------------------

  function startQuiz() {
    var state = Store.get();
    var learnedIds = Object.keys(state.vocab || {}).filter(function (id) { return !!vocabMap[id]; });
    if (learnedIds.length < 4) {
      Util.toast('已學單字太少（至少需要 4 個），請先完成幾次今日學習。', 'warning');
      return;
    }
    var pickedIds = Util.sample(learnedIds, Math.min(QUIZ_SIZE, learnedIds.length));
    var questions = pickedIds.map(buildQuizQuestion);

    viewState.quiz = { questions: questions, index: 0, answered: false, correctCount: 0, wrongIds: [] };
    viewState.screen = 'quiz';
    renderScreen();
  }

  function buildQuizQuestion(id) {
    var word = vocabMap[id];
    var direction = Math.random() < 0.5 ? 'en2zh' : 'zh2en';
    var pool = vocabList.filter(function (w) { return w.id !== id; });
    var distractors = Util.sample(pool, 3);
    var candidates = distractors.concat([word]);
    var options = Util.shuffle(candidates.map(function (w) {
      return { text: direction === 'en2zh' ? w.zh : w.word, isCorrect: w.id === id };
    }));
    return { id: id, word: word, direction: direction, options: options };
  }

  function buildQuizScreen() {
    var q = viewState.quiz;
    var question = q.questions[q.index];
    var total = q.questions.length;
    var promptText = question.direction === 'en2zh'
      ? question.word.word + '（' + question.word.pos + '）'
      : question.word.zh;
    var promptLabel = question.direction === 'en2zh' ? '請選出正確的中文意思' : '請選出正確的英文單字';

    var optionButtons = question.options.map(function (opt, i) {
      var cls = 'option-btn';
      if (q.answered) {
        if (opt.isCorrect) cls += ' is-correct';
        else if (opt.selected) cls += ' is-incorrect';
      }
      return Util.h('button.' + cls.split(' ').join('.'), {
        disabled: q.answered,
        onClick: function () { answerQuiz(opt); }
      },
        Util.h('span.option-label', {}, String.fromCharCode(65 + i)),
        Util.h('span.option-text', {}, opt.text),
        q.answered && opt.isCorrect ? Util.h('span.option-mark', {}, '✓') : null,
        q.answered && opt.selected && !opt.isCorrect ? Util.h('span.option-mark', {}, '✗') : null
      );
    });

    return Util.h('div', {},
      Util.h('div.view-header', {},
        Util.h('div.view-title', {}, Util.h('h1', {}, '單字小測')),
        Util.h('button.btn.btn-ghost.btn-sm', { onClick: goHome }, '‹ 回總覽')
      ),
      Util.h('p.u-text-muted', {}, '第 ' + (q.index + 1) + ' / ' + total + ' 題 · 答對 ' + q.correctCount + ' 題'),
      Util.h('div.card', {},
        Util.h('div.card-body', {},
          Util.h('p.u-text-muted', {}, promptLabel),
          Util.h('h2', {}, promptText)
        )
      ),
      Util.h('div.option-list.u-mt-md', {}, optionButtons),
      q.answered
        ? Util.h('button.btn.btn-primary.btn-block.u-mt-md', { onClick: nextQuizQuestion }, q.index + 1 >= total ? '看結果' : '下一題')
        : null
    );
  }

  function answerQuiz(opt) {
    var q = viewState.quiz;
    if (q.answered) return;
    q.answered = true;
    opt.selected = true;

    var question = q.questions[q.index];
    if (opt.isCorrect) {
      q.correctCount += 1;
    } else {
      q.wrongIds.push(question.id);
      var state = Store.get();
      var card = (state.vocab && state.vocab[question.id]) || SRS.initCard();
      Store.update(['vocab', question.id], SRS.review(card, false, Util.todayISO()));
    }
    renderScreen();
  }

  function nextQuizQuestion() {
    var q = viewState.quiz;
    q.index += 1;
    if (q.index >= q.questions.length) {
      viewState.screen = 'quizSummary';
      try { Store.touchStreak(); } catch (e) { /* 忽略非致命錯誤 */ }
    } else {
      q.answered = false;
    }
    renderScreen();
  }

  function buildQuizSummary() {
    var q = viewState.quiz;
    var total = q.questions.length;
    var wrongWords = q.wrongIds.map(function (id) { return vocabMap[id]; }).filter(Boolean);

    return Util.h('div', {},
      Util.h('div.view-header', {}, Util.h('div.view-title', {}, Util.h('h1', {}, '小測結果'))),
      Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, q.correctCount === total ? '🏆' : '📝'),
        Util.h('h2', {}, '答對 ' + q.correctCount + ' / ' + total + ' 題'),
        Util.h('p', {}, '答錯的單字已降回箱 1，會提早安排複習。')
      ),
      wrongWords.length ? Util.h('div.card', {},
        Util.h('div.card-header', {}, Util.h('div', {}, Util.h('div.card-title', {}, '本次答錯的單字'))),
        Util.h('div.card-body', {}, wrongWords.map(function (w) {
          return Util.h('p', {}, w.word + '　' + w.zh);
        }))
      ) : null,
      Util.h('div.u-mt-md', {}, Util.h('button.btn.btn-primary', { onClick: goHome }, '回總覽'))
    );
  }

  // ---------------------------------------------------------------------
  // 瀏覽
  // ---------------------------------------------------------------------

  function startBrowse() {
    viewState.browse = { topic: '', q: '' };
    viewState.screen = 'browse';
    renderScreen();
  }

  function buildBrowse() {
    var topics = [];
    vocabList.forEach(function (w) { if (topics.indexOf(w.topic) === -1) topics.push(w.topic); });
    topics.sort();

    var resultsEl = Util.h('div.u-mt-md', {});

    var topicSelect = Util.h('select.select', {
      id: 'vocabTopicSelect',
      onChange: function (e) { viewState.browse.topic = e.target.value; renderBrowseResults(resultsEl); }
    },
      Util.h('option', { value: '' }, '全部主題'),
      topics.map(function (t) { return Util.h('option', { value: t }, topicLabel(t)); })
    );

    var searchInput = Util.h('input.input', {
      id: 'vocabSearchInput', type: 'search', placeholder: '搜尋英文單字或中文意思…',
      onInput: Util.debounce(function (e) {
        viewState.browse.q = e.target.value;
        renderBrowseResults(resultsEl);
      }, 250)
    });

    var frag = Util.h('div', {},
      Util.h('div.view-header', {},
        Util.h('div.view-title', {}, Util.h('h1', {}, '瀏覽單字')),
        Util.h('button.btn.btn-ghost.btn-sm', { onClick: goHome }, '‹ 回總覽')
      ),
      Util.h('div.u-flex.u-gap-md', {},
        Util.h('div.field', { style: { flex: '1 1 200px' } },
          Util.h('label.field-label', { for: 'vocabTopicSelect' }, '主題'), topicSelect),
        Util.h('div.field', { style: { flex: '2 1 260px' } },
          Util.h('label.field-label', { for: 'vocabSearchInput' }, '搜尋'), searchInput)
      ),
      resultsEl
    );
    renderBrowseResults(resultsEl);
    return frag;
  }

  function renderBrowseResults(resultsEl) {
    var topic = viewState.browse.topic;
    var q = viewState.browse.q.trim().toLowerCase();
    var filtered = vocabList.filter(function (w) {
      if (topic && w.topic !== topic) return false;
      if (!q) return true;
      return w.word.toLowerCase().indexOf(q) !== -1 || w.zh.toLowerCase().indexOf(q) !== -1;
    });

    resultsEl.innerHTML = '';
    if (!filtered.length) {
      resultsEl.appendChild(Util.h('div.empty-state', {},
        Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, '🔍'),
        Util.h('h2', {}, '沒有符合的單字'),
        Util.h('p', {}, '試試更換主題或搜尋關鍵字。')
      ));
      return;
    }

    var truncated = filtered.length > 300;
    var shown = truncated ? filtered.slice(0, 300) : filtered;
    var state = Store.get();
    var cards = state.vocab || {};

    var rows = shown.map(function (w) {
      var card = cards[w.id];
      var statusText = card ? ('箱 ' + card.box) : '尚未學習';
      return Util.h('tr', {},
        Util.h('td', {},
          Util.h('button.icon-btn', { 'aria-label': '播放發音', onClick: function () { speakText(w.word); } }, '🔊'),
          ' ' + w.word
        ),
        Util.h('td', {}, w.pos),
        Util.h('td', {}, w.zh),
        Util.h('td', {}, topicLabel(w.topic)),
        Util.h('td', {}, w.level === 'advanced' ? '進階' : '核心'),
        Util.h('td', {}, statusText)
      );
    });

    resultsEl.appendChild(Util.h('p.u-text-muted', {}, '共 ' + filtered.length + ' 筆' + (truncated ? '（僅顯示前 300 筆，請縮小搜尋範圍）' : '')));
    resultsEl.appendChild(Util.h('div.table-wrap', {},
      Util.h('table.table', {},
        Util.h('thead', {}, Util.h('tr', {},
          Util.h('th', {}, '單字'), Util.h('th', {}, '詞性'), Util.h('th', {}, '中文'),
          Util.h('th', {}, '主題'), Util.h('th', {}, '程度'), Util.h('th', {}, '狀態')
        )),
        Util.h('tbody', {}, rows)
      )
    ));
  }

  window.Views = window.Views || {};
  window.Views.vocab = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/mock.js */
/**
 * js/views/mock.js
 * 迷你模考頁：preset "mini"（P5×15 + P6×1 篇 + P7 single×2，25 分鐘）
 * 與 "half"（P5×30 + P6×2 + P7×5，含 double×1，55 分鐘），亦支援自訂。
 * 全程單一倒數計時器，時間到自動交卷；題目導覽格（答題卡風格：已答/未答/標記）；
 * 交卷後顯示總分、Part 正確率、用時 vs 建議配速，錯題寫入 wrongBook（Store.recordQuiz mode:'mock'）、
 * 弱點建議連到 #/tips?part=。
 * 暴露：window.Views.mock = { render(container, params), destroy() }
 * 依賴：window.Util、window.Store、window.TOEIC_DATA.p5/p6/p7（皆可能缺檔）。
 * 不 import js/views/quiz.js（尚未存在也不依賴其內部），P6/P7 呈現邏輯本檔自行實作。
 */
(function () {
  'use strict';

  var OPTION_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
  var PACE_SEC = { P5: 20, P6: 55, P7: 70 }; // 建議配速：每小題秒數
  var WEAKNESS_THRESHOLD = 75; // 正確率低於此百分比視為弱點

  var PRESETS = {
    mini: { key: 'mini', label: '迷你模考', desc: 'P5×15、P6×1 篇、P7 單篇×2', minutes: 25, p5: 15, p6: 1, p7: 2, p7Require: { single: 2 } },
    half: { key: 'half', label: '半回模考', desc: 'P5×30、P6×2 篇、P7×5（含雙篇 1）', minutes: 55, p5: 30, p6: 2, p7: 5, p7Require: { double: 1 } }
  };

  // -----------------------------------------------------------------
  // 模組狀態（每次 render() 重新初始化）
  // -----------------------------------------------------------------
  var container = null;
  var phase = 'setup'; // 'setup' | 'running' | 'result'
  var selectedPresetKey = 'mini';
  var customCfg = { p5: 15, p6: 1, p7: 2, minutes: 25 };
  var session = null; // 進行中的模考資料
  var result = null; // 交卷後的統計結果
  var taskId = null;
  var timerId = null;
  var timerTextEl = null;

  // -----------------------------------------------------------------
  // 資料存取 / 題組建構
  // -----------------------------------------------------------------

  function getData(part) {
    var d = window.TOEIC_DATA;
    if (!d || !Array.isArray(d[part])) return [];
    return d[part];
  }

  function pickP7(pool, total, requireTypes) {
    var chosen = [];
    var usedIds = {};
    Object.keys(requireTypes || {}).forEach(function (type) {
      var need = requireTypes[type];
      var candidates = Util.shuffle(pool.filter(function (it) { return it.type === type; }));
      for (var i = 0; i < need && i < candidates.length; i++) {
        if (!usedIds[candidates[i].id]) {
          chosen.push(candidates[i]);
          usedIds[candidates[i].id] = true;
        }
      }
    });
    var remaining = total - chosen.length;
    var order = ['single', 'double', 'triple'];
    for (var oi = 0; oi < order.length && remaining > 0; oi++) {
      var restCandidates = Util.shuffle(pool.filter(function (it) {
        return it.type === order[oi] && !usedIds[it.id];
      }));
      for (var j = 0; j < restCandidates.length && remaining > 0; j++) {
        chosen.push(restCandidates[j]);
        usedIds[restCandidates[j].id] = true;
        remaining -= 1;
      }
    }
    var rank = { single: 0, double: 1, triple: 2 };
    return chosen.sort(function (a, b) { return (rank[a.type] || 9) - (rank[b.type] || 9); });
  }

  function makeP5Group(q) {
    return {
      id: q.id, part: 'P5', title: null, passageText: null, passages: null,
      items: [{ uid: q.id, sourceId: q.id, part: 'P5', stem: q.stem, options: q.options, answer: q.answer, explanation_zh: q.explanation_zh }]
    };
  }

  function makeP6Group(p) {
    var items = (p.questions || []).map(function (q) {
      return {
        uid: p.id + '-q' + q.n, sourceId: p.id + '-q' + q.n, part: 'P6',
        stem: '第 ' + q.n + ' 格', options: q.options, answer: q.answer, explanation_zh: q.explanation_zh, markerN: q.n
      };
    });
    return { id: p.id, part: 'P6', title: p.title, passageText: p.passage, passages: null, items: items };
  }

  function makeP7Group(item) {
    var items = (item.questions || []).map(function (q, idx) {
      var n = idx + 1;
      return {
        uid: item.id + '-q' + n, sourceId: item.id + '-q' + n, part: 'P7',
        stem: q.q, options: q.options, answer: q.answer, explanation_zh: q.explanation_zh, skill: q.skill
      };
    });
    var typeLabel = item.type === 'double' ? '雙篇' : (item.type === 'triple' ? '三篇' : '單篇');
    return { id: item.id, part: 'P7', title: typeLabel + '閱讀', passageText: null, passages: item.passages, items: items };
  }

  function buildSession(cfg) {
    var p5Pool = getData('p5');
    var p6Pool = getData('p6');
    var p7Pool = getData('p7');

    var groups = []
      .concat(Util.sample(p5Pool, cfg.p5).map(makeP5Group))
      .concat(Util.sample(p6Pool, cfg.p6).map(makeP6Group))
      .concat(pickP7(p7Pool, cfg.p7, cfg.p7Require || {}).map(makeP7Group));

    var items = [];
    groups.forEach(function (g, gi) {
      g.items.forEach(function (it, ii) {
        it.groupIndex = gi;
        it.indexInGroup = ii;
        it.number = items.length + 1;
        items.push(it);
      });
    });

    var suggestedSeconds = items.reduce(function (sum, it) { return sum + (PACE_SEC[it.part] || 30); }, 0);

    return {
      groups: groups, items: items, total: items.length, suggestedSeconds: suggestedSeconds,
      availability: { p5: p5Pool.length, p6: p6Pool.length, p7: p7Pool.length }
    };
  }

  function currentConfig() {
    if (selectedPresetKey === 'custom') {
      return {
        key: 'custom', label: '自訂模考',
        minutes: Util.clamp(customCfg.minutes, 5, 180),
        p5: Util.clamp(customCfg.p5, 0, 200), p6: Util.clamp(customCfg.p6, 0, 20), p7: Util.clamp(customCfg.p7, 0, 20),
        p7Require: {}
      };
    }
    var p = PRESETS[selectedPresetKey] || PRESETS.mini;
    return { key: p.key, label: p.label, minutes: p.minutes, p5: p.p5, p6: p.p6, p7: p.p7, p7Require: p.p7Require };
  }

  // -----------------------------------------------------------------
  // 動作
  // -----------------------------------------------------------------

  function goTo(hash) {
    if (window.App && typeof window.App.navigate === 'function') window.App.navigate(hash);
    else window.location.hash = hash;
  }

  function updateSession(patch) {
    session = Object.assign({}, session, patch);
  }

  function onStartClick() {
    var cfg = currentConfig();
    var built = buildSession(cfg);
    if (built.total === 0) {
      Util.toast('目前沒有可用的題目可以開始模考，請確認 data/questions_*.js 已正確載入。', 'error');
      return;
    }
    session = {
      config: cfg, groups: built.groups, items: built.items, suggestedSeconds: built.suggestedSeconds,
      durationSec: cfg.minutes * 60, remainingSec: cfg.minutes * 60, startedAt: Date.now(),
      currentGroupIndex: 0, answers: {}, marked: {}
    };
    result = null;
    phase = 'running';
    renderAll();
    startTimer();
  }

  function selectAnswer(uid, idx) {
    var answers = Object.assign({}, session.answers);
    answers[uid] = idx;
    updateSession({ answers: answers });
    renderAll();
  }

  function toggleMark(uid) {
    var marked = Object.assign({}, session.marked);
    marked[uid] = !marked[uid];
    updateSession({ marked: marked });
    renderAll();
  }

  function goToGroup(idx) {
    updateSession({ currentGroupIndex: Util.clamp(idx, 0, session.groups.length - 1) });
    renderAll();
  }

  function confirmSubmit() {
    var unanswered = session.items.length - Object.keys(session.answers).length;
    var body = unanswered > 0
      ? ('尚有 ' + unanswered + ' 題未作答，確定要交卷嗎？交卷後將無法修改答案。')
      : '確定要交卷嗎？交卷後將無法修改答案。';
    Util.modal({
      title: '交卷確認',
      body: body,
      actions: [
        { label: '取消', class: 'btn btn-ghost' },
        { label: '確定交卷', class: 'btn btn-primary', onClick: function (close) { close(); finishExam(false); } }
      ]
    });
  }

  function finishExam(auto) {
    stopTimer();
    if (!session) return;

    var elapsedRaw = Math.floor((Date.now() - session.startedAt) / 1000);
    var elapsed = Math.min(session.durationSec, Math.max(0, elapsedRaw));
    var partStats = {};
    var wrongIds = [];
    var correctCount = 0;

    session.items.forEach(function (it) {
      var stat = partStats[it.part] || { correct: 0, total: 0 };
      stat.total += 1;
      var picked = session.answers.hasOwnProperty(it.uid) ? session.answers[it.uid] : null;
      if (picked !== null && picked === it.answer) {
        stat.correct += 1;
        correctCount += 1;
      } else {
        wrongIds.push(it.sourceId);
      }
      partStats[it.part] = stat;
    });

    var newState = null;
    if (window.Store && typeof Store.recordQuiz === 'function') {
      try {
        newState = Store.recordQuiz({
          mode: 'mock', part: '', total: session.items.length, correct: correctCount, seconds: elapsed, wrongIds: wrongIds
        });
      } catch (e) {
        Util.toast('紀錄成績時發生錯誤：' + e.message, 'error');
      }
    }
    if (taskId && window.Store && typeof Store.completeTask === 'function') {
      try { Store.completeTask(taskId); } catch (e) { /* 忽略：任務勾選失敗不影響交卷結果 */ }
    }

    result = {
      total: session.items.length, correct: correctCount, seconds: elapsed,
      suggestedSeconds: session.suggestedSeconds, partStats: partStats, auto: !!auto,
      streak: newState ? newState.streak : null
    };

    phase = 'result';
    renderAll();
    Util.toast(auto ? '時間到，已自動交卷' : '交卷成功', 'success');
  }

  // -----------------------------------------------------------------
  // 計時器
  // -----------------------------------------------------------------

  function startTimer() {
    stopTimer();
    timerId = setInterval(tick, 1000);
    document.addEventListener('visibilitychange', onVisibilityChange);
  }

  function stopTimer() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
    document.removeEventListener('visibilitychange', onVisibilityChange);
  }

  function onVisibilityChange() {
    if (document.visibilityState === 'visible') tick();
  }

  function tick() {
    if (!session) { stopTimer(); return; }
    var remaining = Math.max(0, session.durationSec - Math.floor((Date.now() - session.startedAt) / 1000));
    updateSession({ remainingSec: remaining });
    if (timerTextEl && timerTextEl.isConnected) {
      timerTextEl.textContent = Util.fmtTime(remaining);
      timerTextEl.style.color = remaining <= 60 ? 'var(--color-danger)' : '';
    }
    if (remaining <= 0) finishExam(true);
  }

  // -----------------------------------------------------------------
  // UI：設定畫面
  // -----------------------------------------------------------------

  function emptyState() {
    return Util.h('div.empty-state', {},
      Util.h('div.empty-state-icon', { 'aria-hidden': 'true' }, '🎯'),
      Util.h('h2', {}, '目前沒有可用的題庫'),
      Util.h('p', {}, '找不到 P5 / P6 / P7 題目資料，請確認 data/questions_*.js 已正確載入後再重新整理。')
    );
  }

  function renderPresetCard(key, label, desc) {
    var isSelected = selectedPresetKey === key;
    var style = isSelected ? { boxShadow: '0 0 0 2px var(--color-primary)' } : {};
    return Util.h('div.card.card-clickable', {
      style: style,
      onClick: function () { selectedPresetKey = key; renderAll(); }
    },
      Util.h('div.card-header', {},
        Util.h('div', {}, Util.h('div.card-title', {}, label), Util.h('div.card-subtitle', {}, desc)),
        isSelected ? Util.h('span.badge.badge-primary', {}, '已選擇') : null
      )
    );
  }

  function renderCustomFields() {
    if (selectedPresetKey !== 'custom') return null;
    return Util.h('div.card', {},
      Util.h('div.card-body', {},
        Util.h('div.field', {},
          Util.h('label.field-label', { for: 'mockP5' }, 'P5 題數'),
          Util.h('input.input', { id: 'mockP5', type: 'number', min: '0', step: '1', value: customCfg.p5, onInput: function (e) { customCfg.p5 = toPosInt(e.target.value, customCfg.p5); } })
        ),
        Util.h('div.field', {},
          Util.h('label.field-label', { for: 'mockP6' }, 'P6 篇數'),
          Util.h('input.input', { id: 'mockP6', type: 'number', min: '0', step: '1', value: customCfg.p6, onInput: function (e) { customCfg.p6 = toPosInt(e.target.value, customCfg.p6); } })
        ),
        Util.h('div.field', {},
          Util.h('label.field-label', { for: 'mockP7' }, 'P7 組數'),
          Util.h('input.input', { id: 'mockP7', type: 'number', min: '0', step: '1', value: customCfg.p7, onInput: function (e) { customCfg.p7 = toPosInt(e.target.value, customCfg.p7); } })
        ),
        Util.h('div.field', {},
          Util.h('label.field-label', { for: 'mockMinutes' }, '時限（分鐘）'),
          Util.h('input.input', { id: 'mockMinutes', type: 'number', min: '5', step: '5', value: customCfg.minutes, onInput: function (e) { customCfg.minutes = toPosInt(e.target.value, customCfg.minutes); } }),
          Util.h('p.field-hint', {}, '題數若超過題庫可用量，會自動取可用的全部題目。')
        )
      )
    );
  }

  function toPosInt(v, fallback) {
    var n = parseInt(v, 10);
    return (isNaN(n) || n < 0) ? fallback : n;
  }

  function renderSetup() {
    var avail = { p5: getData('p5').length, p6: getData('p6').length, p7: getData('p7').length };

    if (avail.p5 === 0 && avail.p6 === 0 && avail.p7 === 0) {
      container.appendChild(emptyState());
      return;
    }

    container.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, '迷你模考'),
        Util.h('p.view-subtitle', {}, '選擇模考規模，計時開始後全程只有一個倒數計時器，時間到會自動交卷。')
      )
    ));

    container.appendChild(Util.h('p.u-text-muted', {}, '目前題庫可用量：P5 ' + avail.p5 + ' 題 · P6 ' + avail.p6 + ' 篇 · P7 ' + avail.p7 + ' 組'));

    var grid = Util.h('div', { style: { display: 'grid', gap: '12px', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))' } },
      renderPresetCard('mini', PRESETS.mini.label + '（25 分鐘）', PRESETS.mini.desc),
      renderPresetCard('half', PRESETS.half.label + '（55 分鐘）', PRESETS.half.desc),
      renderPresetCard('custom', '自訂模考', '自行設定各 Part 題數與時限')
    );
    container.appendChild(Util.h('div.u-mt-md', {}, grid));

    var custom = renderCustomFields();
    if (custom) container.appendChild(Util.h('div.u-mt-md', {}, custom));

    container.appendChild(Util.h('div.u-mt-md.u-flex.u-justify-between.u-items-center', {},
      Util.h('p.u-text-muted', {}, '作答期間可用題目導覽格跳題、標記待複查的題目。'),
      Util.h('button.btn.btn-primary', { type: 'button', onClick: onStartClick }, '開始模考 ▶')
    ));
  }

  // -----------------------------------------------------------------
  // UI：作答畫面
  // -----------------------------------------------------------------

  function renderNavigator() {
    var grid = Util.h('div.day-grid', {});
    session.items.forEach(function (it) {
      var answered = session.answers.hasOwnProperty(it.uid);
      var marked = !!session.marked[it.uid];
      var isCurrentGroup = it.groupIndex === session.currentGroupIndex;
      var cls = [];
      if (isCurrentGroup) cls.push('is-today');
      else if (marked) cls.push('is-partial');
      else if (answered) cls.push('is-done');
      else cls.push('is-future');

      grid.appendChild(Util.h('button.calendar-cell', {
        type: 'button',
        class: cls.join(' '),
        'aria-label': '第 ' + it.number + ' 題' + (answered ? '（已作答）' : '（未作答）') + (marked ? '（已標記）' : ''),
        onClick: function () { goToGroup(it.groupIndex); }
      },
        Util.h('span.cell-day', {}, String(it.number)),
        Util.h('span.cell-label', {}, marked ? '🚩 標記' : (answered ? '已答' : '未答'))
      ));
    });
    return grid;
  }

  function renderOptions(it) {
    var list = Util.h('div.option-list', {});
    var selected = session.answers.hasOwnProperty(it.uid) ? session.answers[it.uid] : null;
    (it.options || []).forEach(function (opt, idx) {
      list.appendChild(Util.h('button.option-btn', {
        type: 'button',
        class: selected === idx ? 'is-selected' : '',
        onClick: function () { selectAnswer(it.uid, idx); }
      },
        Util.h('span.option-label', {}, OPTION_LETTERS[idx] || String(idx + 1)),
        Util.h('span.option-text', {}, opt)
      ));
    });
    return list;
  }

  function renderQuestionBlock(it, stemText) {
    var marked = !!session.marked[it.uid];
    var row = Util.h('div', { style: { display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: '10px', marginBottom: '8px' } },
      Util.h('p', { style: { fontWeight: '600', margin: '0' } }, stemText),
      Util.h('button.btn.btn-ghost.btn-sm', {
        type: 'button', 'aria-pressed': marked ? 'true' : 'false',
        onClick: function () { toggleMark(it.uid); }
      }, marked ? '🚩 取消標記' : '🏳️ 標記待查')
    );
    return Util.h('div', { style: { marginTop: '14px' } }, row, renderOptions(it));
  }

  function renderGroupBody(group) {
    var body = Util.h('div.card-body', {});

    if (group.part === 'P5') {
      body.appendChild(renderQuestionBlock(group.items[0], group.items[0].stem));
    } else if (group.part === 'P6') {
      body.appendChild(Util.h('div.u-text-secondary', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.7' } }, group.passageText || ''));
      group.items.forEach(function (it) { body.appendChild(renderQuestionBlock(it, it.stem)); });
    } else {
      (group.passages || []).forEach(function (p) {
        body.appendChild(Util.h('div.card', { style: { background: 'var(--color-surface-alt)', marginBottom: '10px' } },
          Util.h('div.card-header', {}, Util.h('div.card-title', {}, p.title || p.kind || '')),
          Util.h('div.card-body', { style: { whiteSpace: 'pre-wrap', lineHeight: '1.7' } }, p.text || '')
        ));
      });
      group.items.forEach(function (it, idx) { body.appendChild(renderQuestionBlock(it, (idx + 1) + '. ' + it.stem)); });
    }

    return Util.h('div.card', {},
      Util.h('div.card-header', {},
        Util.h('div', {}, Util.h('div.card-title', {}, group.title || (group.part + ' 文法填空')), Util.h('div.card-subtitle', {}, group.part + (group.part === 'P5' ? '' : '（共 ' + group.items.length + ' 題）')))
      ),
      body
    );
  }

  function renderRunning() {
    var group = session.groups[session.currentGroupIndex];
    var answeredCount = Object.keys(session.answers).length;
    var total = session.items.length;

    timerTextEl = Util.h('span', {}, Util.fmtTime(session.remainingSec));
    if (session.remainingSec <= 60) timerTextEl.style.color = 'var(--color-danger)';

    container.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, session.config.label),
        Util.h('p.view-subtitle', {}, '已答 ' + answeredCount + ' / ' + total + ' 題')
      ),
      Util.h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
        Util.h('div.pill.pill-countdown', {}, Util.h('span', { 'aria-hidden': 'true' }, '⏱️ '), timerTextEl),
        Util.h('button.btn.btn-primary', { type: 'button', onClick: confirmSubmit }, '交卷')
      )
    ));

    container.appendChild(Util.h('div.progress-bar', { style: { marginBottom: '14px' } },
      Util.h('div.progress-bar-fill', { style: { width: Util.pct(answeredCount, total) + '%' } })
    ));

    container.appendChild(renderNavigator());

    container.appendChild(Util.h('div.u-mt-md', {}, renderGroupBody(group)));

    container.appendChild(Util.h('div.u-mt-md.u-flex.u-justify-between', {},
      Util.h('button.btn.btn-ghost', {
        type: 'button', disabled: session.currentGroupIndex <= 0,
        onClick: function () { goToGroup(session.currentGroupIndex - 1); }
      }, '⬅ 上一組'),
      Util.h('button.btn.btn-ghost', {
        type: 'button', disabled: session.currentGroupIndex >= session.groups.length - 1,
        onClick: function () { goToGroup(session.currentGroupIndex + 1); }
      }, '下一組 ➡')
    ));
  }

  // -----------------------------------------------------------------
  // UI：結果畫面
  // -----------------------------------------------------------------

  function weaknessParts(partStats) {
    return Object.keys(partStats).map(function (p) {
      var s = partStats[p];
      return { part: p, total: s.total, correct: s.correct, pct: Util.pct(s.correct, s.total) };
    }).filter(function (p) { return p.total > 0 && p.pct < WEAKNESS_THRESHOLD; })
      .sort(function (a, b) { return a.pct - b.pct; });
  }

  function buildWeaknessCard(weak) {
    if (!weak.length) {
      return Util.h('div.card', {}, Util.h('div.card-body', {}, Util.h('p', {}, '🎉 各 Part 正確率都不錯，維持這個節奏！')));
    }
    var body = Util.h('div.card-body', {});
    weak.forEach(function (w) {
      body.appendChild(Util.h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', padding: '8px 0', borderBottom: '1px solid var(--color-border)' } },
        Util.h('span', {}, w.part + ' 正確率 ' + w.pct + '%（' + w.correct + '/' + w.total + '）'),
        Util.h('button.btn.btn-ghost.btn-sm', { type: 'button', onClick: function () { goTo('#/tips?part=' + encodeURIComponent(w.part)); } }, '看技巧建議')
      ));
    });
    return Util.h('div.card', {}, Util.h('div.card-header', {}, Util.h('div.card-title', {}, '弱點建議')), body);
  }

  function renderWrongReview() {
    var wrongItems = session.items.filter(function (it) {
      var picked = session.answers.hasOwnProperty(it.uid) ? session.answers[it.uid] : null;
      return picked !== it.answer;
    });
    if (!wrongItems.length) {
      return Util.h('div.empty-state', {}, Util.h('div.empty-state-icon', {}, '🎉'), Util.h('h2', {}, '全部答對！'), Util.h('p', {}, '這次模考沒有錯題，太厲害了。'));
    }
    var wrap = Util.h('div', {});
    wrongItems.forEach(function (it) {
      var picked = session.answers.hasOwnProperty(it.uid) ? session.answers[it.uid] : null;
      var list = Util.h('div.option-list', {});
      (it.options || []).forEach(function (opt, idx) {
        var cls = idx === it.answer ? 'is-correct' : (idx === picked ? 'is-incorrect' : '');
        list.appendChild(Util.h('button.option-btn', { type: 'button', class: cls, disabled: true },
          Util.h('span.option-label', {}, OPTION_LETTERS[idx] || String(idx + 1)),
          Util.h('span.option-text', {}, opt),
          idx === it.answer ? Util.h('span.option-mark', {}, '✓') : (idx === picked ? Util.h('span.option-mark', {}, '✗') : null)
        ));
      });
      wrap.appendChild(Util.h('div.card', { style: { marginBottom: '12px' } },
        Util.h('div.card-header', {},
          Util.h('div.card-title', {}, it.part + ' · ' + it.sourceId),
          picked === null ? Util.h('span.badge.badge-warning', {}, '未作答') : null
        ),
        Util.h('div.card-body', {},
          Util.h('p', { style: { fontWeight: '600' } }, it.stem),
          list,
          Util.h('p.u-text-muted', { style: { marginTop: '8px' } }, '解析：' + (it.explanation_zh || '（無）'))
        )
      ));
    });
    return wrap;
  }

  function paceBadge(usedSec, suggestedSec) {
    var diff = usedSec - suggestedSec;
    if (diff <= 0) return Util.h('span.badge.badge-success', {}, '比建議配速快 ' + Util.fmtTime(-diff));
    return Util.h('span.badge.badge-warning', {}, '比建議配速慢 ' + Util.fmtTime(diff));
  }

  function renderResult() {
    var pct = Util.pct(result.correct, result.total);

    container.appendChild(Util.h('div.view-header', {},
      Util.h('div.view-title', {},
        Util.h('h1', {}, '模考結果'),
        Util.h('p.view-subtitle', {}, session.config.label + (result.auto ? '（時間到自動交卷）' : ''))
      )
    ));

    container.appendChild(Util.h('div.stat-grid', {},
      Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, pct + '%'), Util.h('div.stat-label', {}, '總正確率')),
      Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, result.correct + '/' + result.total), Util.h('div.stat-label', {}, '答對題數')),
      Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, Util.fmtTime(result.seconds)), Util.h('div.stat-label', {}, '實際用時')),
      Util.h('div.stat-card', {}, Util.h('div.stat-value', {}, Util.fmtTime(result.suggestedSeconds)), Util.h('div.stat-label', {}, '建議用時'))
    ));

    container.appendChild(Util.h('div.u-mt-md.u-text-center', {}, paceBadge(result.seconds, result.suggestedSeconds)));

    var tableWrap = Util.h('div.table-wrap', { style: { marginTop: '16px' } });
    var table = Util.h('table.table', {},
      Util.h('thead', {}, Util.h('tr', {}, Util.h('th', {}, 'Part'), Util.h('th', {}, '對/共'), Util.h('th', {}, '正確率')))
    );
    var tbody = Util.h('tbody', {});
    Object.keys(result.partStats).sort().forEach(function (p) {
      var s = result.partStats[p];
      tbody.appendChild(Util.h('tr', {},
        Util.h('td', {}, p), Util.h('td', {}, s.correct + '/' + s.total), Util.h('td', {}, Util.pct(s.correct, s.total) + '%')
      ));
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    container.appendChild(tableWrap);

    container.appendChild(Util.h('div.u-mt-md', {}, buildWeaknessCard(weaknessParts(result.partStats))));

    container.appendChild(Util.h('div.u-mt-md.u-flex.u-gap-sm', { style: { flexWrap: 'wrap' } },
      Util.h('button.btn.btn-primary', { type: 'button', onClick: function () { phase = 'setup'; session = null; result = null; renderAll(); } }, '再考一次'),
      Util.h('button.btn.btn-ghost', { type: 'button', onClick: function () { goTo('#/review'); } }, '查看錯題本'),
      Util.h('button.btn.btn-ghost', { type: 'button', onClick: function () { goTo('#/dashboard'); } }, '回到儀表板')
    ));

    container.appendChild(Util.h('h2.u-mt-md', {}, '錯題詳解'));
    container.appendChild(renderWrongReview());
  }

  // -----------------------------------------------------------------
  // 渲染主流程 / Views 契約
  // -----------------------------------------------------------------

  function renderAll() {
    if (!container) return;
    container.innerHTML = '';
    timerTextEl = null;
    if (phase === 'running' && session) renderRunning();
    else if (phase === 'result' && result) renderResult();
    else renderSetup();
  }

  function render(containerEl, params) {
    container = containerEl;
    taskId = (params && params.task) || null;
    var presetParam = params && params.preset;
    if (presetParam === 'mini' || presetParam === 'half') selectedPresetKey = presetParam;
    else if (!PRESETS[selectedPresetKey]) selectedPresetKey = 'mini';
    phase = 'setup';
    session = null;
    result = null;
    renderAll();
  }

  function destroy() {
    stopTimer();
    if (window.TTS && typeof TTS.stop === 'function') TTS.stop();
    timerTextEl = null;
    container = null;
  }

  window.Views = window.Views || {};
  window.Views.mock = { render: render, destroy: destroy };
})();

</script>
<script>
/* js/views/review.js */
/**
 * js/views/review.js — 錯題本（#/review）
 *
 * 合併 Store.wrongBook 與 p5/p6/p7/listening 各題資料（依 id 前綴 p5-/p6-/p7-/l1-/l2-/l3-/l4- 查表）。
 *
 * 三層檢討法（本頁的核心流程）：
 *   第一層「為什麼錯」— 每題標記錯因（單字／文法／看錯／沒時間／用猜的），統計出主要失分型態
 *   第二層「重做一次」— Leitner 排程：答對往上一箱（1→2→4→7→14 天後再見），答錯退回第 1 箱明天再見
 *   第三層「排進複習」— 只有連續答對到第 5 箱才算精通，避免「看過解析就以為會了」
 *
 * 提供：今日到期佇列、Part / 錯因 / 未精通篩選、排序、錯因與考點分佈圖、
 * 查看詳解（含聽力逐字稿 + TTS）、單題或整批重做。
 * params.task 存在時，進入頁面即視為完成當日任務；params.due=1 時預設只看今日到期。
 * 純 IIFE，暴露 window.Views.review = { render, destroy }。
 */
(function () {
  'use strict';

  var LETTERS = ['A', 'B', 'C', 'D'];

  // 與 store.js 的 WRONG_INTERVAL_DAYS 對應，只用於顯示文案
  var BOX_LABELS = ['第 1 箱', '第 2 箱', '第 3 箱', '第 4 箱', '已精通'];

  var PART_INFO = {
    p5: { short: 'P5', label: 'P5 單句填空', listening: false,
      data: function () { return (window.TOEIC_DATA && window.TOEIC_DATA.p5) || []; } },
    p6: { short: 'P6', label: 'P6 段落填空', listening: false,
      data: function () { return (window.TOEIC_DATA && window.TOEIC_DATA.p6) || []; } },
    p7: { short: 'P7', label: 'P7 閱讀理解', listening: false,
      data: function () { return (window.TOEIC_DATA && window.TOEIC_DATA.p7) || []; } },
    l1: { short: 'P1', label: 'P1 照片描述（聽力）', listening: true,
      data: function () { return (window.TOEIC_DATA && window.TOEIC_DATA.listening && window.TOEIC_DATA.listening.p1) || []; } },
    l2: { short: 'P2', label: 'P2 應答問題（聽力）', listening: true,
      data: function () { return (window.TOEIC_DATA && window.TOEIC_DATA.listening && window.TOEIC_DATA.listening.p2) || []; } },
    l3: { short: 'P3', label: 'P3 簡短對話（聽力）', listening: true,
      data: function () { return (window.TOEIC_DATA && window.TOEIC_DATA.listening && window.TOEIC_DATA.listening.p3) || []; } },
    l4: { short: 'P4', label: 'P4 簡短獨白（聽力）', listening: true,
      data: function () { return (window.TOEIC_DATA && window.TOEIC_DATA.listening && window.TOEIC_DATA.listening.p4) || []; } }
  };
  var PART_FILTER_CODES = ['all', 'P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7'];
  var SORT_OPTIONS = [
    { code: 'due_asc', label: '複習排程：先到期的優先' },
    { code: 'count_desc', label: '錯誤次數：多 → 少' },
    { code: 'time_desc', label: '最後作答：新 → 舊' }
  ];

  function reasonDefs() {
    return (window.TOEIC_DATA && window.TOEIC_DATA.reading && window.TOEIC_DATA.reading.reasons) || [];
  }

  function reasonDef(code) {
    var defs = reasonDefs();
    for (var i = 0; i < defs.length; i++) {
      if (defs[i].code === code) return defs[i];
    }
    return null;
  }

  /** 把 store 的 wrongBook 項目補齊欄位；Store 較舊時退回本地預設值 */
  function normalizeEntry(rec, today) {
    if (window.Store && typeof Store.normalizeWrongEntry === 'function') {
      return Store.normalizeWrongEntry(rec, today);
    }
    rec = rec || {};
    return {
      count: rec.count || 0, lastAt: rec.lastAt || null, mastered: !!rec.mastered,
      box: rec.box || 1, due: rec.due || today, reason: rec.reason || '',
      reviews: rec.reviews || 0, rights: rec.rights || 0
    };
  }

  // ---- module-level 狀態（每次 render() 重新建立） ----
  var S = null;
  var container = null;

  // -----------------------------------------------------------------------
  // 小工具
  // -----------------------------------------------------------------------

  function stripLetterPrefix(s) {
    return String(s || '').replace(/^[A-D][.).:]?\s+/, '');
  }

  function idPrefixKind(id) {
    var m = /^(p5|p6|p7|l1|l2|l3|l4)-/.exec(String(id || ''));
    return m ? m[1] : null;
  }

  function fmtLastAt(iso) {
    if (!iso) return '—';
    var datePart = String(iso).slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(datePart)) return String(iso);
    try { return Util.fmtDate(datePart, { weekday: false }); } catch (e) { return datePart; }
  }

  function summaryText(entry, fallbackId) {
    if (!entry) return '（找不到題目資料：' + fallbackId + '）';
    var s = String(entry.summary || '').replace(/\s+/g, ' ').trim();
    if (s.length > 60) s = s.slice(0, 60) + '…';
    return s || '（無題目摘要）';
  }

  // -----------------------------------------------------------------------
  // 題目資料整形：把各來源資料整理成統一的 entry 結構
  // -----------------------------------------------------------------------

  function buildEntry(id) {
    var kind = idPrefixKind(id);
    if (!kind) return null;
    var info = PART_INFO[kind];
    var subMatch = /-q(\d+)$/.exec(id);
    var subIndex = subMatch ? parseInt(subMatch[1], 10) : null;
    var parentId = subMatch ? id.slice(0, id.length - subMatch[0].length) : id;
    var arr = info.data();
    var parent = null;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === parentId) { parent = arr[i]; break; }
    }
    if (!parent) return null;

    if (kind === 'p5') {
      return {
        id: id, partShort: info.short, partLabel: info.label, listening: false,
        summary: parent.stem, stemNode: parent.stem,
        options: parent.options || [], answer: parent.answer, explanation_zh: parent.explanation_zh,
        category: info.short + '·' + (parent.tag || 'other')
      };
    }
    if (kind === 'p6') {
      var qs6 = parent.questions || [];
      var q6 = null;
      if (subIndex !== null) {
        q6 = qs6.filter(function (x) { return x.n === subIndex; })[0] || qs6[subIndex - 1] || null;
      } else {
        q6 = qs6[0] || null;
      }
      if (!q6) return null;
      return {
        id: id, partShort: info.short, partLabel: info.label, listening: false,
        summary: (parent.title || parent.id) + '（第 ' + (q6.n || subIndex || 1) + ' 格）',
        passageText: parent.passage, passageTitle: parent.title,
        options: q6.options || [], answer: q6.answer, explanation_zh: q6.explanation_zh,
        category: info.short + '·' + (q6.type || 'other')
      };
    }
    if (kind === 'p7') {
      var qs7 = parent.questions || [];
      var q7 = subIndex !== null ? (qs7[subIndex - 1] || null) : (qs7[0] || null);
      if (!q7) return null;
      return {
        id: id, partShort: info.short, partLabel: info.label, listening: false,
        summary: q7.q, stemNode: q7.q, passages: parent.passages || [],
        options: q7.options || [], answer: q7.answer, explanation_zh: q7.explanation_zh,
        category: info.short + '·' + (q7.skill || 'other')
      };
    }
    if (kind === 'l1') {
      var stmts = (parent.statements || []).map(stripLetterPrefix);
      return {
        id: id, partShort: info.short, partLabel: info.label, listening: true,
        summary: parent.scene_zh || '照片描述', sceneText: parent.scene_zh, sceneEn: parent.scene_en,
        options: stmts, answer: parent.answer, explanation_zh: parent.explanation_zh,
        category: info.short,
        transcriptLines: stmts.map(function (s, i) { return LETTERS[i] + '. ' + s; }),
        ttsItems: stmts.map(function (t, i) { return { text: LETTERS[i] + '. ' + t, pauseMs: 400 }; })
      };
    }
    if (kind === 'l2') {
      var resp = (parent.responses || []).map(stripLetterPrefix);
      var l2Items = [{ text: parent.question, pauseMs: 500 }];
      resp.forEach(function (t, i) { l2Items.push({ text: LETTERS[i] + '. ' + t, pauseMs: 300 }); });
      return {
        id: id, partShort: info.short, partLabel: info.label, listening: true,
        summary: parent.question, stemNode: parent.question,
        options: resp, answer: parent.answer, explanation_zh: parent.explanation_zh,
        category: info.short + (parent.trap ? ('·' + parent.trap) : ''),
        transcriptLines: ['Q: ' + parent.question].concat(resp.map(function (t, i) { return LETTERS[i] + '. ' + t; })),
        ttsItems: l2Items
      };
    }
    // l3 / l4
    var qsL = parent.questions || [];
    var qL = subIndex !== null ? (qsL[subIndex - 1] || null) : (qsL[0] || null);
    if (!qL) return null;
    var transcriptLines, ttsItems;
    if (kind === 'l3') {
      var script = parent.script || [];
      transcriptLines = script.map(function (line) { return line.s + '：' + line.t; });
      ttsItems = script.map(function (line) { return { text: line.t, gender: line.s === 'W' ? 'female' : 'male', pauseMs: 350 }; });
    } else {
      transcriptLines = [parent.script || ''];
      ttsItems = [{ text: parent.script || '', pauseMs: 0 }];
    }
    return {
      id: id, partShort: info.short, partLabel: info.label, listening: true,
      summary: qL.q, stemNode: qL.q, settingZh: parent.setting_zh,
      options: qL.options || [], answer: qL.answer, explanation_zh: qL.explanation_zh,
      category: info.short,
      transcriptLines: transcriptLines, ttsItems: ttsItems
    };
  }

  // -----------------------------------------------------------------------
  // 資料整理：wrongBook → items
  // -----------------------------------------------------------------------

  function loadItems() {
    var wb = S.wrongBook;
    var today = S.today;
    return Object.keys(wb).map(function (id) {
      var rec = normalizeEntry(wb[id], today);
      var entry = buildEntry(id);
      var kind = idPrefixKind(id);
      return {
        id: id,
        count: rec.count,
        lastAt: rec.lastAt,
        mastered: rec.mastered,
        box: rec.box,
        due: rec.due,
        reason: rec.reason,
        reviews: rec.reviews,
        rights: rec.rights,
        isDue: !rec.mastered && (rec.due || today) <= today,
        partShort: entry ? entry.partShort : (kind && PART_INFO[kind] ? PART_INFO[kind].short : '？'),
        entry: entry
      };
    });
  }

  function refresh() {
    S.wrongBook = (Store.get().wrongBook) || {};
    S.items = loadItems();
    renderStats();
    renderReasonStats();
    renderList();
    renderCounts();
  }

  // -----------------------------------------------------------------------
  // 篩選 / 排序
  // -----------------------------------------------------------------------

  function filteredItems() {
    return S.items.filter(function (it) {
      if (S.filters.part !== 'all' && it.partShort !== S.filters.part) return false;
      if (S.filters.unmasteredOnly && it.mastered) return false;
      if (S.filters.dueOnly && !it.isDue) return false;
      if (S.filters.reason && it.reason !== S.filters.reason) return false;
      return true;
    });
  }

  function sortedItems(items) {
    var copy = items.slice();
    if (S.sort === 'time_desc') {
      copy.sort(function (a, b) { return (b.lastAt || '').localeCompare(a.lastAt || ''); });
    } else if (S.sort === 'due_asc') {
      copy.sort(function (a, b) {
        // 未精通且已到期的優先，其次依到期日、再依錯誤次數
        if (a.isDue !== b.isDue) return a.isDue ? -1 : 1;
        var d = (a.due || '').localeCompare(b.due || '');
        return d || (b.count - a.count);
      });
    } else {
      copy.sort(function (a, b) { return (b.count - a.count) || (b.lastAt || '').localeCompare(a.lastAt || ''); });
    }
    return copy;
  }

  // -----------------------------------------------------------------------
  // 統計長條圖
