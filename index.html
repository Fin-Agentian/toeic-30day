<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="多語言自學平台：多益英語 30 天衝刺、日語五十音到 N5、西班牙語 A1，全部離線可用。">
<title>多語言學習平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="開啟選單" aria-controls="sidebar" aria-expanded="false">
        <span aria-hidden="true">☰</span>
      </button>
      <a href="#/hub" class="brand" title="回語言選擇">
        <span class="brand-mark" aria-hidden="true">🌐</span>
        <span class="brand-name" id="brandName">多語言學習平台</span>
      </a>
    </div>
    <div class="topbar-right">
      <div class="pill pill-countdown" id="countdownPill" title="距考試天數">
        <span class="pill-icon" aria-hidden="true">⏳</span>
        <span id="countdownText">距考試 -- 天</span>
      </div>
      <div class="pill pill-day" id="dayPill" title="今日進度">
        <span id="dayText">Day -/30</span>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="切換主題" title="切換主題">🌓</button>
    </div>
  </header>

  <div class="app-body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <!-- 側欄項目由 js/app.js 依目前語言動態產生（見 Platform.LANGUAGES[].nav） -->
    <nav class="sidebar" id="sidebar" aria-label="主導覽">
      <ul class="sidebar-nav">
        <li><a href="#/hub" data-route="hub"><span class="nav-icon" aria-hidden="true">🌐</span><span>選擇語言</span></a></li>
      </ul>
    </nav>

    <main id="view" class="main-view" tabindex="-1" aria-live="polite">
      <div class="empty-state">
        <div class="empty-state-icon" aria-hidden="true">⏳</div>
        <h2>載入中…</h2>
        <p>正在準備你的學習內容，請稍候。</p>
      </div>
    </main>
  </div>

  <!-- tab 項目由 js/app.js 依目前語言動態產生 -->
  <nav class="bottom-tabbar" aria-label="主導覽（手機版）">
    <a href="#/hub" data-route="hub" class="tab-item">
      <span class="tab-icon" aria-hidden="true">🌐</span><span class="tab-label">選擇語言</span>
    </a>
  </nav>

</div>

<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
<div id="modal-root"></div>

<!-- data（依 DESIGN §3 順序；缺檔不影響其餘腳本載入，views 需友善處理空資料） -->
<script src="data/tips.js"></script>
<script src="data/plan.js"></script>
<script src="data/vocab_1.js"></script>
<script src="data/vocab_2.js"></script>
<script src="data/questions_p5_1.js"></script>
<script src="data/questions_p5_2.js"></script>
<script src="data/questions_p5_3.js"></script>
<script src="data/questions_p6.js"></script>
<script src="data/questions_p7_1.js"></script>
<script src="data/questions_p7_2.js"></script>
<script src="data/listening_1.js"></script>
<script src="data/listening_2.js"></script>
<script src="data/listening_3.js"></script>
<script src="data/reading_frameworks.js"></script>

<!-- data：日語 -->
<script src="data/ja_kana.js"></script>
<script src="data/ja_vocab_1.js"></script>
<script src="data/ja_grammar.js"></script>
<script src="data/ja_quiz_bank.js"></script>

<!-- data：西班牙語 -->
<script src="data/es_sounds.js"></script>
<script src="data/es_verbs.js"></script>
<script src="data/es_vocab_1.js"></script>
<script src="data/es_phrases.js"></script>

<!-- core -->
<script src="js/util.js"></script>
<script src="js/platform.js"></script>
<script src="js/store.js"></script>
<script src="js/langstore.js"></script>
<script src="js/srs.js"></script>
<script src="js/reading.js"></script>
<script src="js/tts.js"></script>
<script src="js/langui.js"></script>

<!-- views：平台入口 -->
<script src="js/views/hub.js"></script>

<!-- views：多益英語 -->
<script src="js/views/dashboard.js"></script>
<script src="js/views/plan.js"></script>
<script src="js/views/tips.js"></script>
<script src="js/views/quiz.js"></script>
<script src="js/views/reading.js"></script>
<script src="js/views/listening.js"></script>
<script src="js/views/vocab.js"></script>
<script src="js/views/mock.js"></script>
<script src="js/views/review.js"></script>
<script src="js/views/settings.js"></script>

<!-- views：日語 -->
<script src="js/views/ja.js"></script>

<!-- views：西班牙語 -->
<script src="js/views/es.js"></script>

<!-- app shell（最後載入） -->
<script src="js/app.js"></script>
</body>
</html>
